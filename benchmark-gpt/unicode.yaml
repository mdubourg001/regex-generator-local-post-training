    - "a\u0301bc"
    - "\u0301ab1"
    - "a\u0301\u0308b1"
    - "a\u0301b12"
    - "a\u0301b\u0661"
    - "a\u03011\u0301b"
    - "a\u0301bcdefghijk1"
    - "!a\u0301b1"
    - "a\u0301b1!"
    - "a\u0301b1\n"
    - "a\u0301b1\r"
    - "a\u0301b1\r\n"
    - "a\u0301b1\u2028"
    - "a\u0301b1\u2029"
