  regex: "/^(?=.{4,12}$)(?=.*\\p{M})(?=.*[0-9])(?!.*[0-9]{2})\\p{L}\\p{M}?(?:\\p{L}\\p{M}?|[0-9])*$(?![\\s\\S])/u"
