# Benchmark GPT, catégorie exclusions. Format et contrôles : scripts/benchmark.py.
- id: gpt-exclusions-01
  difficulty: simple
  status: ok
  description: >-
    A fallback field is exactly four lowercase ASCII letters, except the exact word null. No spaces or other characters.
  regex: "/^(?!null$)[a-z]{4}$(?![\\s\\S])/"
  match:
    - "aaaa"
    - "zzzz"
    - "abcd"
    - "wxyz"
    - "word"
    - "text"
    - "line"
    - "name"
  no_match:
    - "null"
    - "abc"
    - "abcde"
    - "Abcd"
    - "abc1"
    - "ab_c"
    - "a bc"
    - "!aaaa"
    - "aaaa!"
    - "aaaa\n"
    - "aaaa\r"
    - "aaaa\r\n"
    - "aaaa\u2028"
    - "aaaa\u2029"
    - " aaaa"
    - "aaaa "
  pitfall: >-
    A reserved word is an exact exclusion, not a substring ban.
- id: gpt-exclusions-02
  difficulty: simple
  status: ok
  description: >-
    A badge is exactly six ASCII digits except all zeros. Leading zeros are otherwise permitted.
  regex: "/^(?!000000$)[0-9]{6}$(?![\\s\\S])/"
  match:
    - "000001"
    - "999999"
    - "123456"
    - "654321"
    - "100000"
    - "010000"
    - "001000"
    - "000100"
  no_match:
    - "000000"
    - "00000"
    - "0000000"
    - "12345a"
    - "\uff11\uff12\uff13\uff14\uff15\uff16"
    - "12 456"
    - "+12345"
    - "!000001"
    - "000001!"
    - "000001\n"
    - "000001\r"
    - "000001\r\n"
    - "000001\u2028"
    - "000001\u2029"
    - " 000001"
    - "000001 "
  pitfall: >-
    Reject only the zero sentinel, not every zero-leading code.
- id: gpt-exclusions-03
  difficulty: simple
  status: ok
  description: >-
    A directory label is exactly five lowercase ASCII letters and must not start with tmp. No other characters.
  regex: "/^(?!tmp)[a-z]{5}$(?![\\s\\S])/"
  match:
    - "aaaaa"
    - "zzzzz"
    - "abcde"
    - "wxyza"
    - "tmabc"
    - "atmpa"
    - "tmapa"
    - "cache"
  no_match:
    - "tmpab"
    - "tmper"
    - "abcd"
    - "abcdef"
    - "Abcde"
    - "abc1e"
    - "ab_cd"
    - "!aaaaa"
    - "aaaaa!"
    - "aaaaa\n"
    - "aaaaa\r"
    - "aaaaa\r\n"
    - "aaaaa\u2028"
    - "aaaaa\u2029"
    - " aaaaa"
    - "aaaaa "
  pitfall: >-
    Only the initial substring is forbidden.
- id: gpt-exclusions-04
  difficulty: simple
  status: ok
  description: >-
    The token is exactly eight uppercase ASCII letters, with no letter I or O anywhere. Nothing else.
  regex: "/^[A-HJ-NP-Z]{8}$(?![\\s\\S])/"
  match:
    - "AAAAAAAA"
    - "ZZZZZZZZ"
    - "ABCDEFGH"
    - "JKLMNPQR"
    - "QWERTYAS"
    - "ZXCVBNMA"
    - "HHHHHHHH"
    - "XYZABCDE"
  no_match:
    - "IAAAAAAA"
    - "AAAAAAAO"
    - "AAAAIAA A"
    - "AAAAAAA"
    - "AAAAAAAAA"
    - "aaaaaaaa"
    - "AAAAAAA1"
    - "!AAAAAAAA"
    - "AAAAAAAA!"
    - "AAAAAAAA\n"
    - "AAAAAAAA\r"
    - "AAAAAAAA\r\n"
    - "AAAAAAAA\u2028"
    - "AAAAAAAA\u2029"
    - " AAAAAAAA"
    - "AAAAAAAA "
  pitfall: >-
    An excluded alphabet applies to every position.
- id: gpt-exclusions-05
  difficulty: simple
  status: ok
  description: >-
    A suffix key is exactly six lowercase ASCII letters, except it must not end in log. No spaces or other characters.
  regex: "/^(?![a-z]{3}log$)[a-z]{6}$(?![\\s\\S])/"
  match:
    - "aaaaaa"
    - "zzzzzz"
    - "abcdef"
    - "logabc"
    - "abclox"
    - "logger"
    - "fooabc"
    - "xyzzzz"
  no_match:
    - "abclog"
    - "xyzlog"
    - "loglog"
    - "abcde"
    - "abcdefg"
    - "ABCDEF"
    - "abcde1"
    - "!aaaaaa"
    - "aaaaaa!"
    - "aaaaaa\n"
    - "aaaaaa\r"
    - "aaaaaa\r\n"
    - "aaaaaa\u2028"
    - "aaaaaa\u2029"
    - " aaaaaa"
    - "aaaaaa "
  pitfall: >-
    The ban is on the final three letters, not any occurrence.
- id: gpt-exclusions-06
  difficulty: medium
  status: ok
  description: >-
    Form-validation ticket: A lowercase ASCII login has 6 to 12 letters, may not be exactly admins or system, and may not contain the substring test anywhere. No digits or punctuation.
  regex: "/^(?!admins$|system$)(?!.*test)[a-z]{6,12}$(?![\\s\\S])/"
  match:
    - "abcdef"
    - "abcdefghijkl"
    - "adminsx"
    - "systems"
    - "tesabc"
    - "tsetab"
    - "public"
    - "secret"
  no_match:
    - "system"
    - "admins"
    - "abtestcd"
    - "testing"
    - "abcde"
    - "abcdefghijklm"
    - "ABCDEF"
    - "abcde1"
    - "!abcdef"
    - "abcdef!"
    - "abcdef\n"
    - "abcdef\r"
    - "abcdef\r\n"
    - "abcdef\u2028"
    - "abcdef\u2029"
    - " abcdef"
    - "abcdef "
  pitfall: >-
    Exact reserved names and an internal substring ban are different rules.
- id: gpt-exclusions-07
  difficulty: medium
  status: ok
  description: >-
    A code is exactly eight ASCII letters or digits, includes at least one of each, and neither starts nor ends with a digit. The substring bad is forbidden in any ASCII letter case.
  regex: "/^(?=[A-Za-z0-9]{8}$)(?=.*[0-9])(?!.*bad)[A-Za-z][A-Za-z0-9]*[A-Za-z]$(?![\\s\\S])/i"
  match:
    - "a000000b"
    - "A1bcdefZ"
    - "abc123de"
    - "foo42bar"
    - "X999999Y"
    - "good123a"
    - "q1w2e3rt"
    - "z000000z"
  no_match:
    - "abcdefgh"
    - "1abcdefg"
    - "abcdefg1"
    - "aBAD12bc"
    - "xxbad12x"
    - "a00000b"
    - "a0000000b"
    - "abc_12de"
    - "!a000000b"
    - "a000000b!"
    - "a000000b\n"
    - "a000000b\r"
    - "a000000b\r\n"
    - "a000000b\u2028"
    - "a000000b\u2029"
    - " a000000b"
    - "a000000b "
  pitfall: >-
    Case-insensitive substring bans need not change the allowed alphabet.
- id: gpt-exclusions-08
  difficulty: medium
  status: ok
  description: >-
    A file label has 3 to 12 lowercase ASCII letters or digits, begins with a letter, and may contain internal single hyphens. It must not start with tmp- or end with -old. Count hyphens toward length; no adjacent or edge hyphens.
  regex: "/^(?=.{3,12}$)(?!tmp-)(?!.*-old$)[a-z][a-z0-9]*(?:-[a-z0-9]+)*$(?![\\s\\S])/"
  match:
    - "abc"
    - "a-b"
    - "tmpx-a"
    - "a-oldx"
    - "abcdefghijkl"
    - "file-1"
    - "old-file"
    - "tm-p"
  no_match:
    - "tmp-abc"
    - "abc-old"
    - "ab"
    - "abcdefghijklm"
    - "1abc"
    - "abc-"
    - "ab--c"
    - "Abc"
    - "!abc"
    - "abc!"
    - "abc\n"
    - "abc\r"
    - "abc\r\n"
    - "abc\u2028"
    - "abc\u2029"
    - " abc"
    - "abc "
  pitfall: >-
    Prefix and suffix bans are narrower than banning their words everywhere.
- id: gpt-exclusions-09
  difficulty: medium
  status: ok
  description: >-
    A booking slot is slot- plus a canonical integer 1 through 64, except 13 and 42 are reserved. No padding or spaces.
  regex: "/^slot-(?!13$|42$)(?:[1-9]|[1-5][0-9]|6[0-4])$(?![\\s\\S])/"
  match:
    - "slot-1"
    - "slot-64"
    - "slot-12"
    - "slot-14"
    - "slot-41"
    - "slot-43"
    - "slot-9"
    - "slot-10"
  no_match:
    - "slot-13"
    - "slot-42"
    - "slot-0"
    - "slot-65"
    - "slot-01"
    - "slot-+1"
    - "slot-1.0"
    - "!slot-1"
    - "slot-1!"
    - "slot-1\n"
    - "slot-1\r"
    - "slot-1\r\n"
    - "slot-1\u2028"
    - "slot-1\u2029"
    - " slot-1"
    - "slot-1 "
  pitfall: >-
    Reserved values are exclusions inside an otherwise valid numeric range.
- id: gpt-exclusions-10
  difficulty: medium
  status: ok
  description: >-
    Import gate — reject any nonconforming input. An eight-character lowercase ASCII hexadecimal token must include at least one letter a through f, and cannot be all f characters. No separators.
  regex: "/^(?=.*[a-f])(?!ffffffff$)[0-9a-f]{8}$(?![\\s\\S])/"
  match:
    - "a0000000"
    - "0000000f"
    - "abcdef12"
    - "deadbeef"
    - "fffffffe"
    - "f0000000"
    - "12ab3456"
    - "9999999a"
  no_match:
    - "00000000"
    - "12345678"
    - "ffffffff"
    - "a000000"
    - "a00000000"
    - "A0000000"
    - "g0000000"
    - "!a0000000"
    - "a0000000!"
    - "a0000000\n"
    - "a0000000\r"
    - "a0000000\r\n"
    - "a0000000\u2028"
    - "a0000000\u2029"
    - " a0000000"
    - "a0000000 "
  pitfall: >-
    The letter-presence rule and all-f sentinel are independent.
- id: gpt-exclusions-11
  difficulty: medium
  status: ok
  description: >-
    Search filter, not whole-input validation. Search for a lowercase ASCII name 3 to 8 letters immediately between name= and semicolon, excluding the exact names tmp and null. Other text may be anything.
  regex: "/(?<=name=)(?!tmp;|null;)[a-z]{3,8}(?=;)/"
  match:
    - "name=abc;"
    - "name=xyz;"
    - "name=abcdefgh;"
    - "name=tmpx;"
    - "before name=nulls; after"
    - "before name=label; after"
    - "before name=sample; after"
    - "before name=value; after"
  no_match:
    - "name=tmp;"
    - "name=null;"
    - "name=ab;"
    - "name=abcdefghi;"
    - "name=ABC;"
    - "name=ab1;"
    - "name=ab_;"
    - "name=ab\u00e9;"
    - "NAME=abc;"
    - "name=abc ;"
  pitfall: >-
    Search anywhere, but require the exact local context and the entire bounded token.
- id: gpt-exclusions-12
  difficulty: medium
  status: ok
  description: >-
    Search arbitrary text for the lowercase token allow when immediately preceded by colon but not by deny: (the five characters immediately before allow). It must be followed by semicolon. Other occurrences or surrounding text do not matter.
  regex: "/(?<=:)(?<!deny:)allow(?=;)/"
  match:
    - "x:allow;"
    - ":allow;"
    - "okay:allow;"
    - "before x:allow; after"
    - "denyx:allow;"
    - "Deny:allow;"
    - "a\n:allow;\nb"
    - "deny:allow; x:allow;"
  no_match:
    - "deny:allow;"
    - "allow;"
    - "x:allow "
    - "x:Allow;"
    - "x:allows;"
    - "x:allow"
    - "deny:allow; deny:allow;"
    - "x: allow;"
  pitfall: >-
    A negative left context applies per occurrence, not to the entire document.
- id: gpt-exclusions-13
  difficulty: medium
  status: ok
  description: >-
    A whitespace-free task key is 4 to 16 lowercase ASCII letters, digits or underscores, must start with a letter, and must not contain __, end in underscore, or be exactly none.
  regex: "/^(?!none$)(?!.*__)(?=[a-z0-9_]{4,16}$)[a-z][a-z0-9_]*[a-z0-9]$(?![\\s\\S])/"
  match:
    - "abcd"
    - "a_bc"
    - "a1_2"
    - "abcdefghijklmnop"
    - "none1"
    - "foo_bar"
    - "x123"
    - "a_b_c_d_e_f_g_h1"
  no_match:
    - "none"
    - "ab__c"
    - "abc_"
    - "abc"
    - "abcdefghijklmnopq"
    - "1abc"
    - "Abcd"
    - "ab-c"
    - "!abcd"
    - "abcd!"
    - "abcd\n"
    - "abcd\r"
    - "abcd\r\n"
    - "abcd\u2028"
    - "abcd\u2029"
    - " abcd"
    - "abcd "
  pitfall: >-
    Length and endpoint checks do not enforce the exact exclusions.
- id: gpt-exclusions-14
  difficulty: hard
  status: ok
  description: >-
    A pair record is two different lowercase ASCII words 3 to 8 letters separated by slash. Neither word may be root or null. No spaces or other text.
  regex: "/^(?!root\\/|null\\/)([a-z]{3,8})\\/(?!\\1$|root$|null$)[a-z]{3,8}$(?![\\s\\S])/"
  match:
    - "abc/xyz"
    - "xyz/abc"
    - "abcdefgh/value"
    - "roots/nulls"
    - "foo/bar"
    - "left/right"
    - "one/two"
    - "name/label"
  no_match:
    - "abc/abc"
    - "root/abc"
    - "abc/root"
    - "null/abc"
    - "abc/null"
    - "ab/xyz"
    - "abc/abcdefghi"
    - "ABC/xyz"
    - "!abc/xyz"
    - "abc/xyz!"
    - "abc/xyz\n"
    - "abc/xyz\r"
    - "abc/xyz\r\n"
    - "abc/xyz\u2028"
    - "abc/xyz\u2029"
    - " abc/xyz"
    - "abc/xyz "
  pitfall: >-
    Exact exclusions and equality must be checked on both fields.
- id: gpt-exclusions-15
  difficulty: hard
  status: ok
  description: >-
    Code review requirement: A six-digit ASCII control code starts nonzero, has no adjacent repeated digit, and must not contain the substring 123 anywhere. No checksum or other characters.
  regex: "/^(?!.*123)(?![0-9]*([0-9])\\1)[1-9][0-9]{5}$(?![\\s\\S])/"
  match:
    - "102345"
    - "987654"
    - "101010"
    - "909090"
    - "246810"
    - "135790"
    - "120345"
    - "543210"
  no_match:
    - "012345"
    - "112345"
    - "122345"
    - "102344"
    - "123456"
    - "991234"
    - "10123"
    - "1023456"
    - "10234a"
    - "!102345"
    - "102345!"
    - "102345\n"
    - "102345\r"
    - "102345\r\n"
    - "102345\u2028"
    - "102345\u2029"
    - " 102345"
    - "102345 "
  pitfall: >-
    Adjacent repeats and a multi-digit forbidden substring are independent.
- id: gpt-exclusions-16
  difficulty: hard
  status: ok
  description: >-
    An international alias contains 4 through 12 Unicode letters, includes uppercase and lowercase letters, has no adjacent identical code points, and must not contain any ASCII digit or combining mark. No normalization, spaces or other characters.
  regex: "/^(?=.{4,12}$)(?=.*\\p{Lu})(?=.*\\p{Ll})(?!.*(\\p{L})\\1)\\p{L}+$(?![\\s\\S])/u"
  match:
    - "Abcd"
    - "\u00c9t\u00e9A"
    - "\u0391\u03b2\u0393\u03b4"
    - "\u0417\u0438\u043c\u0430"
    - "\u00c5a\u00c5a"
    - "Abcdefghijkl"
    - "\u0141\u00f3d\u017a"
    - "Na\u00efve"
  no_match:
    - "ABCD"
    - "abcd"
    - "Abc"
    - "Abcdefghijklm"
    - "AbbC"
    - "A\u00e9\u00e9B"
    - "Ab1c"
    - "e\u0301Abc"
    - "Ab c"
    - "!Abcd"
    - "Abcd!"
    - "Abcd\n"
    - "Abcd\r"
    - "Abcd\r\n"
    - "Abcd\u2028"
    - "Abcd\u2029"
    - " Abcd"
    - "Abcd "
  pitfall: >-
    Case categories and exact adjacent equality apply across scripts.
- id: gpt-exclusions-17
  difficulty: hard
  status: ok
  description: >-
    A quarantined note: the entire string has the literal opening wrapper SAFE{, a lowercase ASCII routing label of 2 through 6 letters, colon, a body, colon, the exact same routing label and the literal closing wrapper }SAFE. The body has 1 through 40 Unicode code points, allows any characters including line breaks and colons, and must contain the lowercase substring clean. Only the body counts toward its length limit; no other text is allowed. The body must not contain the lowercase substring virus.
  regex: "/^SAFE\\{(?<route>[a-z]{2,6}):(?!.*virus.*:\\k<route>\\}SAFE$)(?=.{1,40}:\\k<route>\\}SAFE$)(?=.{0,40}clean.{0,40}:\\k<route>\\}SAFE$).*:\\k<route>\\}SAFE$(?![\\s\\S])/su"
  match:
    - "SAFE{aa:clean:aa}SAFE"
    - "SAFE{abcdef:aclean:abcdef}SAFE"
    - "SAFE{tag:cleanb:tag}SAFE"
    - "SAFE{route:\nclean:route}SAFE"
    - "SAFE{memo:clean\n:memo}SAFE"
    - "SAFE{ab:\tclean:ab}SAFE"
    - "SAFE{zz:\U0001f600clean:zz}SAFE"
    - "SAFE{key:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxclean:key}SAFE"
    - "SAFE{xy:\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600clean:xy}SAFE"
    - "SAFE{aa:prefix: clean: suffix:aa}SAFE"
    - "SAFE{virus:clean:virus}SAFE"
  no_match:
    - "SAFE{aa::aa}SAFE"
    - "SAFE{aa:abc:aa}SAFE"
    - "SAFE{aa:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxclean:aa}SAFE"
    - "SAFE{aa:clean:ab}SAFE"
    - "SAFE{a:clean:a}SAFE"
    - "SAFE{abcdefg:clean:abcdefg}SAFE"
    - "SAFE{AA:clean:AA}SAFE"
    - "SAFE{aa:CLEAN:aa}SAFE"
    - "SAFE{aa:clean:aa"
    - "aa:clean:aa}SAFE"
    - "SAFE{aa:\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600clean:aa}SAFE"
    - "SAFE{clean:abc:clean}SAFE"
    - "!SAFE{aa:clean:aa}SAFE"
    - "SAFE{aa:clean:aa}SAFE!"
    - "SAFE{aa:clean:aa}SAFE\n"
    - "SAFE{aa:clean:aa}SAFE\r"
    - "SAFE{aa:clean:aa}SAFE\r\n"
    - "SAFE{aa:clean:aa}SAFE\u2028"
    - "SAFE{aa:clean:aa}SAFE\u2029"
    - " SAFE{aa:clean:aa}SAFE"
    - "SAFE{aa:clean:aa}SAFE "
    - "SAFE{aa:cleanvirus:aa}SAFE"
    - "SAFE{aa:virus\nclean:aa}SAFE"
  pitfall: >-
    Repeat the routing label exactly, count only body code points including line breaks, and require the marker inside that body.
- id: gpt-exclusions-18
  difficulty: hard
  status: ok
  description: >-
    An LF-only exclusion receipt has key= followed by 3 to 8 lowercase ASCII letters other than root or null, then copy= and the exact same word. No final LF or spaces. Both values must be enclosed in matching ASCII single or double quotes, using the same quote character on both lines. The quotes are delimiters, not part of the value; no escapes are permitted.
  regex: "/^key=(['\\\"])((?!root['\\\"]|null['\\\"])[a-z]{3,8})\\1\\ncopy=\\1\\2\\1$(?![\\s\\S])/"
  match:
    - "key='abc'\ncopy='abc'"
    - "key=\"xyz\"\ncopy=\"xyz\""
    - "key='abcdefgh'\ncopy='abcdefgh'"
    - "key=\"roots\"\ncopy=\"roots\""
    - "key='nulls'\ncopy='nulls'"
    - "key=\"label\"\ncopy=\"label\""
    - "key='sample'\ncopy='sample'"
    - "key=\"value\"\ncopy=\"value\""
  no_match:
    - "key='abc'\ncopy='xyz'"
    - "key='abc\r'\ncopy='abc'"
    - "key=abc copy=abc"
    - "key=abc\nCopy=abc"
    - "key='?'\ncopy='?'"
    - "key='abc'\ncopy='abc '"
    - "key='!!!'\ncopy='!!!'"
    - "key='ab'\ncopy='ab'"
    - "key='abc0'\ncopy='abc0'"
    - "key='000'\ncopy='000'"
    - "key='abc\"\ncopy='abc'"
    - "key='abc'\ncopy=\"abc\""
    - "key=abc\ncopy=abc"
    - "key='abc'\r\ncopy='abc'"
    - "!key='abc'\ncopy='abc'"
    - "key='abc'\ncopy='abc'!"
    - "key='abc'\ncopy='abc'\n"
    - "key='abc'\ncopy='abc'\r"
    - "key='abc'\ncopy='abc'\r\n"
    - "key='abc'\ncopy='abc'\u2028"
    - "key='abc'\ncopy='abc'\u2029"
    - " key='abc'\ncopy='abc'"
    - "key='abc'\ncopy='abc' "
    - "key='root'\ncopy='root'"
    - "key='null'\ncopy='null'"
  pitfall: >-
    The exact value and quote convention must agree across LF-separated lines, in addition to the value policy.
- id: gpt-exclusions-19
  difficulty: hard
  status: ok
  description: >-
    Acceptance criteria:
    - A namespaced selector has three lowercase ASCII words 3 through 8 letters joined by colons. All three must differ; none may be root. No spaces or other characters.
    - Evaluate the input as supplied; do not trim or normalize it.
  regex: "/^(?!root:)([a-z]{3,8}):(?!\\1:|root:)([a-z]{3,8}):(?!\\1$|\\2$|root$)[a-z]{3,8}$(?![\\s\\S])/"
  match:
    - "one:two:three"
    - "red:blue:green"
    - "alpha:beta:gamma"
    - "abc:def:ghi"
    - "roots:rooted:router"
