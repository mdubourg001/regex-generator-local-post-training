    - "route='ab'\ncopy='ab'"
    - "route='abc0'\ncopy='abc0'"
    - "route='000'\ncopy='000'"
    - "route='abc\"\ncopy='abc'"
    - "route='abc'\ncopy=\"abc\""
    - "route=abc\ncopy=abc"
    - "route='abc'\r\ncopy='abc'"
    - "!route='abc'\ncopy='abc'"
    - "route='abc'\ncopy='abc'!"
    - "route='abc'\ncopy='abc'\n"
    - "route='abc'\ncopy='abc'\r"
    - "route='abc'\ncopy='abc'\r\n"
    - "route='abc'\ncopy='abc'\u2028"
    - "route='abc'\ncopy='abc'\u2029"
    - " route='abc'\ncopy='abc'"
    - "route='abc'\ncopy='abc' "
  pitfall: >-
