    - "/tenant/xyz/mirror/xyz"
    - "/tenant/abcdefgh/mirror/abcdefgh"
    - "/tenant/adminx/mirror/adminx"
    - "/tenant/roots/mirror/roots"
    - "/tenant/foo/mirror/foo"
    - "/tenant/team/mirror/team"
    - "/tenant/widget/mirror/widget"
  no_match:
