- id: gpt-web-19
  difficulty: hard
  status: ok
  description: >-
    Acceptance criteria:
    - Validate exactly /tenant/<name>/mirror/<name>, where both names are the same lowercase ASCII slug of 3 to 8 letters. The reserved names admin and root are forbidden; no other components or trailing slash.
    - Evaluate the input as supplied; do not trim or normalize it.
  regex: "/^\\/tenant\\/(?!admin\\/|root\\/)([a-z]{3,8})\\/mirror\\/\\1$(?![\\s\\S])/"
  match:
