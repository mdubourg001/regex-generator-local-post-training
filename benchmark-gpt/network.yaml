# Benchmark GPT, catégorie network. Format et contrôles : scripts/benchmark.py.
- id: gpt-network-01
  difficulty: simple
  status: ok
  description: >-
    The packet label is pkt: followed by exactly eight uppercase hexadecimal characters.
  regex: "/^pkt:[0123456789ABCDEF]{8}$(?![\\s\\S])/"
  match:
    - "pkt:00000000"
    - "pkt:FFFFFFFF"
    - "pkt:88888888"
    - "pkt:0F0F0F0F"
    - "pkt:F0F0F0F0"
    - "pkt:0FFFFFFF"
    - "pkt:F0000000"
    - "pkt:80000000"
  no_match:
    - "pkt:0000000"
    - "pkt:000000000"
    - "pkt:?0000000"
    - "pkt: 0000000"
    - "pkt:0000000\u00e9"
    - "pkt:00000000\t"
    - "pkt?00000000"
    - "pkt:a0000000"
    - "!pkt:00000000"
    - "pkt:00000000!"
    - "pkt:00000000\n"
    - "pkt:00000000\r"
    - "pkt:00000000\r\n"
    - "pkt:00000000\u2028"
    - "pkt:00000000\u2029"
    - " pkt:00000000"
    - "pkt:00000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-network-02
  difficulty: simple
  status: ok
  description: >-
    A switch nickname is sw- followed by exactly four lowercase ASCII letters. No digits or spaces.
  regex: "/^sw\\-[abcdefghijklmnopqrstuvwxyz]{4}$(?![\\s\\S])/"
  match:
    - "sw-aaaa"
    - "sw-zzzz"
    - "sw-nnnn"
    - "sw-azaz"
    - "sw-zaza"
    - "sw-azzz"
    - "sw-zaaa"
    - "sw-naaa"
  no_match:
    - "sw-aaa"
    - "sw-aaaaa"
    - "sw-?aaa"
    - "sw- aaa"
    - "sw-aaa\u00e9"
    - "sw-aaaa\t"
    - "sw?aaaa"
    - "sw-Aaaa"
    - "!sw-aaaa"
    - "sw-aaaa!"
    - "sw-aaaa\n"
    - "sw-aaaa\r"
    - "sw-aaaa\r\n"
    - "sw-aaaa\u2028"
    - "sw-aaaa\u2029"
    - " sw-aaaa"
    - "sw-aaaa "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-network-03
  difficulty: simple
  status: ok
  description: >-
    A frame counter field is RX= followed by exactly six ASCII digits, with leading zeros allowed.
  regex: "/^RX=[0123456789]{6}$(?![\\s\\S])/"
  match:
    - "RX=000000"
    - "RX=999999"
    - "RX=555555"
    - "RX=090909"
    - "RX=909090"
    - "RX=099999"
    - "RX=900000"
    - "RX=500000"
  no_match:
    - "RX=00000"
    - "RX=0000000"
    - "RX=?00000"
    - "RX= 00000"
    - "RX=00000\u00e9"
    - "RX=000000\t"
    - "RX?000000"
    - "!RX=000000"
    - "RX=000000!"
    - "RX=000000\n"
    - "RX=000000\r"
    - "RX=000000\r\n"
    - "RX=000000\u2028"
    - "RX=000000\u2029"
    - " RX=000000"
    - "RX=000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-network-04
  difficulty: simple
  status: ok
  description: >-
    A vendor prefix is exactly six lowercase hexadecimal characters followed by literal /vendor. No separators within the prefix.
  regex: "/^[0123456789abcdef]{6}\\/vendor$(?![\\s\\S])/"
  match:
    - "000000/vendor"
    - "ffffff/vendor"
    - "888888/vendor"
    - "0f0f0f/vendor"
    - "f0f0f0/vendor"
    - "0fffff/vendor"
    - "f00000/vendor"
    - "800000/vendor"
  no_match:
    - "00000/vendor"
    - "0000000/vendor"
    - "?00000/vendor"
    - " 00000/vendor"
    - "00000\u00e9/vendor"
    - "000000\t/vendor"
    - "000000?vendor"
    - "A00000/vendor"
    - "!000000/vendor"
    - "000000/vendor!"
    - "000000/vendor\n"
    - "000000/vendor\r"
    - "000000/vendor\r\n"
    - "000000/vendor\u2028"
    - "000000/vendor\u2029"
    - " 000000/vendor"
    - "000000/vendor "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
