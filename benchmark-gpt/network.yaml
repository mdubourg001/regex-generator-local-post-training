  no_match:
    - "VAAAA"
    - "VAAAAAA"
    - "V?AAAA"
    - "V AAAA"
    - "VAAAA\u00e9"
    - "VAAAAA\t"
    - "?AAAAA"
    - "VaAAAA"
    - "!VAAAAA"
    - "VAAAAA!"
    - "VAAAAA\n"
    - "VAAAAA\r"
    - "VAAAAA\r\n"
    - "VAAAAA\u2028"
    - "VAAAAA\u2029"
    - " VAAAAA"
    - "VAAAAA "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-network-06
  difficulty: medium
  status: ok
  description: >-
    Form-validation ticket: The lab subnet suffix is exactly 10.7.9. followed by a host number 1 through 62 in shortest decimal spelling. No port or whitespace.
  regex: "/^10\\.7\\.9\\.(?:[1-9]|[1-5][0-9]|6[0-2])$(?![\\s\\S])/"
  match:
    - "10.7.9.1"
    - "10.7.9.2"
    - "10.7.9.3"
    - "10.7.9.60"
    - "10.7.9.61"
    - "10.7.9.62"
    - "10.7.9.31"
    - "10.7.9.32"
  no_match:
    - "10.7.9.0"
    - "10.7.9.63"
    - "10.7.9.01"
    - "10.7.9.+1"
    - "10.7.9.1.0"
    - "10.7.9. 1"
    - "10.7.9.620"
    - "!10.7.9.1"
    - "10.7.9.1!"
    - "10.7.9.1\n"
    - "10.7.9.1\r"
    - "10.7.9.1\r\n"
    - "10.7.9.1\u2028"
    - "10.7.9.1\u2029"
    - " 10.7.9.1"
    - "10.7.9.1 "
  pitfall: >-
    Endpoints and canonical decimal spelling must both be enforced.
- id: gpt-network-07
  difficulty: medium
  status: ok
  description: >-
    A MAC-like inventory address is six pairs of uppercase hexadecimal digits separated by colons, followed by /L2. Only format is checked.
  regex: "/^(?:[0-9A-F]{2}:){5}[0-9A-F]{2}\\/L2$(?![\\s\\S])/"
  match:
    - "00:00:00:00:00:00/L2"
    - "FF:FF:FF:FF:FF:FF/L2"
    - "01:23:45:67:89:AB/L2"
    - "AB:CD:EF:01:23:45/L2"
    - "10:20:30:40:50:60/L2"
    - "AA:BB:CC:DD:EE:FF/L2"
    - "12:34:56:78:90:AB/L2"
    - "F0:0F:A0:0A:B0:0B/L2"
  no_match:
    - "00:00:00:00:00/L2"
    - "00:00:00:00:00:00:00/L2"
    - "aa:BB:CC:DD:EE:FF/L2"
    - "GG:00:00:00:00:00/L2"
    - "00-00-00-00-00-00/L2"
    - "0:00:00:00:00:00/L2"
    - "!00:00:00:00:00:00/L2"
    - "00:00:00:00:00:00/L2!"
    - "00:00:00:00:00:00/L2\n"
    - "00:00:00:00:00:00/L2\r"
    - "00:00:00:00:00:00/L2\r\n"
    - "00:00:00:00:00:00/L2\u2028"
    - "00:00:00:00:00:00/L2\u2029"
    - " 00:00:00:00:00:00/L2"
    - "00:00:00:00:00:00/L2 "
  pitfall: >-
    Pair width and repeated separator count both matter.
- id: gpt-network-08
  difficulty: medium
  status: ok
  description: >-
    An allowed VLAN field is vlan= and an integer 10 through 64 inclusive, no leading zeros or sign.
  regex: "/^vlan=(?:[1-5][0-9]|6[0-4])$(?![\\s\\S])/"
  match:
    - "vlan=10"
    - "vlan=11"
    - "vlan=12"
    - "vlan=62"
    - "vlan=63"
    - "vlan=64"
    - "vlan=37"
    - "vlan=38"
  no_match:
    - "vlan=9"
    - "vlan=65"
    - "vlan=010"
    - "vlan=+10"
    - "vlan=10.0"
    - "vlan= 10"
    - "vlan=640"
    - "!vlan=10"
    - "vlan=10!"
    - "vlan=10\n"
    - "vlan=10\r"
    - "vlan=10\r\n"
    - "vlan=10\u2028"
    - "vlan=10\u2029"
    - " vlan=10"
    - "vlan=10 "
  pitfall: >-
    Endpoints and canonical decimal spelling must both be enforced.
- id: gpt-network-09
  difficulty: medium
  status: ok
  description: >-
    An interface name is eth followed by an integer 0 through 15 without leading zeros, optionally dot and a VLAN 1 through 99 without leading zeros.
  regex: "/^eth(?:[0-9]|1[0-5])(?:\\.[1-9][0-9]?)?$(?![\\s\\S])/"
  match:
    - "eth0"
    - "eth15"
    - "eth0.1"
    - "eth15.99"
    - "eth9"
    - "eth10.10"
    - "eth1.9"
    - "eth14.50"
  no_match:
    - "eth16"
    - "eth00"
    - "eth1.0"
    - "eth1.100"
    - "eth1.01"
    - "Eth1"
    - "eth1x1"
    - "!eth0"
    - "eth0!"
    - "eth0\n"
    - "eth0\r"
    - "eth0\r\n"
    - "eth0\u2028"
    - "eth0\u2029"
    - " eth0"
    - "eth0 "
  pitfall: >-
    The base interface and optional VLAN use different lower bounds.
- id: gpt-network-10
  difficulty: medium
  status: ok
  description: >-
    Import gate — reject any nonconforming input. A local endpoint is exactly tcp://node.test: followed by a port from 9000 through 9099. No path or spaces.
  regex: "/^tcp:\\/\\/node\\.test:90[0-9]{2}$(?![\\s\\S])/"
  match:
    - "tcp://node.test:9000"
    - "tcp://node.test:9001"
    - "tcp://node.test:9009"
    - "tcp://node.test:9010"
    - "tcp://node.test:9050"
    - "tcp://node.test:9097"
    - "tcp://node.test:9098"
    - "tcp://node.test:9099"
  no_match:
    - "tcp://node.test:8999"
    - "tcp://node.test:9100"
    - "tcp://node.test:900"
    - "tcp://node.test:90000"
    - "udp://node.test:9000"
    - "tcp://nodeXtest:9000"
    - "!tcp://node.test:9000"
    - "tcp://node.test:9000!"
    - "tcp://node.test:9000\n"
    - "tcp://node.test:9000\r"
    - "tcp://node.test:9000\r\n"
    - "tcp://node.test:9000\u2028"
    - "tcp://node.test:9000\u2029"
    - " tcp://node.test:9000"
    - "tcp://node.test:9000 "
    - "tcp://node.test:90xx"
  pitfall: >-
    A fixed port band is stricter than generic valid ports.
- id: gpt-network-11
  difficulty: medium
  status: ok
  description: >-
    Search filter, not whole-input validation. Search for a TTL number from 1 through 64 in shortest decimal spelling, immediately after lowercase ttl= and before semicolon, anywhere in the text.
  regex: "/(?<=ttl=)(?:[1-9]|[1-5][0-9]|6[0-4])(?=;)/"
  match:
    - "ttl=1;"
    - "ttl=2;"
    - "ttl=9;"
    - "ttl=10;"
    - "before ttl=20; after"
    - "before ttl=50; after"
    - "before ttl=63; after"
    - "before ttl=64; after"
  no_match:
    - "ttl=0;"
    - "ttl=65;"
    - "ttl=01;"
    - "ttl=+1;"
    - "ttl=1.0;"
    - "ttl=a;"
    - "TTL=1;"
    - "ttl=1 ;"
  pitfall: >-
    Search anywhere, but require the exact local context and the entire bounded token.
- id: gpt-network-12
  difficulty: medium
  status: ok
  description: >-
    Find a four-character uppercase hexadecimal protocol code between proto[ and ]. Surrounding text is unrestricted and the marker is case sensitive.
  regex: "/(?<=proto\\[)[0-9A-F]{4}(?=\\])/"
  match:
    - "proto[0000]"
    - "proto[FFFF]"
    - "proto[ABCD]"
    - "proto[1234]"
    - "before proto[00FF] after"
    - "before proto[FF00] after"
    - "before proto[A001] after"
    - "before proto[99AA] after"
  no_match:
    - "proto[000]"
    - "proto[00000]"
    - "proto[abcd]"
    - "proto[G000]"
    - "proto[a000]"
    - "proto[!000]"
    - "PROTO[0000]"
    - "proto[0000 ]"
  pitfall: >-
    Search anywhere, but require the exact local context and the entire bounded token.
- id: gpt-network-13
  difficulty: medium
  status: ok
  description: >-
    An IPv6 hextet display is exactly eight uppercase hexadecimal groups, each four characters, separated by colons, prefixed with ip6:. Compression and lowercase are forbidden; format only.
  regex: "/^ip6:(?:[0-9A-F]{4}:){7}[0-9A-F]{4}$(?![\\s\\S])/"
  match:
    - "ip6:0000:0000:0000:0000:0000:0000:0000:0000"
    - "ip6:FFFF:FFFF:FFFF:FFFF:FFFF:FFFF:FFFF:FFFF"
    - "ip6:0001:0002:0003:0004:0005:0006:0007:0008"
    - "ip6:ABCD:1234:5678:90AB:CDEF:0000:0001:0002"
    - "ip6:AAAA:BBBB:CCCC:DDDD:EEEE:FFFF:0000:1111"
    - "ip6:1000:2000:3000:4000:5000:6000:7000:8000"
    - "ip6:0000:0000:0000:0000:0000:0000:0000:0001"
    - "ip6:FE80:0000:0000:0000:0000:0000:0000:0001"
  no_match:
    - "ip6:0:0000:0000:0000:0000:0000:0000:0000"
    - "ip6:0000:0000:0000:0000:0000:0000:0000"
    - "ip6:0000:0000:0000:0000:0000:0000:0000:0000:0000"
    - "ip6:fe80:0000:0000:0000:0000:0000:0000:0001"
    - "ip6:GGGG:0000:0000:0000:0000:0000:0000:0000"
    - "ip6:::1"
    - "!ip6:0000:0000:0000:0000:0000:0000:0000:0000"
    - "ip6:0000:0000:0000:0000:0000:0000:0000:0000!"
    - "ip6:0000:0000:0000:0000:0000:0000:0000:0000\n"
    - "ip6:0000:0000:0000:0000:0000:0000:0000:0000\r"
    - "ip6:0000:0000:0000:0000:0000:0000:0000:0000\r\n"
    - "ip6:0000:0000:0000:0000:0000:0000:0000:0000\u2028"
    - "ip6:0000:0000:0000:0000:0000:0000:0000:0000\u2029"
    - " ip6:0000:0000:0000:0000:0000:0000:0000:0000"
    - "ip6:0000:0000:0000:0000:0000:0000:0000:0000 "
  pitfall: >-
    Fixed expanded groups deliberately exclude otherwise valid IPv6 forms.
- id: gpt-network-14
  difficulty: hard
  status: ok
  description: >-
    A link check starts peer: and has two identical lowercase ASCII host labels 3 through 8 letters long, separated by slash. No domain suffix or spaces. Each of the two values must be enclosed in matching ASCII single or double quotes; the same quote character must be used for both values. Quotes are not part of the value, and escapes are not permitted.
  regex: "/^peer:(['\\\"])([a-z]{3,8})\\1\\/\\1\\2\\1$(?![\\s\\S])/"
  match:
    - "peer:'abc'/'abc'"
    - "peer:\"xyz\"/\"xyz\""
    - "peer:'abcdefgh'/'abcdefgh'"
    - "peer:\"router\"/\"router\""
    - "peer:'switch'/'switch'"
    - "peer:\"node\"/\"node\""
    - "peer:'proxy'/'proxy'"
    - "peer:\"sample\"/\"sample\""
  no_match:
    - "peer:'abc'/'xyz'"
    - "peer:'abc'/'abcabc'"
    - "peer:'?'/'?'"
    - "peer:'abc '/'abc'"
    - "peer:'abc'/' abc'"
    - "peer:'abc'/'abc/abc'"
    - "peer:'!!!'/'!!!'"
    - "peer:'ab'/'ab'"
    - "peer:'abc0'/'abc0'"
    - "peer:'000'/'000'"
    - "peer:'abc\"/'abc'"
    - "peer:'abc'/\"abc\""
    - "peer:abc/abc"
    - "!peer:'abc'/'abc'"
    - "peer:'abc'/'abc'!"
    - "peer:'abc'/'abc'\n"
    - "peer:'abc'/'abc'\r"
    - "peer:'abc'/'abc'\r\n"
    - "peer:'abc'/'abc'\u2028"
    - "peer:'abc'/'abc'\u2029"
    - " peer:'abc'/'abc'"
    - "peer:'abc'/'abc' "
  pitfall: >-
    Quote style, both closing quotes, value policy and exact value repetition must all agree.
- id: gpt-network-15
  difficulty: hard
  status: ok
  description: >-
    Code review requirement: A unicast lab address is exactly 192.168.4. followed by a canonical decimal host 1 through 254 and slash prefix length 24 through 30. No leading zeros in either variable field.
  regex: "/^192\\.168\\.4\\.(?:[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4])\\/(?:2[4-9]|30)$(?![\\s\\S])/"
  match:
    - "192.168.4.1/24"
    - "192.168.4.254/30"
    - "192.168.4.9/25"
    - "192.168.4.10/26"
    - "192.168.4.99/27"
    - "192.168.4.100/28"
    - "192.168.4.249/29"
    - "192.168.4.250/30"
  no_match:
    - "192.168.4.0/24"
    - "192.168.4.255/24"
    - "192.168.4.01/24"
    - "192.168.4.1/23"
    - "192.168.4.1/31"
    - "192.168.5.1/24"
    - "192X168.4.1/24"
    - "!192.168.4.1/24"
    - "192.168.4.1/24!"
    - "192.168.4.1/24\n"
    - "192.168.4.1/24\r"
    - "192.168.4.1/24\r\n"
    - "192.168.4.1/24\u2028"
    - "192.168.4.1/24\u2029"
    - " 192.168.4.1/24"
    - "192.168.4.1/24 "
    - "192.168.4.1000/24"
  pitfall: >-
    Host and prefix ranges are independent and dots are literal.
- id: gpt-network-16
  difficulty: hard
  status: ok
  description: >-
    A network display alias: the literal prefix net: followed by 2 through 12 Unicode letter clusters. Each cluster is a Unicode letter followed by zero to two Unicode combining marks. One optional ASCII hyphen may join two nonempty runs of clusters, but no edge hyphen or second hyphen is allowed. Length counts letter clusters, excluding the hyphen and any fixed prefix; spaces, digits and other characters are forbidden. No normalization is performed.
  regex: "/^net:(?=(?:\\p{L}\\p{M}{0,2}-?){2,12}$)(?:\\p{L}\\p{M}{0,2}){1,12}(?:-(?:\\p{L}\\p{M}{0,2}){1,12})?$(?![\\s\\S])/u"
  match:
    - "net:ab"
    - "net:e\u0301x"
    - "net:a\u0301\u0308b"
    - "net:\u6771\u4eac-\u5927\u962a"
    - "net:\u0394\u03ad\u03bb\u03c4\u03b1"
    - "net:\u0645\u0631\u062d\u0628\u0627"
    - "net:\u0417\u0438\u043c\u0430"
    - "net:abcdefghijkl"
    - "net:e\u0301-e\u0308"
    - "net:A\u00e9"
  no_match:
    - "net:a"
    - "net:abcdefghijklm"
    - "net:ab1"
    - "net:a_b"
    - "net:a b"
    - "net:e\u0301"
    - "net:\U0001f600a"
    - "net:\u0301ab"
    - "net:a\u0301\u0308\u0303b"
    - "net:-ab"
    - "net:ab-"
    - "net:a--b"
    - "net:ab-cd-ef"
    - "!net:ab"
    - "net:ab!"
    - "net:ab\n"
    - "net:ab\r"
    - "net:ab\r\n"
    - "net:ab\u2028"
    - "net:ab\u2029"
    - " net:ab"
    - "net:ab "
  pitfall: >-
    Count base-letter clusters, attach bounded marks only after a letter, and limit the optional internal separator.
- id: gpt-network-17
  difficulty: hard
  status: ok
  description: >-
    A packet note: the entire string has the literal opening wrapper NET{, a lowercase ASCII routing label of 2 through 6 letters, colon, a body, colon, the exact same routing label and the literal closing wrapper }NET. The body has 1 through 40 Unicode code points, allows any characters including line breaks and colons, and must contain the lowercase substring packet. Only the body counts toward its length limit; no other text is allowed.
  regex: "/^NET\\{(?<route>[a-z]{2,6}):(?=.{1,40}:\\k<route>\\}NET$)(?=.{0,40}packet.{0,40}:\\k<route>\\}NET$).*:\\k<route>\\}NET$(?![\\s\\S])/su"
  match:
    - "NET{aa:packet:aa}NET"
    - "NET{abcdef:apacket:abcdef}NET"
    - "NET{tag:packetb:tag}NET"
    - "NET{route:\npacket:route}NET"
    - "NET{memo:packet\n:memo}NET"
    - "NET{ab:\tpacket:ab}NET"
    - "NET{zz:\U0001f600packet:zz}NET"
    - "NET{key:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxpacket:key}NET"
    - "NET{xy:\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600packet:xy}NET"
    - "NET{aa:prefix: packet: suffix:aa}NET"
  no_match:
    - "NET{aa::aa}NET"
    - "NET{aa:abc:aa}NET"
    - "NET{aa:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxpacket:aa}NET"
    - "NET{aa:packet:ab}NET"
    - "NET{a:packet:a}NET"
