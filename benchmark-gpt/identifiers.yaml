# Benchmark GPT, catégorie identifiers. Format et contrôles : scripts/benchmark.py.
- id: gpt-identifiers-01
  difficulty: simple
  status: ok
  description: >-
    An export identifier is uppercase EX- followed by exactly eight uppercase hexadecimal characters; no spaces.
  regex: "/^EX\\-[0123456789ABCDEF]{8}$(?![\\s\\S])/"
  match:
    - "EX-00000000"
    - "EX-FFFFFFFF"
    - "EX-88888888"
    - "EX-0F0F0F0F"
    - "EX-F0F0F0F0"
    - "EX-0FFFFFFF"
    - "EX-F0000000"
    - "EX-80000000"
  no_match:
    - "EX-0000000"
    - "EX-000000000"
    - "EX-?0000000"
    - "EX- 0000000"
    - "EX-0000000\u00e9"
    - "EX-00000000\t"
    - "EX?00000000"
    - "EX-a0000000"
    - "!EX-00000000"
    - "EX-00000000!"
    - "EX-00000000\n"
    - "EX-00000000\r"
    - "EX-00000000\r\n"
    - "EX-00000000\u2028"
    - "EX-00000000\u2029"
    - " EX-00000000"
    - "EX-00000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-identifiers-02
  difficulty: simple
  status: ok
  description: >-
    A queue handle is lowercase q_ followed by exactly six lowercase ASCII letters.
  regex: "/^q_[abcdefghijklmnopqrstuvwxyz]{6}$(?![\\s\\S])/"
  match:
    - "q_aaaaaa"
    - "q_zzzzzz"
    - "q_nnnnnn"
    - "q_azazaz"
    - "q_zazaza"
    - "q_azzzzz"
    - "q_zaaaaa"
    - "q_naaaaa"
  no_match:
    - "q_aaaaa"
    - "q_aaaaaaa"
    - "q_?aaaaa"
    - "q_ aaaaa"
    - "q_aaaaa\u00e9"
    - "q_aaaaaa\t"
    - "q?aaaaaa"
    - "q_Aaaaaa"
    - "!q_aaaaaa"
    - "q_aaaaaa!"
    - "q_aaaaaa\n"
    - "q_aaaaaa\r"
    - "q_aaaaaa\r\n"
    - "q_aaaaaa\u2028"
    - "q_aaaaaa\u2029"
    - " q_aaaaaa"
    - "q_aaaaaa "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-identifiers-03
  difficulty: simple
  status: ok
  description: >-
    A warehouse code is WH followed by exactly five ASCII digits and suffix X.
  regex: "/^WH[0123456789]{5}X$(?![\\s\\S])/"
  match:
    - "WH00000X"
    - "WH99999X"
    - "WH55555X"
    - "WH09090X"
    - "WH90909X"
    - "WH09999X"
    - "WH90000X"
    - "WH50000X"
  no_match:
    - "WH0000X"
    - "WH000000X"
    - "WH?0000X"
    - "WH 0000X"
    - "WH0000\u00e9X"
    - "WH00000\tX"
    - "W?00000X"
    - "WH00000?"
    - "!WH00000X"
    - "WH00000X!"
    - "WH00000X\n"
    - "WH00000X\r"
    - "WH00000X\r\n"
    - "WH00000X\u2028"
    - "WH00000X\u2029"
    - " WH00000X"
    - "WH00000X "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-identifiers-04
  difficulty: simple
  status: ok
  description: >-
    The short digest field has exactly ten lowercase hexadecimal characters followed by literal .sha, lowercase.
  regex: "/^[0123456789abcdef]{10}\\.sha$(?![\\s\\S])/"
  match:
    - "0000000000.sha"
    - "ffffffffff.sha"
    - "8888888888.sha"
    - "0f0f0f0f0f.sha"
    - "f0f0f0f0f0.sha"
    - "0fffffffff.sha"
    - "f000000000.sha"
    - "8000000000.sha"
  no_match:
    - "000000000.sha"
    - "00000000000.sha"
    - "?000000000.sha"
    - " 000000000.sha"
    - "000000000\u00e9.sha"
    - "0000000000\t.sha"
    - "0000000000?sha"
    - "A000000000.sha"
    - "!0000000000.sha"
    - "0000000000.sha!"
    - "0000000000.sha\n"
    - "0000000000.sha\r"
    - "0000000000.sha\r\n"
    - "0000000000.sha\u2028"
    - "0000000000.sha\u2029"
    - " 0000000000.sha"
    - "0000000000.sha "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-identifiers-05
  difficulty: simple
  status: ok
  description: >-
    A scratch token consists of exactly eight ASCII letters from A through H, all uppercase, prefixed with tmp:.
  regex: "/^tmp:[ABCDEFGH]{8}$(?![\\s\\S])/"
  match:
    - "tmp:AAAAAAAA"
    - "tmp:HHHHHHHH"
    - "tmp:EEEEEEEE"
    - "tmp:AHAHAHAH"
    - "tmp:HAHAHAHA"
    - "tmp:AHHHHHHH"
    - "tmp:HAAAAAAA"
    - "tmp:EAAAAAAA"
  no_match:
    - "tmp:AAAAAAA"
    - "tmp:AAAAAAAAA"
    - "tmp:?AAAAAAA"
    - "tmp: AAAAAAA"
    - "tmp:AAAAAAA\u00e9"
    - "tmp:AAAAAAAA\t"
    - "tmp?AAAAAAAA"
    - "tmp:aAAAAAAA"
    - "!tmp:AAAAAAAA"
    - "tmp:AAAAAAAA!"
    - "tmp:AAAAAAAA\n"
    - "tmp:AAAAAAAA\r"
    - "tmp:AAAAAAAA\r\n"
    - "tmp:AAAAAAAA\u2028"
    - "tmp:AAAAAAAA\u2029"
    - " tmp:AAAAAAAA"
    - "tmp:AAAAAAAA "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-identifiers-06
  difficulty: medium
  status: ok
  description: >-
    Form-validation ticket: A generated shard handle is shard- followed by an integer from 1 through 64, no padding, signs or spaces.
  regex: "/^shard\\-(?:[1-9]|[1-5][0-9]|6[0-4])$(?![\\s\\S])/"
  match:
    - "shard-1"
    - "shard-2"
    - "shard-3"
    - "shard-62"
    - "shard-63"
    - "shard-64"
    - "shard-32"
    - "shard-33"
  no_match:
    - "shard-0"
    - "shard-65"
    - "shard-01"
    - "shard-+1"
    - "shard-1.0"
    - "shard- 1"
    - "shard-640"
    - "!shard-1"
    - "shard-1!"
    - "shard-1\n"
    - "shard-1\r"
    - "shard-1\r\n"
    - "shard-1\u2028"
    - "shard-1\u2029"
    - " shard-1"
    - "shard-1 "
  pitfall: >-
    Endpoints and canonical decimal spelling must both be enforced.
- id: gpt-identifiers-07
  difficulty: medium
  status: ok
  description: >-
    A batch code is two uppercase ASCII letters excluding I and O, hyphen, then four ASCII digits. Digits cannot all be zero.
  regex: "/^[A-HJ-NP-Z]{2}-(?!0000$)[0-9]{4}$(?![\\s\\S])/"
  match:
    - "AB-0001"
    - "ZX-9999"
    - "QQ-1234"
    - "HH-1000"
    - "JJ-0100"
    - "NN-0010"
    - "PP-0099"
    - "YZ-9876"
  no_match:
    - "AI-0001"
    - "OA-0001"
    - "AB-0000"
    - "ab-0001"
    - "AB-001"
    - "AB-00001"
    - "AB-00a1"
    - "!AB-0001"
    - "AB-0001!"
    - "AB-0001\n"
    - "AB-0001\r"
    - "AB-0001\r\n"
    - "AB-0001\u2028"
    - "AB-0001\u2029"
    - " AB-0001"
    - "AB-0001 "
  pitfall: >-
    Ambiguous letters and the zero serial are independently excluded.
- id: gpt-identifiers-08
  difficulty: medium
  status: ok
  description: >-
    The trace token is exactly twelve lowercase hexadecimal characters, with exactly one hyphen after the sixth character. Uppercase is not accepted.
  regex: "/^[0-9a-f]{6}-[0-9a-f]{6}$(?![\\s\\S])/"
  match:
    - "000000-000000"
    - "ffffff-ffffff"
    - "abcdef-123456"
    - "123456-abcdef"
    - "a00000-00000f"
    - "012345-6789ab"
    - "111111-222222"
    - "fedcba-654321"
  no_match:
    - "ABCDEf-123456"
    - "abcde-123456"
    - "abcdef-12345"
    - "abcdef_123456"
    - "abcdef123456"
    - "abcdeg-123456"
    - "!000000-000000"
    - "000000-000000!"
    - "000000-000000\n"
    - "000000-000000\r"
    - "000000-000000\r\n"
    - "000000-000000\u2028"
    - "000000-000000\u2029"
    - " 000000-000000"
    - "000000-000000 "
  pitfall: >-
    Segment widths and hex case must both be exact.
- id: gpt-identifiers-09
  difficulty: medium
  status: ok
  description: >-
    A job ID is JOB/ followed by a canonical decimal integer 100 through 250, with no extra text.
  regex: "/^JOB\\/(?:1[0-9]{2}|2[0-4][0-9]|250)$(?![\\s\\S])/"
  match:
    - "JOB/100"
    - "JOB/101"
    - "JOB/102"
    - "JOB/248"
    - "JOB/249"
    - "JOB/250"
    - "JOB/175"
    - "JOB/176"
  no_match:
    - "JOB/99"
    - "JOB/251"
    - "JOB/0100"
    - "JOB/+100"
    - "JOB/100.0"
    - "JOB/ 100"
    - "JOB/2500"
    - "!JOB/100"
    - "JOB/100!"
    - "JOB/100\n"
    - "JOB/100\r"
    - "JOB/100\r\n"
    - "JOB/100\u2028"
    - "JOB/100\u2029"
    - " JOB/100"
    - "JOB/100 "
    - "JOB/1000"
  pitfall: >-
    Endpoints and canonical decimal spelling must both be enforced.
- id: gpt-identifiers-10
  difficulty: medium
  status: ok
  description: >-
    Import gate — reject any nonconforming input. A normalized opaque token is 8 through 16 lowercase ASCII letters or digits, must start with a letter and must contain at least one digit. No punctuation.
  regex: "/^(?=[a-z0-9]{8,16}$)(?=[a-z0-9]*[0-9])[a-z][a-z0-9]*$(?![\\s\\S])/"
  match:
    - "a0000000"
    - "abcde123"
    - "z999999999999999"
    - "a1234567"
    - "token123"
    - "abc12345"
    - "x0000001"
    - "foo42bar"
  no_match:
    - "abcdefgh"
    - "1abcdefg"
    - "a123456"
    - "a1234567890123456"
    - "A1234567"
    - "a123_567"
    - "!a0000000"
    - "a0000000!"
    - "a0000000\n"
    - "a0000000\r"
    - "a0000000\r\n"
    - "a0000000\u2028"
    - "a0000000\u2029"
    - " a0000000"
    - "a0000000 "
  pitfall: >-
    A length-valid token can still lack a digit or have a wrong first character.
- id: gpt-identifiers-11
  difficulty: medium
  status: ok
  description: >-
    Search filter, not whole-input validation. Search arbitrary text for exactly eight lowercase hexadecimal digits immediately after digest= and before semicolon; the marker is lowercase.
  regex: "/(?<=digest=)[0-9a-f]{8}(?=;)/"
  match:
    - "digest=00000000;"
    - "digest=ffffffff;"
    - "digest=abcdef12;"
    - "digest=12345678;"
    - "before digest=deadbeef; after"
    - "before digest=a0000001; after"
    - "before digest=01234567; after"
    - "before digest=99aabbcc; after"
  no_match:
    - "digest=0000000;"
    - "digest=000000000;"
    - "digest=ABCDEF12;"
    - "digest=abcdefg1;"
    - "digest=a000000!;"
    - "digest=\u00e90000000;"
    - "DIGEST=00000000;"
    - "digest=00000000 ;"
  pitfall: >-
    Search anywhere, but require the exact local context and the entire bounded token.
- id: gpt-identifiers-12
  difficulty: medium
  status: ok
  description: >-
    Find a shard code from 00 through 31, padded to two ASCII digits, immediately after lowercase shard[ and before ]. Surrounding text is unrestricted.
  regex: "/(?<=shard\\[)(?:[0-2][0-9]|3[01])(?=\\])/"
  match:
    - "shard[00]"
    - "shard[01]"
    - "shard[09]"
    - "shard[10]"
    - "before shard[20] after"
    - "before shard[29] after"
    - "before shard[30] after"
    - "before shard[31] after"
  no_match:
    - "shard[32]"
    - "shard[99]"
    - "shard[0]"
    - "shard[000]"
    - "shard[a0]"
    - "shard[-1]"
    - "SHARD[00]"
    - "shard[00 ]"
  pitfall: >-
    Search anywhere, but require the exact local context and the entire bounded token.
- id: gpt-identifiers-13
  difficulty: medium
  status: ok
  description: >-
    A base32 voucher is 12 uppercase ASCII letters or digits, using only A through Z and digits 2 through 7, and must contain at least one letter and at least one digit.
  regex: "/^(?=[A-Z2-7]{12}$)(?=.*[A-Z])(?=.*[2-7])[A-Z2-7]+$(?![\\s\\S])/"
  match:
    - "A22222222222"
    - "22222222222Z"
    - "ABCDEF234567"
    - "ZZZZZZZZZZZ7"
    - "A2A2A2A2A2A2"
    - "ABCDEFGH2345"
    - "777777AAAAAA"
    - "QWERTY234567"
  no_match:
    - "AAAAAAAAAAAA"
    - "222222222222"
    - "A2222222222"
    - "A222222222222"
    - "a22222222222"
    - "A02222222222"
    - "!A22222222222"
    - "A22222222222!"
    - "A22222222222\n"
    - "A22222222222\r"
    - "A22222222222\r\n"
    - "A22222222222\u2028"
    - "A22222222222\u2029"
    - " A22222222222"
    - "A22222222222 "
  pitfall: >-
    The alphabet alone does not ensure both character kinds.
- id: gpt-identifiers-14
  difficulty: hard
  status: ok
  description: >-
    A duplicate-digest field starts same: then two identical six-character lowercase hexadecimal strings separated by colon. No spaces. Each of the two values must be enclosed in matching ASCII single or double quotes; the same quote character must be used for both values. Quotes are not part of the value, and escapes are not permitted.
  regex: "/^same:(['\\\"])([0-9a-f]{6})\\1:\\1\\2\\1$(?![\\s\\S])/"
  match:
    - "same:'000000':'000000'"
    - "same:\"ffffff\":\"ffffff\""
    - "same:'abcdef':'abcdef'"
    - "same:\"123456\":\"123456\""
    - "same:'deadbe':'deadbe'"
    - "same:\"aa1122\":\"aa1122\""
    - "same:'012345':'012345'"
    - "same:\"fedcba\":\"fedcba\""
  no_match:
    - "same:'000000':'ffffff'"
    - "same:'000000':'000000000000'"
    - "same:'?':'?'"
    - "same:'000000 ':'000000'"
    - "same:'000000':' 000000'"
    - "same:'000000':'000000:000000'"
    - "same:'!!!!!!':'!!!!!!'"
    - "same:'00000':'00000'"
    - "same:'0000000':'0000000'"
    - "same:'zzzzzz':'zzzzzz'"
    - "same:'000000\":'000000'"
    - "same:'000000':\"000000\""
    - "same:000000:000000"
    - "!same:'000000':'000000'"
    - "same:'000000':'000000'!"
    - "same:'000000':'000000'\n"
    - "same:'000000':'000000'\r"
    - "same:'000000':'000000'\r\n"
    - "same:'000000':'000000'\u2028"
    - "same:'000000':'000000'\u2029"
    - " same:'000000':'000000'"
    - "same:'000000':'000000' "
    - "same:00000:00000"
    - "same:0000000:0000000"
  pitfall: >-
    Quote style, both closing quotes, value policy and exact value repetition must all agree.
- id: gpt-identifiers-15
  difficulty: hard
  status: ok
  description: >-
    Code review requirement: A palindrome code contains exactly six uppercase ASCII letters: the last three reverse the first three. The first three must be distinct.
  regex: "/^([A-Z])(?!\\1)([A-Z])(?!\\1|\\2)([A-Z])\\3\\2\\1$(?![\\s\\S])/"
  match:
    - "ABCCBA"
    - "XYZZYX"
    - "QWEEWQ"
    - "AZXXZA"
    - "MNPPNM"
    - "JKLLKJ"
    - "RTYYTR"
    - "BCDDCB"
  no_match:
    - "AAAAAA"
    - "ABBBBA"
    - "ABCCBB"
    - "ABCDCA"
    - "ABCCB"
    - "ABCCBAA"
    - "abccba"
    - "!ABCCBA"
    - "ABCCBA!"
    - "ABCCBA\n"
    - "ABCCBA\r"
    - "ABCCBA\r\n"
    - "ABCCBA\u2028"
    - "ABCCBA\u2029"
    - " ABCCBA"
    - "ABCCBA "
  pitfall: >-
    Mirroring and three-way distinctness are separate conditions.
- id: gpt-identifiers-16
  difficulty: hard
  status: ok
  description: >-
    The human-facing identifier alias: the literal prefix alias: followed by 2 through 12 Unicode letter clusters. Each cluster is a Unicode letter followed by zero to two Unicode combining marks. One optional ASCII hyphen may join two nonempty runs of clusters, but no edge hyphen or second hyphen is allowed. Length counts letter clusters, excluding the hyphen and any fixed prefix; spaces, digits and other characters are forbidden. No normalization is performed.
  regex: "/^alias:(?=(?:\\p{L}\\p{M}{0,2}-?){2,12}$)(?:\\p{L}\\p{M}{0,2}){1,12}(?:-(?:\\p{L}\\p{M}{0,2}){1,12})?$(?![\\s\\S])/u"
  match:
    - "alias:ab"
    - "alias:e\u0301x"
    - "alias:a\u0301\u0308b"
    - "alias:\u6771\u4eac-\u5927\u962a"
    - "alias:\u0394\u03ad\u03bb\u03c4\u03b1"
    - "alias:\u0645\u0631\u062d\u0628\u0627"
    - "alias:\u0417\u0438\u043c\u0430"
    - "alias:abcdefghijkl"
    - "alias:e\u0301-e\u0308"
    - "alias:A\u00e9"
  no_match:
    - "alias:a"
    - "alias:abcdefghijklm"
    - "alias:ab1"
    - "alias:a_b"
    - "alias:a b"
    - "alias:e\u0301"
    - "alias:\U0001f600a"
    - "alias:\u0301ab"
    - "alias:a\u0301\u0308\u0303b"
    - "alias:-ab"
    - "alias:ab-"
    - "alias:a--b"
    - "alias:ab-cd-ef"
    - "!alias:ab"
    - "alias:ab!"
    - "alias:ab\n"
    - "alias:ab\r"
    - "alias:ab\r\n"
    - "alias:ab\u2028"
    - "alias:ab\u2029"
    - " alias:ab"
    - "alias:ab "
  pitfall: >-
    Count base-letter clusters, attach bounded marks only after a letter, and limit the optional internal separator.
- id: gpt-identifiers-17
  difficulty: hard
  status: ok
  description: >-
    An opaque ID memo: the entire string has the literal opening wrapper ID{, a lowercase ASCII routing label of 2 through 6 letters, colon, a body, colon, the exact same routing label and the literal closing wrapper }ID. The body has 1 through 40 Unicode code points, allows any characters including line breaks and colons, and must contain the lowercase substring key. Only the body counts toward its length limit; no other text is allowed.
  regex: "/^ID\\{(?<route>[a-z]{2,6}):(?=.{1,40}:\\k<route>\\}ID$)(?=.{0,40}key.{0,40}:\\k<route>\\}ID$).*:\\k<route>\\}ID$(?![\\s\\S])/su"
  match:
    - "ID{aa:key:aa}ID"
    - "ID{abcdef:akey:abcdef}ID"
    - "ID{tag:keyb:tag}ID"
    - "ID{route:\nkey:route}ID"
    - "ID{memo:key\n:memo}ID"
    - "ID{ab:\tkey:ab}ID"
    - "ID{zz:\U0001f600key:zz}ID"
    - "ID{key:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxkey:key}ID"
    - "ID{xy:\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600key:xy}ID"
    - "ID{aa:prefix: key: suffix:aa}ID"
  no_match:
    - "ID{aa::aa}ID"
    - "ID{aa:abc:aa}ID"
    - "ID{aa:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxkey:aa}ID"
    - "ID{aa:key:ab}ID"
    - "ID{a:key:a}ID"
    - "ID{abcdefg:key:abcdefg}ID"
    - "ID{AA:key:AA}ID"
    - "ID{aa:KEY:aa}ID"
    - "ID{aa:key:aa"
    - "aa:key:aa}ID"
    - "ID{aa:\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600key:aa}ID"
    - "ID{key:abc:key}ID"
    - "!ID{aa:key:aa}ID"
    - "ID{aa:key:aa}ID!"
    - "ID{aa:key:aa}ID\n"
    - "ID{aa:key:aa}ID\r"
    - "ID{aa:key:aa}ID\r\n"
    - "ID{aa:key:aa}ID\u2028"
    - "ID{aa:key:aa}ID\u2029"
    - " ID{aa:key:aa}ID"
    - "ID{aa:key:aa}ID "
  pitfall: >-
    Repeat the routing label exactly, count only body code points including line breaks, and require the marker inside that body.
- id: gpt-identifiers-18
  difficulty: hard
  status: ok
  description: >-
    A two-line identifier receipt uses LF only. First line is id= followed by four uppercase ASCII letters, second is copy= and the exact same letters. No final LF or spaces. Both values must be enclosed in matching ASCII single or double quotes, using the same quote character on both lines. The quotes are delimiters, not part of the value; no escapes are permitted.
  regex: "/^id=(['\\\"])([A-Z]{4})\\1\\ncopy=\\1\\2\\1$(?![\\s\\S])/"
  match:
    - "id='ABCD'\ncopy='ABCD'"
    - "id=\"WXYZ\"\ncopy=\"WXYZ\""
    - "id='AAAA'\ncopy='AAAA'"
    - "id=\"ZZZZ\"\ncopy=\"ZZZZ\""
    - "id='QWER'\ncopy='QWER'"
    - "id=\"ASDF\"\ncopy=\"ASDF\""
    - "id='ZXCV'\ncopy='ZXCV'"
    - "id=\"MNOP\"\ncopy=\"MNOP\""
  no_match:
    - "id='ABCD'\ncopy='WXYZ'"
    - "id='ABCD\r'\ncopy='ABCD'"
