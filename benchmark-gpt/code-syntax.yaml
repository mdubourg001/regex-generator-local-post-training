# Benchmark GPT, catégorie code-syntax. Format et contrôles : scripts/benchmark.py.
- id: gpt-code-syntax-01
  difficulty: simple
  status: ok
  description: >-
    A generated constant name is CFG_ followed by exactly six uppercase ASCII letters, no digits or other underscores.
  regex: "/^CFG_[ABCDEFGHIJKLMNOPQRSTUVWXYZ]{6}$(?![\\s\\S])/"
  match:
    - "CFG_AAAAAA"
    - "CFG_ZZZZZZ"
    - "CFG_NNNNNN"
    - "CFG_AZAZAZ"
    - "CFG_ZAZAZA"
    - "CFG_AZZZZZ"
    - "CFG_ZAAAAA"
    - "CFG_NAAAAA"
  no_match:
    - "CFG_AAAAA"
    - "CFG_AAAAAAA"
    - "CFG_?AAAAA"
    - "CFG_ AAAAA"
    - "CFG_AAAAA\u00e9"
    - "CFG_AAAAAA\t"
    - "CFG?AAAAAA"
    - "CFG_aAAAAA"
    - "!CFG_AAAAAA"
    - "CFG_AAAAAA!"
    - "CFG_AAAAAA\n"
    - "CFG_AAAAAA\r"
    - "CFG_AAAAAA\r\n"
    - "CFG_AAAAAA\u2028"
    - "CFG_AAAAAA\u2029"
    - " CFG_AAAAAA"
    - "CFG_AAAAAA "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-code-syntax-02
  difficulty: simple
  status: ok
  description: >-
    A private test method is _test followed by exactly four lowercase ASCII letters. Nothing else.
  regex: "/^_test[abcdefghijklmnopqrstuvwxyz]{4}$(?![\\s\\S])/"
  match:
    - "_testaaaa"
    - "_testzzzz"
    - "_testnnnn"
    - "_testazaz"
    - "_testzaza"
    - "_testazzz"
    - "_testzaaa"
    - "_testnaaa"
  no_match:
    - "_testaaa"
    - "_testaaaaa"
    - "_test?aaa"
    - "_test aaa"
    - "_testaaa\u00e9"
    - "_testaaaa\t"
    - "_tes?aaaa"
    - "_testAaaa"
    - "!_testaaaa"
    - "_testaaaa!"
    - "_testaaaa\n"
    - "_testaaaa\r"
    - "_testaaaa\r\n"
    - "_testaaaa\u2028"
    - "_testaaaa\u2029"
    - " _testaaaa"
    - "_testaaaa "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-code-syntax-03
  difficulty: simple
  status: ok
  description: >-
    An enum wire name is E followed by exactly four ASCII digits. Leading zeros are allowed.
  regex: "/^E[0123456789]{4}$(?![\\s\\S])/"
  match:
    - "E0000"
    - "E9999"
    - "E5555"
    - "E0909"
    - "E9090"
    - "E0999"
    - "E9000"
    - "E5000"
  no_match:
    - "E000"
    - "E00000"
    - "E?000"
    - "E 000"
    - "E000\u00e9"
    - "E0000\t"
    - "?0000"
    - "!E0000"
    - "E0000!"
    - "E0000\n"
    - "E0000\r"
    - "E0000\r\n"
    - "E0000\u2028"
    - "E0000\u2029"
    - " E0000"
    - "E0000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-code-syntax-04
  difficulty: simple
  status: ok
  description: >-
    A generated JS field is $ followed by exactly eight lowercase hexadecimal characters.
  regex: "/^\\$[0123456789abcdef]{8}$(?![\\s\\S])/"
  match:
    - "$00000000"
    - "$ffffffff"
    - "$88888888"
    - "$0f0f0f0f"
    - "$f0f0f0f0"
    - "$0fffffff"
    - "$f0000000"
    - "$80000000"
  no_match:
    - "$0000000"
    - "$000000000"
    - "$?0000000"
    - "$ 0000000"
    - "$0000000\u00e9"
    - "$00000000\t"
    - "?00000000"
    - "$A0000000"
    - "!$00000000"
    - "$00000000!"
    - "$00000000\n"
    - "$00000000\r"
    - "$00000000\r\n"
    - "$00000000\u2028"
    - "$00000000\u2029"
    - " $00000000"
    - "$00000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-code-syntax-05
  difficulty: simple
  status: ok
  description: >-
    A CSS-module export name is exactly eight lowercase ASCII letters followed by _class.
  regex: "/^[abcdefghijklmnopqrstuvwxyz]{8}_class$(?![\\s\\S])/"
  match:
    - "aaaaaaaa_class"
    - "zzzzzzzz_class"
    - "nnnnnnnn_class"
    - "azazazaz_class"
    - "zazazaza_class"
    - "azzzzzzz_class"
    - "zaaaaaaa_class"
    - "naaaaaaa_class"
  no_match:
    - "aaaaaaa_class"
    - "aaaaaaaaa_class"
    - "?aaaaaaa_class"
    - " aaaaaaa_class"
    - "aaaaaaa\u00e9_class"
    - "aaaaaaaa\t_class"
    - "aaaaaaaa?class"
    - "Aaaaaaaa_class"
    - "!aaaaaaaa_class"
    - "aaaaaaaa_class!"
    - "aaaaaaaa_class\n"
    - "aaaaaaaa_class\r"
    - "aaaaaaaa_class\r\n"
    - "aaaaaaaa_class\u2028"
    - "aaaaaaaa_class\u2029"
    - " aaaaaaaa_class"
    - "aaaaaaaa_class "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-code-syntax-06
  difficulty: medium
  status: ok
  description: >-
    Form-validation ticket: A snake-case field has 2 to 4 lowercase ASCII words separated by single underscores. Each word has 2 to 8 letters; no digits or leading/trailing underscores.
  regex: "/^[a-z]{2,8}(?:_[a-z]{2,8}){1,3}$(?![\\s\\S])/"
  match:
    - "ab_cd"
    - "abcdefgh_ijklmnop"
    - "user_name"
    - "one_two_three"
    - "aa_bb_cc_dd"
    - "first_last"
    - "data_item"
    - "red_green_blue"
  no_match:
    - "ab"
    - "aa_bb_cc_dd_ee"
    - "a_bc"
    - "ab_abcdefghi"
    - "ab__cd"
    - "_ab_cd"
    - "ab_cd_"
    - "Ab_cd"
    - "!ab_cd"
    - "ab_cd!"
    - "ab_cd\n"
    - "ab_cd\r"
    - "ab_cd\r\n"
    - "ab_cd\u2028"
    - "ab_cd\u2029"
    - " ab_cd"
    - "ab_cd "
  pitfall: >-
    Word width and component count are independent.
- id: gpt-code-syntax-07
  difficulty: medium
  status: ok
  description: >-
    A JavaScript-style parameter is 3 to 16 ASCII letters, digits, dollar signs or underscores. It starts with a letter or underscore, cannot contain dollar anywhere except as its final character, and cannot be exactly null or true.
  regex: "/^(?=.{3,16}$)(?!null$|true$)[A-Za-z_][A-Za-z0-9_]*\\$?$(?![\\s\\S])/"
  match:
    - "abc"
    - "_ab"
    - "a12"
    - "value$"
    - "abcdefghijklmnop"
    - "_value_1"
    - "Foo"
    - "a1$"
  no_match:
    - "ab"
    - "abcdefghijklmnopq"
    - "1ab"
    - "$ab"
    - "a$b"
    - "null"
    - "true"
    - "ab-"
    - "!abc"
    - "abc!"
    - "abc\n"
    - "abc\r"
    - "abc\r\n"
    - "abc\u2028"
    - "abc\u2029"
    - " abc"
    - "abc "
  pitfall: >-
    A dollar suffix is allowed but an internal dollar is not.
- id: gpt-code-syntax-08
  difficulty: medium
  status: ok
  description: >-
    A generated array accessor is item followed by an index 0 through 63 without leading zeros, then literal []. No spaces.
  regex: "/^item(?:[0-9]|[1-5][0-9]|6[0-3])\\[\\]$(?![\\s\\S])/"
  match:
    - "item0[]"
    - "item1[]"
    - "item2[]"
    - "item61[]"
    - "item62[]"
    - "item63[]"
    - "item31[]"
    - "item32[]"
  no_match:
    - "item-1[]"
    - "item64[]"
    - "item00[]"
    - "item+0[]"
    - "item0.0[]"
    - "item 0[]"
    - "item630[]"
    - "!item0[]"
    - "item0[]!"
    - "item0[]\n"
    - "item0[]\r"
    - "item0[]\r\n"
    - "item0[]\u2028"
    - "item0[]\u2029"
    - " item0[]"
    - "item0[] "
  pitfall: >-
    Endpoints and canonical decimal spelling must both be enforced.
- id: gpt-code-syntax-09
  difficulty: medium
  status: ok
  description: >-
    A kebab-case event name is exactly three lowercase ASCII segments of 2 to 6 letters, separated by hyphens. No digits, spaces or extra segments.
  regex: "/^[a-z]{2,6}-[a-z]{2,6}-[a-z]{2,6}$(?![\\s\\S])/"
  match:
    - "aa-bb-cc"
    - "abcdef-ghijkl-mnopqr"
    - "user-item-added"
    - "on-click-event"
    - "red-green-blue"
    - "data-load-done"
    - "foo-bar-baz"
    - "ab-cd-ef"
  no_match:
    - "a-bb-cc"
    - "aa-b-cc"
    - "aa-bb-c"
    - "abcdefg-bb-cc"
    - "aa_bb_cc"
    - "aa-bb-cc-dd"
    - "Aa-bb-cc"
    - "!aa-bb-cc"
    - "aa-bb-cc!"
    - "aa-bb-cc\n"
    - "aa-bb-cc\r"
    - "aa-bb-cc\r\n"
    - "aa-bb-cc\u2028"
    - "aa-bb-cc\u2029"
    - " aa-bb-cc"
    - "aa-bb-cc "
  pitfall: >-
    Every segment has the same independent bounds.
- id: gpt-code-syntax-10
  difficulty: medium
  status: ok
  description: >-
    Import gate — reject any nonconforming input. A test function name starts test_, followed by 3 to 12 lowercase ASCII letters or digits, beginning with a letter. The suffix cannot be exactly skip or todo; no further underscores.
  regex: "/^test_(?!skip$|todo$)[a-z][a-z0-9]{2,11}$(?![\\s\\S])/"
  match:
    - "test_abc"
    - "test_abcdefghijkl"
    - "test_skip1"
    - "test_todos"
    - "test_load1"
    - "test_user42"
    - "test_foo"
    - "test_a00"
  no_match:
    - "test_skip"
    - "test_todo"
    - "test_ab"
    - "test_abcdefghijklm"
    - "test_1abc"
    - "test_ABC"
    - "test_abc_def"
    - "!test_abc"
    - "test_abc!"
    - "test_abc\n"
    - "test_abc\r"
    - "test_abc\r\n"
    - "test_abc\u2028"
    - "test_abc\u2029"
    - " test_abc"
    - "test_abc "
  pitfall: >-
    Reserved suffixes are exact words, not prefixes.
- id: gpt-code-syntax-11
  difficulty: medium
  status: ok
  description: >-
    Search filter, not whole-input validation. Search source text for a lowercase ASCII symbol 4 through 8 letters immediately after export= and before semicolon. No syntax parsing outside that substring.
  regex: "/(?<=export=)[a-z]{4,8}(?=;)/"
  match:
    - "export=aaaa;"
    - "export=zzzzzzzz;"
    - "export=abcd;"
    - "export=abcdefgh;"
    - "before export=widget; after"
    - "before export=router; after"
    - "before export=sample; after"
    - "before export=value; after"
  no_match:
    - "export=aaa;"
    - "export=aaaaaaaaa;"
    - "export=AAAA;"
    - "export=abc1;"
    - "export=abc_;"
    - "export=abc\u00e9;"
    - "EXPORT=aaaa;"
    - "export=aaaa ;"
  pitfall: >-
    Search anywhere, but require the exact local context and the entire bounded token.
- id: gpt-code-syntax-12
  difficulty: medium
  status: ok
  description: >-
    Find a numeric register 0 through 31 immediately between lowercase reg[ and ]. Use shortest ASCII decimal spelling and search anywhere.
  regex: "/(?<=reg\\[)(?:[0-9]|[12][0-9]|3[01])(?=\\])/"
  match:
    - "reg[0]"
    - "reg[1]"
    - "reg[9]"
    - "reg[10]"
    - "before reg[20] after"
    - "before reg[29] after"
    - "before reg[30] after"
    - "before reg[31] after"
  no_match:
    - "reg[32]"
    - "reg[99]"
    - "reg[00]"
    - "reg[+1]"
    - "reg[a]"
    - "reg[1.0]"
    - "REG[0]"
    - "reg[0 ]"
  pitfall: >-
    Search anywhere, but require the exact local context and the entire bounded token.
- id: gpt-code-syntax-13
  difficulty: medium
  status: ok
  description: >-
    A Pascal-style class name consists of 2 or 3 segments. Each segment begins with one uppercase ASCII letter and has 1 to 5 lowercase ASCII letters after it. No acronyms, digits or separators.
  regex: "/^(?:[A-Z][a-z]{1,5}){2,3}$(?![\\s\\S])/"
  match:
    - "AbCd"
    - "AbcdefGhijkl"
    - "UserModel"
    - "UserItemAdded"
    - "OnClick"
    - "FooBarBaz"
    - "DataSource"
    - "RedGreenBlue"
  no_match:
    - "Ab"
    - "AbCdEfGh"
    - "ACd"
    - "ABCD"
    - "AbcdefgCd"
    - "AbCd1"
    - "abCd"
    - "Ab_Cd"
    - "!AbCd"
    - "AbCd!"
    - "AbCd\n"
    - "AbCd\r"
    - "AbCd\r\n"
    - "AbCd\u2028"
    - "AbCd\u2029"
    - " AbCd"
    - "AbCd "
  pitfall: >-
    Capitalized segments are bounded independently from segment count.
- id: gpt-code-syntax-14
  difficulty: hard
  status: ok
  description: >-
    A simplified assignment is let, one space, a lowercase ASCII variable 3 to 8 letters, equals with one space on each side, and that same variable plus literal .length;. No other text or spaces.
  regex: "/^let ([a-z]{3,8}) = \\1\\.length;$(?![\\s\\S])/"
  match:
    - "let abc = abc.length;"
    - "let xyz = xyz.length;"
    - "let abcdefgh = abcdefgh.length;"
    - "let value = value.length;"
    - "let items = items.length;"
    - "let foo = foo.length;"
    - "let source = source.length;"
    - "let sample = sample.length;"
  no_match:
    - "let abc = xyz.length;"
    - "let ab = ab.length;"
    - "let abcdefghi = abcdefghi.length;"
    - "let ABC = ABC.length;"
    - "let abc= abc.length;"
    - "let abc = abcXlength;"
    - "let abc = abc.length"
    - "!let abc = abc.length;"
    - "let abc = abc.length;!"
    - "let abc = abc.length;\n"
    - "let abc = abc.length;\r"
    - "let abc = abc.length;\r\n"
    - "let abc = abc.length;\u2028"
    - "let abc = abc.length;\u2029"
    - " let abc = abc.length;"
    - "let abc = abc.length; "
  pitfall: >-
    Variable reuse is semantic equality within the specified shallow syntax.
- id: gpt-code-syntax-15
  difficulty: hard
  status: ok
  description: >-
    Code review requirement: A quoted property access is obj[ followed by a matching pair of single or double ASCII quotes around 3 to 8 lowercase ASCII letters, then ]. Property names null and true are forbidden; no whitespace.
  regex: "/^obj\\[(['\\\"])(?!null\\1|true\\1)[a-z]{3,8}\\1\\]$(?![\\s\\S])/"
  match:
    - "obj['abc']"
    - "obj[\"xyz\"]"
    - "obj['abcdefgh']"
    - "obj[\"value\"]"
    - "obj['nulls']"
    - "obj[\"trues\"]"
    - "obj['foo']"
    - "obj[\"sample\"]"
  no_match:
    - "obj['null']"
    - "obj[\"true\"]"
    - "obj['abc\"]"
    - "obj['ab']"
    - "obj['abcdefghi']"
    - "obj['ABC']"
    - "obj[ 'abc']"
    - "!obj['abc']"
    - "obj['abc']!"
    - "obj['abc']\n"
    - "obj['abc']\r"
    - "obj['abc']\r\n"
    - "obj['abc']\u2028"
    - "obj['abc']\u2029"
    - " obj['abc']"
    - "obj['abc'] "
  pitfall: >-
    The reserved-word check must respect the chosen closing quote.
- id: gpt-code-syntax-16
  difficulty: hard
  status: ok
  description: >-
    An international code-review label: the literal prefix tag_ followed by 2 through 12 Unicode letter clusters. Each cluster is a Unicode letter followed by zero to two Unicode combining marks. One optional ASCII hyphen may join two nonempty runs of clusters, but no edge hyphen or second hyphen is allowed. Length counts letter clusters, excluding the hyphen and any fixed prefix; spaces, digits and other characters are forbidden. No normalization is performed.
  regex: "/^tag_(?=(?:\\p{L}\\p{M}{0,2}-?){2,12}$)(?:\\p{L}\\p{M}{0,2}){1,12}(?:-(?:\\p{L}\\p{M}{0,2}){1,12})?$(?![\\s\\S])/u"
  match:
    - "tag_ab"
    - "tag_e\u0301x"
    - "tag_a\u0301\u0308b"
    - "tag_\u6771\u4eac-\u5927\u962a"
    - "tag_\u0394\u03ad\u03bb\u03c4\u03b1"
    - "tag_\u0645\u0631\u062d\u0628\u0627"
    - "tag_\u0417\u0438\u043c\u0430"
    - "tag_abcdefghijkl"
    - "tag_e\u0301-e\u0308"
    - "tag_A\u00e9"
  no_match:
    - "tag_a"
    - "tag_abcdefghijklm"
    - "tag_ab1"
    - "tag_a_b"
    - "tag_a b"
    - "tag_e\u0301"
    - "tag_\U0001f600a"
    - "tag_\u0301ab"
    - "tag_a\u0301\u0308\u0303b"
    - "tag_-ab"
    - "tag_ab-"
    - "tag_a--b"
    - "tag_ab-cd-ef"
    - "!tag_ab"
    - "tag_ab!"
    - "tag_ab\n"
    - "tag_ab\r"
    - "tag_ab\r\n"
    - "tag_ab\u2028"
    - "tag_ab\u2029"
    - " tag_ab"
    - "tag_ab "
  pitfall: >-
    Count base-letter clusters, attach bounded marks only after a letter, and limit the optional internal separator.
- id: gpt-code-syntax-17
  difficulty: hard
  status: ok
  description: >-
    A code-review capsule: the entire string has the literal opening wrapper CODE{, a lowercase ASCII routing label of 2 through 6 letters, colon, a body, colon, the exact same routing label and the literal closing wrapper }CODE. The body has 1 through 40 Unicode code points, allows any characters including line breaks and colons, and must contain the lowercase substring return. Only the body counts toward its length limit; no other text is allowed.
  regex: "/^CODE\\{(?<route>[a-z]{2,6}):(?=.{1,40}:\\k<route>\\}CODE$)(?=.{0,40}return.{0,40}:\\k<route>\\}CODE$).*:\\k<route>\\}CODE$(?![\\s\\S])/su"
  match:
    - "CODE{aa:return:aa}CODE"
    - "CODE{abcdef:areturn:abcdef}CODE"
    - "CODE{tag:returnb:tag}CODE"
    - "CODE{route:\nreturn:route}CODE"
    - "CODE{memo:return\n:memo}CODE"
    - "CODE{ab:\treturn:ab}CODE"
    - "CODE{zz:\U0001f600return:zz}CODE"
    - "CODE{key:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxreturn:key}CODE"
    - "CODE{xy:\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600return:xy}CODE"
    - "CODE{aa:prefix: return: suffix:aa}CODE"
  no_match:
    - "CODE{aa::aa}CODE"
    - "CODE{aa:abc:aa}CODE"
    - "CODE{aa:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxreturn:aa}CODE"
    - "CODE{aa:return:ab}CODE"
    - "CODE{a:return:a}CODE"
    - "CODE{abcdefg:return:abcdefg}CODE"
    - "CODE{AA:return:AA}CODE"
    - "CODE{aa:RETURN:aa}CODE"
    - "CODE{aa:return:aa"
    - "aa:return:aa}CODE"
    - "CODE{aa:\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600return:aa}CODE"
    - "CODE{return:abc:return}CODE"
    - "!CODE{aa:return:aa}CODE"
    - "CODE{aa:return:aa}CODE!"
    - "CODE{aa:return:aa}CODE\n"
    - "CODE{aa:return:aa}CODE\r"
    - "CODE{aa:return:aa}CODE\r\n"
    - "CODE{aa:return:aa}CODE\u2028"
    - "CODE{aa:return:aa}CODE\u2029"
    - " CODE{aa:return:aa}CODE"
    - "CODE{aa:return:aa}CODE "
  pitfall: >-
    Repeat the routing label exactly, count only body code points including line breaks, and require the marker inside that body.
- id: gpt-code-syntax-18
  difficulty: hard
  status: ok
  description: >-
    An LF-only symbol receipt has symbol= and 3 to 8 lowercase ASCII letters on line one, then copy= with the identical symbol on line two. No final LF or extra whitespace. Both values must be enclosed in matching ASCII single or double quotes, using the same quote character on both lines. The quotes are delimiters, not part of the value; no escapes are permitted.
  regex: "/^symbol=(['\\\"])([a-z]{3,8})\\1\\ncopy=\\1\\2\\1$(?![\\s\\S])/"
  match:
    - "symbol='abc'\ncopy='abc'"
    - "symbol=\"xyz\"\ncopy=\"xyz\""
    - "symbol='abcdefgh'\ncopy='abcdefgh'"
    - "symbol=\"value\"\ncopy=\"value\""
    - "symbol='items'\ncopy='items'"
    - "symbol=\"foo\"\ncopy=\"foo\""
    - "symbol='source'\ncopy='source'"
    - "symbol=\"sample\"\ncopy=\"sample\""
  no_match:
    - "symbol='abc'\ncopy='xyz'"
    - "symbol='abc\r'\ncopy='abc'"
    - "symbol=abc copy=abc"
    - "symbol=abc\nCopy=abc"
    - "symbol='?'\ncopy='?'"
    - "symbol='abc'\ncopy='abc '"
    - "symbol='!!!'\ncopy='!!!'"
    - "symbol='ab'\ncopy='ab'"
    - "symbol='abc0'\ncopy='abc0'"
    - "symbol='000'\ncopy='000'"
    - "symbol='abc\"\ncopy='abc'"
    - "symbol='abc'\ncopy=\"abc\""
    - "symbol=abc\ncopy=abc"
    - "symbol='abc'\r\ncopy='abc'"
    - "!symbol='abc'\ncopy='abc'"
    - "symbol='abc'\ncopy='abc'!"
    - "symbol='abc'\ncopy='abc'\n"
