    - "phone=\"0000001\"\ncopy=\"0000001\""
    - "phone='5551234'\ncopy='5551234'"
    - "phone=\"9876543\"\ncopy=\"9876543\""
  no_match:
    - "phone='0000000'\ncopy='9999999'"
    - "phone='0000000\r'\ncopy='0000000'"
    - "phone=0000000 copy=0000000"
    - "phone=0000000\nCopy=0000000"
    - "phone='?'\ncopy='?'"
    - "phone='0000000'\ncopy='0000000 '"
    - "phone='!!!!!!!'\ncopy='!!!!!!!'"
    - "phone='000000'\ncopy='000000'"
    - "phone='00000000'\ncopy='00000000'"
    - "phone='zzzzzzz'\ncopy='zzzzzzz'"
    - "phone='0000000\"\ncopy='0000000'"
    - "phone='0000000'\ncopy=\"0000000\""
    - "phone=0000000\ncopy=0000000"
    - "phone='0000000'\r\ncopy='0000000'"
    - "!phone='0000000'\ncopy='0000000'"
    - "phone='0000000'\ncopy='0000000'!"
    - "phone='0000000'\ncopy='0000000'\n"
    - "phone='0000000'\ncopy='0000000'\r"
    - "phone='0000000'\ncopy='0000000'\r\n"
    - "phone='0000000'\ncopy='0000000'\u2028"
    - "phone='0000000'\ncopy='0000000'\u2029"
    - " phone='0000000'\ncopy='0000000'"
    - "phone='0000000'\ncopy='0000000' "
  pitfall: >-
    The exact value and quote convention must agree across LF-separated lines, in addition to the value policy.
- id: gpt-phone-numbers-19
  difficulty: hard
  status: ok
  description: >-
    Acceptance criteria:
