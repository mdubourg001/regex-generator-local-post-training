  regex: "/^phone=(['\\\"])([0-9]{7})\\1\\ncopy=\\1\\2\\1$(?![\\s\\S])/"
  match:
    - "phone='0000000'\ncopy='0000000'"
    - "phone=\"9999999\"\ncopy=\"9999999\""
    - "phone='1234567'\ncopy='1234567'"
    - "phone=\"7654321\"\ncopy=\"7654321\""
