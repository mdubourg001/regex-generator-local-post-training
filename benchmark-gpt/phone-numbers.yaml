# Benchmark GPT, catégorie phone-numbers. Format et contrôles : scripts/benchmark.py.
- id: gpt-phone-numbers-01
  difficulty: simple
  status: ok
  description: >-
    The legacy extension field is ext. followed by exactly four ASCII digits with no space. Leading zeros are allowed.
  regex: "/^ext\\.[0123456789]{4}$(?![\\s\\S])/"
  match:
    - "ext.0000"
    - "ext.9999"
    - "ext.5555"
    - "ext.0909"
    - "ext.9090"
    - "ext.0999"
    - "ext.9000"
    - "ext.5000"
  no_match:
    - "ext.000"
    - "ext.00000"
    - "ext.?000"
    - "ext. 000"
    - "ext.000\u00e9"
    - "ext.0000\t"
    - "ext?0000"
    - "!ext.0000"
    - "ext.0000!"
    - "ext.0000\n"
    - "ext.0000\r"
    - "ext.0000\r\n"
    - "ext.0000\u2028"
    - "ext.0000\u2029"
    - " ext.0000"
    - "ext.0000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-phone-numbers-02
  difficulty: simple
  status: ok
  description: >-
    A local dial token starts # and has exactly seven ASCII digits after it. No other punctuation or spaces.
  regex: "/^\\#[0123456789]{7}$(?![\\s\\S])/"
  match:
    - "#0000000"
    - "#9999999"
    - "#5555555"
    - "#0909090"
    - "#9090909"
    - "#0999999"
    - "#9000000"
    - "#5000000"
  no_match:
    - "#000000"
    - "#00000000"
    - "#?000000"
    - "# 000000"
    - "#000000\u00e9"
    - "#0000000\t"
    - "?0000000"
    - "!#0000000"
    - "#0000000!"
    - "#0000000\n"
    - "#0000000\r"
    - "#0000000\r\n"
    - "#0000000\u2028"
    - "#0000000\u2029"
    - " #0000000"
    - "#0000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-phone-numbers-03
  difficulty: simple
  status: ok
  description: >-
    The radio handset code is R followed by exactly six ASCII digits and suffix /voice.
  regex: "/^R[0123456789]{6}\\/voice$(?![\\s\\S])/"
  match:
    - "R000000/voice"
    - "R999999/voice"
    - "R555555/voice"
    - "R090909/voice"
    - "R909090/voice"
    - "R099999/voice"
    - "R900000/voice"
    - "R500000/voice"
  no_match:
    - "R00000/voice"
    - "R0000000/voice"
    - "R?00000/voice"
    - "R 00000/voice"
    - "R00000\u00e9/voice"
    - "R000000\t/voice"
    - "?000000/voice"
    - "R000000?voice"
    - "!R000000/voice"
    - "R000000/voice!"
    - "R000000/voice\n"
    - "R000000/voice\r"
    - "R000000/voice\r\n"
    - "R000000/voice\u2028"
    - "R000000/voice\u2029"
    - " R000000/voice"
    - "R000000/voice "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-phone-numbers-04
  difficulty: simple
  status: ok
  description: >-
    A test phone is the literal +999 followed immediately by exactly eight ASCII digits. Format only; do not validate real country allocation.
  regex: "/^\\+999[0123456789]{8}$(?![\\s\\S])/"
  match:
    - "+99900000000"
    - "+99999999999"
    - "+99955555555"
    - "+99909090909"
    - "+99990909090"
    - "+99909999999"
    - "+99990000000"
