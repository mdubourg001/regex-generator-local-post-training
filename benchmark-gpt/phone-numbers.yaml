    - "+999?0000000"
    - "+999 0000000"
    - "+9990000000\u00e9"
    - "+99900000000\t"
    - "+99?00000000"
    - "!+99900000000"
    - "+99900000000!"
    - "+99900000000\n"
    - "+99900000000\r"
    - "+99900000000\r\n"
    - "+99900000000\u2028"
    - "+99900000000\u2029"
    - " +99900000000"
    - "+99900000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-phone-numbers-05
  difficulty: simple
  status: ok
  description: >-
    A PBX route is sip: followed by exactly five ASCII digits and literal @pbx.test. No real SIP parsing beyond this format.
  regex: "/^sip:[0123456789]{5}@pbx\\.test$(?![\\s\\S])/"
  match:
    - "sip:00000@pbx.test"
    - "sip:99999@pbx.test"
