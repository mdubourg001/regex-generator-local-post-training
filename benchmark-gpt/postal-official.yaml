    - "F-?00000"
    - "F- 00000"
    - "F-00000\u00e9"
    - "F-000000\t"
    - "F?000000"
    - "F-a00000"
    - "!F-000000"
    - "F-000000!"
    - "F-000000\n"
    - "F-000000\r"
    - "F-000000\r\n"
    - "F-000000\u2028"
    - "F-000000\u2029"
    - " F-000000"
    - "F-000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-postal-official-05
