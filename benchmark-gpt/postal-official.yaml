# Benchmark GPT, catégorie postal-official. Format et contrôles : scripts/benchmark.py.
- id: gpt-postal-official-01
  difficulty: simple
  status: ok
  description: >-
    An internal postal routing key is POST- followed by exactly five ASCII digits. No geographic lookup is required.
  regex: "/^POST\\-[0123456789]{5}$(?![\\s\\S])/"
  match:
    - "POST-00000"
    - "POST-99999"
    - "POST-55555"
    - "POST-09090"
    - "POST-90909"
    - "POST-09999"
    - "POST-90000"
    - "POST-50000"
  no_match:
    - "POST-0000"
    - "POST-000000"
    - "POST-?0000"
    - "POST- 0000"
    - "POST-0000\u00e9"
    - "POST-00000\t"
    - "POST?00000"
    - "!POST-00000"
    - "POST-00000!"
    - "POST-00000\n"
    - "POST-00000\r"
    - "POST-00000\r\n"
    - "POST-00000\u2028"
    - "POST-00000\u2029"
    - " POST-00000"
    - "POST-00000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-postal-official-02
  difficulty: simple
  status: ok
  description: >-
    A permit display code is P/ followed by exactly eight uppercase ASCII letters. Format only, no checksum.
  regex: "/^P\\/[ABCDEFGHIJKLMNOPQRSTUVWXYZ]{8}$(?![\\s\\S])/"
  match:
    - "P/AAAAAAAA"
    - "P/ZZZZZZZZ"
    - "P/NNNNNNNN"
    - "P/AZAZAZAZ"
    - "P/ZAZAZAZA"
    - "P/AZZZZZZZ"
    - "P/ZAAAAAAA"
    - "P/NAAAAAAA"
  no_match:
    - "P/AAAAAAA"
    - "P/AAAAAAAAA"
    - "P/?AAAAAAA"
    - "P/ AAAAAAA"
    - "P/AAAAAAA\u00e9"
    - "P/AAAAAAAA\t"
    - "P?AAAAAAAA"
    - "P/aAAAAAAA"
    - "!P/AAAAAAAA"
    - "P/AAAAAAAA!"
    - "P/AAAAAAAA\n"
    - "P/AAAAAAAA\r"
    - "P/AAAAAAAA\r\n"
    - "P/AAAAAAAA\u2028"
    - "P/AAAAAAAA\u2029"
    - " P/AAAAAAAA"
    - "P/AAAAAAAA "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-postal-official-03
  difficulty: simple
  status: ok
  description: >-
    A registry receipt is reg: followed by exactly ten ASCII digits. Leading zeros are allowed; do not compute a checksum.
  regex: "/^reg:[0123456789]{10}$(?![\\s\\S])/"
  match:
    - "reg:0000000000"
    - "reg:9999999999"
    - "reg:5555555555"
    - "reg:0909090909"
    - "reg:9090909090"
    - "reg:0999999999"
    - "reg:9000000000"
    - "reg:5000000000"
  no_match:
    - "reg:000000000"
    - "reg:00000000000"
    - "reg:?000000000"
    - "reg: 000000000"
    - "reg:000000000\u00e9"
    - "reg:0000000000\t"
    - "reg?0000000000"
    - "!reg:0000000000"
    - "reg:0000000000!"
    - "reg:0000000000\n"
    - "reg:0000000000\r"
    - "reg:0000000000\r\n"
    - "reg:0000000000\u2028"
    - "reg:0000000000\u2029"
    - " reg:0000000000"
    - "reg:0000000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
