# Benchmark GPT, catégorie passwords. Format et contrôles : scripts/benchmark.py.
- id: gpt-passwords-01
  difficulty: simple
  status: ok
  description: >-
    A hardware PIN is exactly six ASCII digits. Leading zeros are allowed, with no spaces or other characters.
  regex: "/^[0123456789]{6}$(?![\\s\\S])/"
  match:
    - "000000"
    - "999999"
    - "555555"
    - "090909"
    - "909090"
    - "099999"
    - "900000"
    - "500000"
  no_match:
    - "00000"
    - "0000000"
    - "?00000"
    - " 00000"
    - "00000\u00e9"
    - "000000\t"
    - "!000000"
    - "000000!"
    - "000000\n"
    - "000000\r"
    - "000000\r\n"
    - "000000\u2028"
    - "000000\u2029"
    - " 000000"
    - "000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-passwords-02
  difficulty: simple
  status: ok
  description: >-
    A temporary secret is tmp- followed by exactly eight lowercase ASCII letters. No additional policy rules.
  regex: "/^tmp\\-[abcdefghijklmnopqrstuvwxyz]{8}$(?![\\s\\S])/"
  match:
    - "tmp-aaaaaaaa"
    - "tmp-zzzzzzzz"
    - "tmp-nnnnnnnn"
    - "tmp-azazazaz"
    - "tmp-zazazaza"
    - "tmp-azzzzzzz"
    - "tmp-zaaaaaaa"
    - "tmp-naaaaaaa"
  no_match:
    - "tmp-aaaaaaa"
    - "tmp-aaaaaaaaa"
    - "tmp-?aaaaaaa"
    - "tmp- aaaaaaa"
    - "tmp-aaaaaaa\u00e9"
    - "tmp-aaaaaaaa\t"
    - "tmp?aaaaaaaa"
    - "tmp-Aaaaaaaa"
    - "!tmp-aaaaaaaa"
    - "tmp-aaaaaaaa!"
    - "tmp-aaaaaaaa\n"
    - "tmp-aaaaaaaa\r"
    - "tmp-aaaaaaaa\r\n"
    - "tmp-aaaaaaaa\u2028"
    - "tmp-aaaaaaaa\u2029"
    - " tmp-aaaaaaaa"
    - "tmp-aaaaaaaa "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-passwords-03
  difficulty: simple
  status: ok
  description: >-
    A recovery token is exactly twelve uppercase hexadecimal characters. No separators or lowercase.
  regex: "/^[0123456789ABCDEF]{12}$(?![\\s\\S])/"
  match:
    - "000000000000"
    - "FFFFFFFFFFFF"
    - "888888888888"
    - "0F0F0F0F0F0F"
    - "F0F0F0F0F0F0"
    - "0FFFFFFFFFFF"
    - "F00000000000"
    - "800000000000"
  no_match:
    - "00000000000"
    - "0000000000000"
    - "?00000000000"
    - " 00000000000"
    - "00000000000\u00e9"
    - "000000000000\t"
    - "a00000000000"
    - "!000000000000"
    - "000000000000!"
    - "000000000000\n"
    - "000000000000\r"
    - "000000000000\r\n"
    - "000000000000\u2028"
    - "000000000000\u2029"
    - " 000000000000"
    - "000000000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-passwords-04
  difficulty: simple
  status: ok
  description: >-
    A keypad secret is exactly eight characters chosen from ASCII digits 1 through 6, prefixed with K:.
  regex: "/^K:[123456]{8}$(?![\\s\\S])/"
  match:
    - "K:11111111"
    - "K:66666666"
    - "K:44444444"
    - "K:16161616"
    - "K:61616161"
    - "K:16666666"
    - "K:61111111"
    - "K:41111111"
  no_match:
    - "K:1111111"
    - "K:111111111"
    - "K:?1111111"
    - "K: 1111111"
    - "K:1111111\u00e9"
    - "K:11111111\t"
    - "K?11111111"
    - "!K:11111111"
    - "K:11111111!"
    - "K:11111111\n"
    - "K:11111111\r"
    - "K:11111111\r\n"
    - "K:11111111\u2028"
    - "K:11111111\u2029"
    - " K:11111111"
    - "K:11111111 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-passwords-05
  difficulty: simple
  status: ok
  description: >-
    A passphrase field is exactly ten lowercase ASCII letters followed by literal !. No spaces or other punctuation.
  regex: "/^[abcdefghijklmnopqrstuvwxyz]{10}!$(?![\\s\\S])/"
  match:
    - "aaaaaaaaaa!"
    - "zzzzzzzzzz!"
    - "nnnnnnnnnn!"
    - "azazazazaz!"
    - "zazazazaza!"
    - "azzzzzzzzz!"
    - "zaaaaaaaaa!"
    - "naaaaaaaaa!"
  no_match:
    - "aaaaaaaaa!"
    - "aaaaaaaaaaa!"
    - "?aaaaaaaaa!"
    - " aaaaaaaaa!"
    - "aaaaaaaaa\u00e9!"
    - "aaaaaaaaaa\t!"
    - "aaaaaaaaaa?"
    - "Aaaaaaaaaa!"
    - "!aaaaaaaaaa!"
    - "aaaaaaaaaa!!"
    - "aaaaaaaaaa!\n"
    - "aaaaaaaaaa!\r"
    - "aaaaaaaaaa!\r\n"
    - "aaaaaaaaaa!\u2028"
    - "aaaaaaaaaa!\u2029"
    - " aaaaaaaaaa!"
    - "aaaaaaaaaa! "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-passwords-06
  difficulty: medium
  status: ok
  description: >-
    Form-validation ticket: An API secret is 8 to 16 ASCII letters or digits and must contain at least one uppercase letter, one lowercase letter and one digit. No punctuation or whitespace.
  regex: "/^(?=[A-Za-z0-9]{8,16}$)(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])[A-Za-z0-9]+$(?![\\s\\S])/"
  match:
    - "Aa000000"
    - "123456aA"
    - "Abcdefg1"
    - "aA12345678901234"
    - "Zz999999"
    - "Token123"
    - "Xx000001"
    - "abcdefG9"
  no_match:
    - "aa000000"
    - "AA000000"
    - "Aaaaaaaa"
    - "Aa00000"
    - "Aa000000000000000"
    - "Aa00000!"
    - "Aa0000 0"
    - "!Aa000000"
    - "Aa000000!"
    - "Aa000000\n"
    - "Aa000000\r"
    - "Aa000000\r\n"
    - "Aa000000\u2028"
    - "Aa000000\u2029"
    - " Aa000000"
    - "Aa000000 "
  pitfall: >-
    Meeting length does not imply meeting all three character kinds.
- id: gpt-passwords-07
  difficulty: medium
  status: ok
  description: >-
    A kiosk password is 6 through 10 lowercase ASCII letters or digits, must contain both a letter and a digit, and may not begin or end with a digit.
  regex: "/^(?=[a-z0-9]{6,10}$)(?=.*[0-9])[a-z][a-z0-9]*[a-z]$(?![\\s\\S])/"
  match:
    - "a0000b"
    - "ab12cd"
    - "a12345678b"
    - "pass1a"
    - "x9yyyy"
    - "abc1de"
    - "z0000z"
    - "a1b2c3d"
  no_match:
    - "abcdef"
    - "1abcde"
    - "abcde1"
    - "a123b"
    - "a123456789b"
    - "A0000b"
    - "a00_0b"
    - "!a0000b"
    - "a0000b!"
    - "a0000b\n"
    - "a0000b\r"
    - "a0000b\r\n"
    - "a0000b\u2028"
    - "a0000b\u2029"
    - " a0000b"
    - "a0000b "
  pitfall: >-
    The mandatory digit must be internal.
- id: gpt-passwords-08
  difficulty: medium
  status: ok
  description: >-
    An operator secret is 8 through 12 ASCII characters from letters, digits and underscore. It must contain an underscore, but no adjacent underscores and none at either end.
  regex: "/^(?=[A-Za-z0-9_]{8,12}$)(?=.*_)(?!.*__)[A-Za-z0-9][A-Za-z0-9_]*[A-Za-z0-9]$(?![\\s\\S])/"
  match:
    - "abc_defg"
    - "A1_B2_C3"
    - "a_b_c_d_e_f1"
    - "123_4567"
    - "pass_word"
    - "X_123456"
    - "abcd_123"
    - "foo_bar9"
  no_match:
    - "abcdefgh"
    - "_abcdefg"
    - "abcdefg_"
    - "abc__def"
    - "ab_cdef"
    - "abc_defghijkl"
    - "abc-defg"
    - "!abc_defg"
    - "abc_defg!"
    - "abc_defg\n"
    - "abc_defg\r"
    - "abc_defg\r\n"
    - "abc_defg\u2028"
    - "abc_defg\u2029"
    - " abc_defg"
    - "abc_defg "
  pitfall: >-
    Underscore presence and its placement are distinct rules.
- id: gpt-passwords-09
  difficulty: medium
  status: ok
  description: >-
    A vault code is exactly eight ASCII digits, starts with a nonzero digit, and is not composed of one repeated digit. No checksum.
  regex: "/^(?!([0-9])\\1{7}$)[1-9][0-9]{7}$(?![\\s\\S])/"
  match:
    - "10000000"
    - "99999998"
    - "12345678"
    - "98765432"
    - "12121212"
    - "55555556"
    - "20000001"
    - "90000000"
  no_match:
    - "00000001"
    - "11111111"
    - "99999999"
    - "1234567"
    - "123456789"
    - "1234567a"
    - "!10000000"
    - "10000000!"
    - "10000000\n"
    - "10000000\r"
    - "10000000\r\n"
    - "10000000\u2028"
    - "10000000\u2029"
    - " 10000000"
    - "10000000 "
  pitfall: >-
    Only all-identical codes are excluded; other repetition is allowed.
- id: gpt-passwords-10
  difficulty: medium
  status: ok
  description: >-
    Import gate — reject any nonconforming input. A scratch secret is 10 to 20 lowercase ASCII letters or digits, includes at least two digits, and must not contain the lowercase substring password.
  regex: "/^(?=[a-z0-9]{10,20}$)(?=(?:[a-z]*[0-9]){2})(?!.*password)[a-z0-9]+$(?![\\s\\S])/"
  match:
    - "abcdefg123"
    - "a1b2cdefgh"
    - "1234567890"
    - "abcdefghij12"
    - "passwor1d2"
    - "z0000000000000000000"
    - "secret1234"
    - "token42abc"
  no_match:
    - "abcdefghij"
    - "abcdefghi1"
    - "password12"
    - "xxpassword12"
    - "a1b2cdefg"
    - "a1b2cdefghijklmnopqrstu"
    - "Abcdefg123"
    - "abc_def123"
    - "!abcdefg123"
    - "abcdefg123!"
    - "abcdefg123\n"
    - "abcdefg123\r"
    - "abcdefg123\r\n"
    - "abcdefg123\u2028"
    - "abcdefg123\u2029"
    - " abcdefg123"
    - "abcdefg123 "
  pitfall: >-
    A forbidden substring can be internal; two digits need not be adjacent.
- id: gpt-passwords-11
  difficulty: medium
  status: ok
  description: >-
    Search filter, not whole-input validation. Find a six-digit ASCII one-time code immediately between lowercase otp= and semicolon anywhere in the text. No other OTP validity checks.
  regex: "/(?<=otp=)[0-9]{6}(?=;)/"
  match:
    - "otp=000000;"
    - "otp=999999;"
    - "otp=123456;"
    - "otp=654321;"
    - "before otp=100000; after"
    - "before otp=000001; after"
    - "before otp=555555; after"
    - "before otp=987654; after"
  no_match:
    - "otp=00000;"
    - "otp=0000000;"
    - "otp=abcdef;"
    - "otp=\uff11\uff12\uff13\uff14\uff15\uff16;"
    - "otp=12345a;"
    - "otp=123 56;"
    - "OTP=000000;"
    - "otp=000000 ;"
  pitfall: >-
    Search anywhere, but require the exact local context and the entire bounded token.
- id: gpt-passwords-12
  difficulty: medium
  status: ok
  description: >-
    Search a note for an eight-character lowercase hexadecimal secret immediately between lowercase secret[ and ]. Surrounding text is unrestricted.
  regex: "/(?<=secret\\[)[0-9a-f]{8}(?=\\])/"
  match:
    - "secret[00000000]"
    - "secret[ffffffff]"
    - "secret[abcdef12]"
    - "secret[12345678]"
    - "before secret[deadbeef] after"
    - "before secret[a0000001] after"
    - "before secret[01234567] after"
    - "before secret[99aabbcc] after"
  no_match:
    - "secret[0000000]"
    - "secret[000000000]"
    - "secret[ABCDEF12]"
    - "secret[abcdefg1]"
    - "secret[a000000!]"
    - "secret[\u00e90000000]"
    - "SECRET[00000000]"
    - "secret[00000000 ]"
  pitfall: >-
    Search anywhere, but require the exact local context and the entire bounded token.
- id: gpt-passwords-13
  difficulty: medium
  status: ok
  description: >-
    A passphrase is 2 to 4 words separated by single ASCII spaces. Each word is 3 to 8 lowercase ASCII letters; no digits, punctuation or leading/trailing spaces. Repeated words are allowed.
  regex: "/^[a-z]{3,8}(?: [a-z]{3,8}){1,3}$(?![\\s\\S])/"
  match:
    - "one two"
    - "abcdefgh ijklmnop"
    - "red green blue"
    - "one two three four"
    - "foo foo"
    - "alpha beta"
    - "abc def ghi"
    - "cat dog bird fish"
  no_match:
    - "one"
    - "one two three four five"
    - "on two"
    - "one abcdefghi"
    - "one  two"
    - "One two"
    - "one two1"
    - "!one two"
    - "one two!"
    - "one two\n"
    - "one two\r"
    - "one two\r\n"
    - "one two\u2028"
    - "one two\u2029"
    - " one two"
    - "one two "
  pitfall: >-
    Word lengths and number of words are separate bounded counts.
- id: gpt-passwords-14
  difficulty: hard
  status: ok
  description: >-
    A password reset confirmation is reset: followed by two identical secrets separated by slash. A secret is exactly eight ASCII letters or digits and must contain an uppercase letter, a lowercase letter and a digit. No spaces. Each of the two values must be enclosed in matching ASCII single or double quotes; the same quote character must be used for both values. Quotes are not part of the value, and escapes are not permitted.
  regex: "/^reset:(['\\\"])((?=[A-Za-z0-9]{8}['\\\"])(?=[A-Za-z0-9]{0,7}[A-Z])(?=[A-Za-z0-9]{0,7}[a-z])(?=[A-Za-z0-9]{0,7}[0-9])[A-Za-z0-9]{8})\\1\\/\\1\\2\\1$(?![\\s\\S])/"
  match:
    - "reset:'Aa000000'/'Aa000000'"
    - "reset:\"123456aA\"/\"123456aA\""
    - "reset:'Abcdefg1'/'Abcdefg1'"
    - "reset:\"Zz999999\"/\"Zz999999\""
    - "reset:'Token123'/'Token123'"
    - "reset:\"Xx000001\"/\"Xx000001\""
    - "reset:'abcdefG9'/'abcdefG9'"
    - "reset:\"A1b2c3d4\"/\"A1b2c3d4\""
  no_match:
    - "reset:'Aa000000'/'123456aA'"
    - "reset:'Aa000000'/'Aa000000Aa000000'"
    - "reset:'?'/'?'"
    - "reset:'Aa000000 '/'Aa000000'"
    - "reset:'Aa000000'/' Aa000000'"
    - "reset:'Aa000000'/'Aa000000/Aa000000'"
    - "reset:'!!!!!!!!'/'!!!!!!!!'"
    - "reset:'Aa00000'/'Aa00000'"
    - "reset:'Aa0000000'/'Aa0000000'"
    - "reset:'Aazzzzzz'/'Aazzzzzz'"
    - "reset:'00000000'/'00000000'"
    - "reset:'Aa000000\"/'Aa000000'"
    - "reset:'Aa000000'/\"Aa000000\""
    - "reset:Aa000000/Aa000000"
    - "!reset:'Aa000000'/'Aa000000'"
    - "reset:'Aa000000'/'Aa000000'!"
    - "reset:'Aa000000'/'Aa000000'\n"
    - "reset:'Aa000000'/'Aa000000'\r"
    - "reset:'Aa000000'/'Aa000000'\r\n"
    - "reset:'Aa000000'/'Aa000000'\u2028"
    - "reset:'Aa000000'/'Aa000000'\u2029"
    - " reset:'Aa000000'/'Aa000000'"
    - "reset:'Aa000000'/'Aa000000' "
    - "reset:'aa000000'/'aa000000'"
    - "reset:'AA000000'/'AA000000'"
  pitfall: >-
    Quote style, both closing quotes, value policy and exact value repetition must all agree.
- id: gpt-passwords-15
  difficulty: hard
  status: ok
  description: >-
    Code review requirement: A secret is exactly ten lowercase ASCII letters or digits, must have at least one digit, and no character may be repeated at any later position. No other characters.
  regex: "/^(?!.*([a-z0-9]).*\\1)(?=.*[0-9])[a-z0-9]{10}$(?![\\s\\S])/"
  match:
    - "abcdefghi1"
    - "0123456789"
    - "a1b2c3d4e5"
    - "xyz0123456"
    - "qwerty1234"
    - "asdfgh5678"
    - "zxcvbn0123"
    - "mnbvcx9876"
  no_match:
    - "abcdefghij"
    - "abcdefghi1a"
    - "abcdefgg12"
    - "a1b2c3d4e1"
    - "abcdefg12"
    - "ABCdefghi1"
    - "abc_def123"
    - "!abcdefghi1"
    - "abcdefghi1!"
    - "abcdefghi1\n"
    - "abcdefghi1\r"
    - "abcdefghi1\r\n"
    - "abcdefghi1\u2028"
    - "abcdefghi1\u2029"
    - " abcdefghi1"
    - "abcdefghi1 "
  pitfall: >-
    Nonadjacent duplicates are forbidden, not just neighboring ones.
- id: gpt-passwords-16
  difficulty: hard
  status: ok
  description: >-
    An international passphrase is 8 through 16 Unicode code points, all Unicode letters or ASCII digits, and must include at least one Unicode letter and one ASCII digit. Combining marks, spaces and other digits are forbidden.
  regex: "/^(?=.{8,16}$)(?=.*\\p{L})(?=.*[0-9])[\\p{L}0-9]+$(?![\\s\\S])/u"
  match:
    - "abcdefg1"
    - "\u00c9t\u00e9abc12"
    - "\u6771\u4eac\u6771\u4eac\u6771\u4eac12"
    - "\u0394\u03ad\u03bb\u03c4\u03b1123"
    - "\u0645\u0631\u062d\u0628\u0627123"
    - "\u0417\u0438\u043c\u04301234"
    - "abcdefghijklmno1"
    - "1234567\u00e9"
  no_match:
    - "abcdefgh"
    - "12345678"
    - "abcde12"
    - "abcdefghijklmnop1"
    - "abcdefg\u0661"
    - "abcde\u030112"
    - "abcdef_1"
    - "!abcdefg1"
    - "abcdefg1!"
    - "abcdefg1\n"
    - "abcdefg1\r"
    - "abcdefg1\r\n"
    - "abcdefg1\u2028"
    - "abcdefg1\u2029"
    - " abcdefg1"
    - "abcdefg1 "
  pitfall: >-
    Unicode letters and ASCII digits are intentionally asymmetric.
- id: gpt-passwords-17
  difficulty: hard
  status: ok
  description: >-
    An imported secret note: the entire string has the literal opening wrapper SEC{, a lowercase ASCII routing label of 2 through 6 letters, colon, a body, colon, the exact same routing label and the literal closing wrapper }SEC. The body has 1 through 40 Unicode code points, allows any characters including line breaks and colons, and must contain the lowercase substring token. Only the body counts toward its length limit; no other text is allowed.
  regex: "/^SEC\\{(?<route>[a-z]{2,6}):(?=.{1,40}:\\k<route>\\}SEC$)(?=.{0,40}token.{0,40}:\\k<route>\\}SEC$).*:\\k<route>\\}SEC$(?![\\s\\S])/su"
  match:
    - "SEC{aa:token:aa}SEC"
    - "SEC{abcdef:atoken:abcdef}SEC"
    - "SEC{tag:tokenb:tag}SEC"
    - "SEC{route:\ntoken:route}SEC"
    - "SEC{memo:token\n:memo}SEC"
    - "SEC{ab:\ttoken:ab}SEC"
    - "SEC{zz:\U0001f600token:zz}SEC"
    - "SEC{key:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxtoken:key}SEC"
    - "SEC{xy:\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600token:xy}SEC"
    - "SEC{aa:prefix: token: suffix:aa}SEC"
  no_match:
    - "SEC{aa::aa}SEC"
    - "SEC{aa:abc:aa}SEC"
    - "SEC{aa:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxtoken:aa}SEC"
    - "SEC{aa:token:ab}SEC"
    - "SEC{a:token:a}SEC"
    - "SEC{abcdefg:token:abcdefg}SEC"
    - "SEC{AA:token:AA}SEC"
    - "SEC{aa:TOKEN:aa}SEC"
    - "SEC{aa:token:aa"
    - "aa:token:aa}SEC"
    - "SEC{aa:\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600\U0001f600token:aa}SEC"
    - "SEC{token:abc:token}SEC"
    - "!SEC{aa:token:aa}SEC"
    - "SEC{aa:token:aa}SEC!"
    - "SEC{aa:token:aa}SEC\n"
    - "SEC{aa:token:aa}SEC\r"
    - "SEC{aa:token:aa}SEC\r\n"
    - "SEC{aa:token:aa}SEC\u2028"
    - "SEC{aa:token:aa}SEC\u2029"
    - " SEC{aa:token:aa}SEC"
    - "SEC{aa:token:aa}SEC "
  pitfall: >-
    Repeat the routing label exactly, count only body code points including line breaks, and require the marker inside that body.
- id: gpt-passwords-18
  difficulty: hard
  status: ok
  description: >-
    An LF-only recovery receipt has code= followed by eight uppercase hexadecimal characters on line one, then copy= and the exact same code on line two. No final LF or spaces. Both values must be enclosed in matching ASCII single or double quotes, using the same quote character on both lines. The quotes are delimiters, not part of the value; no escapes are permitted.
  regex: "/^code=(['\\\"])([0-9A-F]{8})\\1\\ncopy=\\1\\2\\1$(?![\\s\\S])/"
  match:
    - "code='00000000'\ncopy='00000000'"
    - "code=\"FFFFFFFF\"\ncopy=\"FFFFFFFF\""
    - "code='ABCDEF12'\ncopy='ABCDEF12'"
    - "code=\"12345678\"\ncopy=\"12345678\""
    - "code='DEADBEEF'\ncopy='DEADBEEF'"
    - "code=\"A0000001\"\ncopy=\"A0000001\""
    - "code='01234567'\ncopy='01234567'"
    - "code=\"99AABBCC\"\ncopy=\"99AABBCC\""
  no_match:
