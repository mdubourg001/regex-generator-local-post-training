# Benchmark GPT, catégorie multiline. Format et contrôles : scripts/benchmark.py.
- id: gpt-multiline-01
  difficulty: simple
  status: ok
  description: >-
    A two-line token uses LF only: line one is BEGIN and line two is exactly four uppercase ASCII letters. No final LF or other text.
  regex: "/^BEGIN\\n[A-Z]{4}$(?![\\s\\S])/"
  match:
    - "BEGIN\nAAAA"
    - "BEGIN\nZZZZ"
    - "BEGIN\nABCD"
    - "BEGIN\nWXYZ"
    - "BEGIN\nQWER"
    - "BEGIN\nASDF"
    - "BEGIN\nZXCV"
    - "BEGIN\nMNOP"
  no_match:
    - "BEGIN\nABC"
    - "BEGIN\nABCDE"
    - "BEGIN\nAbCD"
    - "BEGIN\r\nABCD"
    - "begin\nABCD"
    - "BEGIN ABCD"
    - "BEGIN\nABC1"
    - "!BEGIN\nAAAA"
    - "BEGIN\nAAAA!"
    - "BEGIN\nAAAA\n"
    - "BEGIN\nAAAA\r"
    - "BEGIN\nAAAA\r\n"
    - "BEGIN\nAAAA\u2028"
    - "BEGIN\nAAAA\u2029"
    - " BEGIN\nAAAA"
    - "BEGIN\nAAAA "
  pitfall: >-
    The LF is mandatory and not replaceable by whitespace.
- id: gpt-multiline-02
  difficulty: simple
  status: ok
  description: >-
    A two-line counter uses LF only: line one is COUNT and line two is exactly four ASCII digits, leading zeros allowed. No final LF.
  regex: "/^COUNT\\n[0-9]{4}$(?![\\s\\S])/"
  match:
    - "COUNT\n0000"
    - "COUNT\n9999"
    - "COUNT\n1234"
    - "COUNT\n4321"
    - "COUNT\n1000"
    - "COUNT\n0001"
    - "COUNT\n5555"
    - "COUNT\n9876"
  no_match:
    - "COUNT\n000"
    - "COUNT\n00000"
    - "COUNT\n123a"
    - "COUNT\r\n1234"
    - "count\n1234"
    - "COUNT 1234"
    - "COUNT\n\uff11\uff12\uff13\uff14"
    - "!COUNT\n0000"
    - "COUNT\n0000!"
    - "COUNT\n0000\n"
    - "COUNT\n0000\r"
    - "COUNT\n0000\r\n"
    - "COUNT\n0000\u2028"
    - "COUNT\n0000\u2029"
    - " COUNT\n0000"
    - "COUNT\n0000 "
  pitfall: >-
    Line break and numeric width are both literal requirements.
- id: gpt-multiline-03
  difficulty: simple
  status: ok
  description: >-
    Accept exactly three LF-separated lines: open, then one lowercase ASCII word of exactly four letters, then close. No trailing LF, CR or whitespace.
  regex: "/^open\\n[a-z]{4}\\nclose$(?![\\s\\S])/"
  match:
    - "open\naaaa\nclose"
    - "open\nzzzz\nclose"
    - "open\nabcd\nclose"
    - "open\nwxyz\nclose"
    - "open\nword\nclose"
    - "open\ntext\nclose"
    - "open\nline\nclose"
    - "open\nname\nclose"
  no_match:
    - "open\nabc\nclose"
    - "open\nabcde\nclose"
    - "open\nABCD\nclose"
    - "Open\nabcd\nclose"
    - "open\nabcd\nClose"
    - "open\r\nabcd\nclose"
    - "open\nabc1\nclose"
    - "!open\naaaa\nclose"
    - "open\naaaa\nclose!"
    - "open\naaaa\nclose\n"
    - "open\naaaa\nclose\r"
    - "open\naaaa\nclose\r\n"
    - "open\naaaa\nclose\u2028"
    - "open\naaaa\nclose\u2029"
    - " open\naaaa\nclose"
    - "open\naaaa\nclose "
  pitfall: >-
    Fixed framing lines do not make the middle line arbitrary.
- id: gpt-multiline-04
  difficulty: simple
  status: ok
  description: >-
    A CRLF-only receipt consists of READY followed by CRLF and then exactly four uppercase hexadecimal characters. No final line ending, isolated LF or spaces.
  regex: "/^READY\\r\\n[0-9A-F]{4}$(?![\\s\\S])/"
  match:
    - "READY\r\n0000"
    - "READY\r\nFFFF"
    - "READY\r\nABCD"
    - "READY\r\n1234"
    - "READY\r\n00FF"
    - "READY\r\nFF00"
    - "READY\r\nA001"
    - "READY\r\n99AA"
  no_match:
    - "READY\n0000"
    - "READY\r0000"
    - "READY\r\n000"
    - "READY\r\n00000"
    - "READY\r\nabcd"
    - "READY\r\nG000"
    - "ready\r\n0000"
    - "!READY\r\n0000"
    - "READY\r\n0000!"
    - "READY\r\n0000\n"
    - "READY\r\n0000\r"
    - "READY\r\n0000\r\n"
    - "READY\r\n0000\u2028"
    - "READY\r\n0000\u2029"
    - " READY\r\n0000"
    - "READY\r\n0000 "
  pitfall: >-
    CRLF is a two-character sequence, not any line break.
- id: gpt-multiline-05
  difficulty: simple
  status: ok
  description: >-
    An LF-only pair has exactly four lowercase ASCII letters on each of its two lines. They may differ; no final LF or empty lines.
  regex: "/^[a-z]{4}\\n[a-z]{4}$(?![\\s\\S])/"
  match:
    - "aaaa\naaaa"
    - "zzzz\nzzzz"
    - "abcd\nwxyz"
    - "word\ntext"
    - "line\nname"
    - "test\ncase"
    - "left\nside"
    - "abcd\nabcd"
  no_match:
    - "abc\nabcd"
    - "abcde\nabcd"
    - "abcd\nabc"
    - "abcd\nabcde"
    - "ABCD\nabcd"
    - "abcd\r\nabcd"
    - "abcd abcd"
    - "abcd\nabc1"
    - "!aaaa\naaaa"
    - "aaaa\naaaa!"
    - "aaaa\naaaa\n"
    - "aaaa\naaaa\r"
    - "aaaa\naaaa\r\n"
    - "aaaa\naaaa\u2028"
    - "aaaa\naaaa\u2029"
    - " aaaa\naaaa"
    - "aaaa\naaaa "
  pitfall: >-
    Both line widths are checked separately.
- id: gpt-multiline-06
  difficulty: medium
  status: ok
  description: >-
    Form-validation ticket: A batch text is 2 to 4 LF-separated lines, each exactly three ASCII digits. No final LF or CR; leading zeros are allowed.
  regex: "/^[0-9]{3}(?:\\n[0-9]{3}){1,3}$(?![\\s\\S])/"
  match:
    - "000\n000"
    - "999\n999"
    - "123\n456\n789"
    - "000\n111\n222\n333"
    - "100\n001"
    - "001\n002\n003"
    - "999\n000\n999\n000"
    - "555\n666"
  no_match:
    - "000"
    - "000\n000\n000\n000\n000"
    - "00\n000"
    - "000\n0000"
    - "000\r\n000"
    - "000\n00a"
    - "000\n\n000"
    - "!000\n000"
    - "000\n000!"
    - "000\n000\n"
    - "000\n000\r"
    - "000\n000\r\n"
    - "000\n000\u2028"
    - "000\n000\u2029"
    - " 000\n000"
    - "000\n000 "
  pitfall: >-
    Bound the line count and every line width independently.
- id: gpt-multiline-07
  difficulty: medium
  status: ok
  description: >-
    Search LF-separated text for an entire line TASK: followed by a canonical integer 1 through 32. Other lines may be arbitrary; CR is not a delimiter or stripped suffix.
  regex: "/(?:^|\\n)TASK:(?:[1-9]|[12][0-9]|3[0-2])(?=\\n|(?![\\s\\S]))/"
  match:
    - "TASK:1"
    - "TASK:32"
    - "x\nTASK:10\ny"
    - "\nTASK:9\n"
    - "TASK:20\nx"
    - "x\nTASK:31"
    - "a\nb\nTASK:2\nz"
    - "TASK:30"
  no_match:
    - "TASK:0"
    - "TASK:33"
    - "TASK:01"
    - "task:1"
    - "x TASK:1"
    - "TASK:1 x"
    - "TASK:1\r"
    - "TASK:+1"
  pitfall: >-
    Only a full LF-delimited line is a qualifying occurrence.
- id: gpt-multiline-08
  difficulty: medium
  status: ok
  description: >-
    A two-line settings text is mode= followed by fast or safe, LF, then retries= and an integer 0 through 9. No final LF, CR or extra whitespace.
  regex: "/^mode=(?:fast|safe)\\nretries=[0-9]$(?![\\s\\S])/"
  match:
    - "mode=fast\nretries=0"
    - "mode=safe\nretries=9"
    - "mode=fast\nretries=1"
    - "mode=safe\nretries=2"
    - "mode=fast\nretries=3"
    - "mode=safe\nretries=4"
    - "mode=fast\nretries=5"
    - "mode=safe\nretries=6"
  no_match:
    - "mode=FAST\nretries=0"
    - "mode=slow\nretries=0"
    - "mode=fast\nretries=10"
    - "mode=fast\nretries=00"
    - "mode=fast\r\nretries=0"
    - "mode=fast retries=0"
    - "mode=fast\nretries=a"
    - "!mode=fast\nretries=0"
    - "mode=fast\nretries=0!"
    - "mode=fast\nretries=0\n"
    - "mode=fast\nretries=0\r"
    - "mode=fast\nretries=0\r\n"
    - "mode=fast\nretries=0\u2028"
    - "mode=fast\nretries=0\u2029"
    - " mode=fast\nretries=0"
    - "mode=fast\nretries=0 "
  pitfall: >-
    Enumerated setting and digit width are independent across lines.
- id: gpt-multiline-09
  difficulty: medium
  status: ok
  description: >-
    Validate 1 to 3 LF-separated lines of the form item= followed by 2 to 6 lowercase ASCII letters. No empty line, final LF, CR or whitespace.
  regex: "/^item=[a-z]{2,6}(?:\\nitem=[a-z]{2,6}){0,2}$(?![\\s\\S])/"
  match:
    - "item=ab"
    - "item=abcdef"
    - "item=ab\nitem=cd"
    - "item=abc\nitem=def\nitem=ghi"
    - "item=one"
    - "item=two\nitem=three"
    - "item=red\nitem=green\nitem=blue"
    - "item=foo\nitem=bar"
  no_match:
    - "item=a"
    - "item=abcdefg"
    - "item=AB"
    - "item=ab\nitem=cd\nitem=ef\nitem=gh"
    - "item=ab\n\nitem=cd"
    - "item=ab\r\nitem=cd"
    - "Item=ab"
    - "!item=ab"
    - "item=ab!"
    - "item=ab\n"
    - "item=ab\r"
    - "item=ab\r\n"
    - "item=ab\u2028"
    - "item=ab\u2029"
    - " item=ab"
    - "item=ab "
  pitfall: >-
    Each line has the same constraints and total count is bounded.
- id: gpt-multiline-10
  difficulty: medium
  status: ok
  description: >-
    Import gate — reject any nonconforming input. A folded note is NOTE: plus one space and 1 to 12 lowercase ASCII letters, then one LF and one tab followed by another 1 to 12 lowercase ASCII letters. No final LF, spaces on the continuation or other lines.
  regex: "/^NOTE: [a-z]{1,12}\\n\\t[a-z]{1,12}$(?![\\s\\S])/"
  match:
    - "NOTE: a\n\tb"
    - "NOTE: abcdefghijkl\n\tmnopqrstuvwx"
    - "NOTE: hello\n\tworld"
    - "NOTE: red\n\tgreen"
    - "NOTE: foo\n\tbar"
    - "NOTE: one\n\ttwo"
    - "NOTE: text\n\tmore"
    - "NOTE: long\n\tnote"
  no_match:
    - "NOTE: \n\tb"
    - "NOTE: a\n\t"
    - "NOTE: abcdefghijklm\n\tb"
    - "NOTE: a\n\tmnopqrstuvwxy"
    - "NOTE: a\n b"
    - "NOTE: a\r\n\tb"
    - "NOTE: A\n\tb"
    - "!NOTE: a\n\tb"
    - "NOTE: a\n\tb!"
    - "NOTE: a\n\tb\n"
    - "NOTE: a\n\tb\r"
    - "NOTE: a\n\tb\r\n"
    - "NOTE: a\n\tb\u2028"
    - "NOTE: a\n\tb\u2029"
    - " NOTE: a\n\tb"
    - "NOTE: a\n\tb "
  pitfall: >-
    A tab continuation is not interchangeable with spaces.
- id: gpt-multiline-11
  difficulty: medium
  status: ok
  description: >-
    Search filter, not whole-input validation. Search LF-separated output for an entire line consisting of exactly four uppercase ASCII letters. Other lines are unrestricted; CR is content, not a delimiter.
  regex: "/(?:^|\\n)[A-Z]{4}(?=\\n|(?![\\s\\S]))/"
  match:
    - "ABCD"
    - "WXYZ"
    - "x\nAAAA\ny"
    - "\nZZZZ\n"
    - "QWER\nx"
    - "x\nASDF"
    - "a\nb\nZXCV\nz"
    - "MNOP"
  no_match:
    - "ABC"
    - "ABCDE"
    - "AbCD"
    - "x ABCD"
    - "ABCD x"
    - "ABCD\r"
    - "ABC1"
    - "abcd"
  pitfall: >-
    Line-local width does not imply full-input anchoring.
- id: gpt-multiline-12
  difficulty: medium
  status: ok
  description: >-
    Search text for a whole JavaScript line containing exactly OK, a colon, and four ASCII digits. Lines are separated by any JavaScript line terminator: LF, CR, U+2028 or U+2029, with CRLF also allowed. Other lines are unrestricted.
  regex: "/^OK:[0-9]{4}$/m"
  match:
    - "OK:0000"
    - "x\nOK:9999\ny"
    - "x\rOK:1234\ry"
    - "x\r\nOK:4321\r\ny"
    - "x\u2028OK:1000\u2028y"
    - "x\u2029OK:0001\u2029y"
    - "OK:5555\n"
    - "\nOK:9876"
  no_match:
    - "OK:000"
    - "OK:00000"
    - "ok:0000"
    - "x OK:0000"
    - "OK:0000 x"
    - "OK:00a0"
    - "OK:\t0000"
    - "OK:\uff11\uff12\uff13\uff14"
  pitfall: >-
    This search deliberately uses JavaScript line terminators rather than LF-only splitting.
- id: gpt-multiline-13
  difficulty: medium
  status: ok
  description: >-
    An LF-only checklist has 2 to 4 lines; each line is [x] space plus 2 to 8 lowercase ASCII letters or [ ] space plus that word. At least one line must be checked. No final LF.
  regex: "/^(?=(?:[^\\n]*\\n)*\\[x\\] )\\[(?:x| )\\] [a-z]{2,8}(?:\\n\\[(?:x| )\\] [a-z]{2,8}){1,3}$(?![\\s\\S])/"
  match:
    - "[x] ab\n[ ] cd"
    - "[ ] ab\n[x] cd"
    - "[x] abcdefgh\n[x] ijklmnop"
    - "[x] one\n[ ] two\n[ ] three"
    - "[ ] aa\n[ ] bb\n[ ] cc\n[x] dd"
    - "[x] foo\n[x] bar"
    - "[ ] red\n[x] green\n[ ] blue"
    - "[x] item\n[ ] next"
  no_match:
    - "[ ] ab\n[ ] cd"
    - "[x] ab"
    - "[x] aa\n[ ] bb\n[ ] cc\n[ ] dd\n[ ] ee"
    - "[x] a\n[ ] cd"
    - "[x] abcdefghi\n[ ] cd"
    - "[X] ab\n[ ] cd"
    - "[x] ab\r\n[ ] cd"
    - "![x] ab\n[ ] cd"
    - "[x] ab\n[ ] cd!"
    - "[x] ab\n[ ] cd\n"
    - "[x] ab\n[ ] cd\r"
    - "[x] ab\n[ ] cd\r\n"
    - "[x] ab\n[ ] cd\u2028"
    - "[x] ab\n[ ] cd\u2029"
    - " [x] ab\n[ ] cd"
    - "[x] ab\n[ ] cd "
  pitfall: >-
    A checked item can occur on any permitted line.
- id: gpt-multiline-14
  difficulty: hard
  status: ok
  description: >-
    An LF-only two-line label is name= plus 3 to 8 lowercase ASCII letters, then copy= plus the exact same letters. No final LF, CR or spaces. Both values must be enclosed in matching ASCII single or double quotes, using the same quote character on both lines. The quotes are delimiters, not part of the value; no escapes are permitted.
  regex: "/^name=(['\\\"])([a-z]{3,8})\\1\\ncopy=\\1\\2\\1$(?![\\s\\S])/"
  match:
    - "name='abc'\ncopy='abc'"
    - "name=\"xyz\"\ncopy=\"xyz\""
    - "name='abcdefgh'\ncopy='abcdefgh'"
    - "name=\"hello\"\ncopy=\"hello\""
    - "name='world'\ncopy='world'"
    - "name=\"draft\"\ncopy=\"draft\""
    - "name='sample'\ncopy='sample'"
    - "name=\"title\"\ncopy=\"title\""
  no_match:
    - "name='abc'\ncopy='xyz'"
    - "name='abc\r'\ncopy='abc'"
    - "name=abc copy=abc"
    - "name=abc\nCopy=abc"
    - "name='?'\ncopy='?'"
    - "name='abc'\ncopy='abc '"
    - "name='!!!'\ncopy='!!!'"
    - "name='ab'\ncopy='ab'"
    - "name='abc0'\ncopy='abc0'"
    - "name='000'\ncopy='000'"
    - "name='abc\"\ncopy='abc'"
    - "name='abc'\ncopy=\"abc\""
    - "name=abc\ncopy=abc"
    - "name='abc'\r\ncopy='abc'"
    - "!name='abc'\ncopy='abc'"
    - "name='abc'\ncopy='abc'!"
    - "name='abc'\ncopy='abc'\n"
    - "name='abc'\ncopy='abc'\r"
    - "name='abc'\ncopy='abc'\r\n"
    - "name='abc'\ncopy='abc'\u2028"
    - "name='abc'\ncopy='abc'\u2029"
    - " name='abc'\ncopy='abc'"
    - "name='abc'\ncopy='abc' "
  pitfall: >-
    The exact value and quote convention must agree across LF-separated lines, in addition to the value policy.
- id: gpt-multiline-15
  difficulty: hard
  status: ok
  description: >-
    Code review requirement: A three-line LF-only block is START: and a lowercase ASCII label 3 to 8 letters, then a four-digit ASCII value, then END: and the exact same label. No final LF, CR or spaces; label cannot be tmp.
  regex: "/^START:(?!tmp\\n)([a-z]{3,8})\\n[0-9]{4}\\nEND:\\1$(?![\\s\\S])/"
  match:
    - "START:abc\n0000\nEND:abc"
    - "START:xyz\n9999\nEND:xyz"
    - "START:abcdefgh\n1234\nEND:abcdefgh"
    - "START:tmpx\n4321\nEND:tmpx"
    - "START:data\n1000\nEND:data"
    - "START:word\n0001\nEND:word"
    - "START:sample\n5555\nEND:sample"
    - "START:title\n9876\nEND:title"
  no_match:
    - "START:tmp\n1234\nEND:tmp"
    - "START:abc\n1234\nEND:xyz"
    - "START:ab\n1234\nEND:ab"
    - "START:abcdefghi\n1234\nEND:abcdefghi"
    - "START:ABC\n1234\nEND:ABC"
    - "START:abc\n123\nEND:abc"
    - "START:abc\r\n1234\nEND:abc"
    - "!START:abc\n0000\nEND:abc"
    - "START:abc\n0000\nEND:abc!"
    - "START:abc\n0000\nEND:abc\n"
    - "START:abc\n0000\nEND:abc\r"
    - "START:abc\n0000\nEND:abc\r\n"
    - "START:abc\n0000\nEND:abc\u2028"
    - "START:abc\n0000\nEND:abc\u2029"
    - " START:abc\n0000\nEND:abc"
    - "START:abc\n0000\nEND:abc "
  pitfall: >-
    The label spans framing lines while the middle line has a separate width.
- id: gpt-multiline-16
  difficulty: hard
  status: ok
  description: >-
    A localized two-line label: the literal prefix title= followed by 2 through 12 Unicode letter clusters. Each cluster is a Unicode letter followed by zero to two Unicode combining marks. One optional ASCII hyphen may join two nonempty runs of clusters, but no edge hyphen or second hyphen is allowed. Length counts letter clusters, excluding the hyphen and any fixed prefix; spaces, digits and other characters are forbidden. No normalization is performed. Append the exact literal suffix LF followed by status=ok after the name; its characters do not count toward the cluster limit.
  regex: "/^title=(?=(?:\\p{L}\\p{M}{0,2}-?){2,12}\\nstatus=ok$)(?:\\p{L}\\p{M}{0,2}){1,12}(?:-(?:\\p{L}\\p{M}{0,2}){1,12})?\\nstatus=ok$(?![\\s\\S])/u"
  match:
    - "title=ab\nstatus=ok"
    - "title=e\u0301x\nstatus=ok"
    - "title=a\u0301\u0308b\nstatus=ok"
    - "title=\u6771\u4eac-\u5927\u962a\nstatus=ok"
    - "title=\u0394\u03ad\u03bb\u03c4\u03b1\nstatus=ok"
    - "title=\u0645\u0631\u062d\u0628\u0627\nstatus=ok"
    - "title=\u0417\u0438\u043c\u0430\nstatus=ok"
    - "title=abcdefghijkl\nstatus=ok"
    - "title=e\u0301-e\u0308\nstatus=ok"
    - "title=A\u00e9\nstatus=ok"
  no_match:
    - "title=a\nstatus=ok"
    - "title=abcdefghijklm\nstatus=ok"
    - "title=ab1\nstatus=ok"
    - "title=a_b\nstatus=ok"
    - "title=a b\nstatus=ok"
    - "title=e\u0301\nstatus=ok"
    - "title=\U0001f600a\nstatus=ok"
    - "title=\u0301ab\nstatus=ok"
    - "title=a\u0301\u0308\u0303b\nstatus=ok"
    - "title=-ab\nstatus=ok"
    - "title=ab-\nstatus=ok"
    - "title=a--b\nstatus=ok"
    - "title=ab-cd-ef\nstatus=ok"
    - "title=ab"
    - "title=ab?status=ok"
    - "title=ab\nSTATUS=OK"
    - "!title=ab\nstatus=ok"
    - "title=ab\nstatus=ok!"
    - "title=ab\nstatus=ok\n"
    - "title=ab\nstatus=ok\r"
    - "title=ab\nstatus=ok\r\n"
    - "title=ab\nstatus=ok\u2028"
    - "title=ab\nstatus=ok\u2029"
    - " title=ab\nstatus=ok"
    - "title=ab\nstatus=ok "
  pitfall: >-
    Count base-letter clusters, attach bounded marks only after a letter, and limit the optional internal separator.
- id: gpt-multiline-17
  difficulty: hard
  status: ok
  description: >-
    A free-form multiline capsule is entirely enclosed in ML{ and }ML. Its interior has 1 to 40 Unicode code points, may contain any characters, and must include both one LF and the lowercase substring body.
  regex: "/^ML\\{(?=.{1,40}\\}ML$)(?=.*\\n)(?=.*body).*\\}ML$(?![\\s\\S])/su"
  match:
    - "ML{body\n}ML"
    - "ML{\nbody}ML"
    - "ML{a\nbody}ML"
    - "ML{body\nb}ML"
    - "ML{body\n\n}ML"
    - "ML{\U0001f600body\n}ML"
    - "ML{body\t\n}ML"
    - "ML{xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxbody\n}ML"
  no_match:
    - "ML{}ML"
    - "ML{body}ML"
    - "ML{\nabc}ML"
    - "ML{BODY\n}ML"
