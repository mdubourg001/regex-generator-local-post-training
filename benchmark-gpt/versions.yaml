    - "RC0000"
    - "RC?00"
    - "RC 00"
    - "RC00\u00e9"
    - "RC000\t"
    - "R?000"
    - "!RC000"
    - "RC000!"
    - "RC000\n"
    - "RC000\r"
    - "RC000\r\n"
    - "RC000\u2028"
    - "RC000\u2029"
    - " RC000"
    - "RC000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-versions-04
  difficulty: simple
  status: ok
  description: >-
