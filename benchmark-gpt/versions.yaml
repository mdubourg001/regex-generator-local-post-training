# Benchmark GPT, catégorie versions. Format et contrôles : scripts/benchmark.py.
- id: gpt-versions-01
  difficulty: simple
  status: ok
  description: >-
    A release serial is rel- followed by exactly six ASCII digits. Leading zeros are permitted.
  regex: "/^rel\\-[0123456789]{6}$(?![\\s\\S])/"
  match:
    - "rel-000000"
    - "rel-999999"
    - "rel-555555"
    - "rel-090909"
    - "rel-909090"
    - "rel-099999"
    - "rel-900000"
    - "rel-500000"
  no_match:
    - "rel-00000"
    - "rel-0000000"
    - "rel-?00000"
    - "rel- 00000"
    - "rel-00000\u00e9"
    - "rel-000000\t"
    - "rel?000000"
    - "!rel-000000"
    - "rel-000000!"
    - "rel-000000\n"
    - "rel-000000\r"
    - "rel-000000\r\n"
    - "rel-000000\u2028"
    - "rel-000000\u2029"
    - " rel-000000"
    - "rel-000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-versions-02
  difficulty: simple
  status: ok
  description: >-
    A snapshot tag is snap. followed by exactly eight lowercase hexadecimal characters, no other components.
  regex: "/^snap\\.[0123456789abcdef]{8}$(?![\\s\\S])/"
  match:
    - "snap.00000000"
    - "snap.ffffffff"
    - "snap.88888888"
    - "snap.0f0f0f0f"
    - "snap.f0f0f0f0"
    - "snap.0fffffff"
    - "snap.f0000000"
    - "snap.80000000"
  no_match:
    - "snap.0000000"
    - "snap.000000000"
    - "snap.?0000000"
    - "snap. 0000000"
    - "snap.0000000\u00e9"
    - "snap.00000000\t"
    - "snap?00000000"
    - "snap.A0000000"
    - "!snap.00000000"
    - "snap.00000000!"
    - "snap.00000000\n"
    - "snap.00000000\r"
    - "snap.00000000\r\n"
    - "snap.00000000\u2028"
    - "snap.00000000\u2029"
    - " snap.00000000"
    - "snap.00000000 "
  pitfall: >-
    Literal punctuation, allowed characters, and exact width all matter.
- id: gpt-versions-03
  difficulty: simple
