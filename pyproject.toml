[project]
name = "post-training"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub[cli]>=1.33.0",
    "mlx>=0.32.2",
    "mlx-lm>=0.31.3",
    "mlx-lm-lora>=3.1.3",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
