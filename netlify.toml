# Build public du playground (playground/). Les poids sont chargés depuis le Hub Hugging Face, pas servis ici, à la
# révision figée ci-dessous : pour publier un nouvel export, l'uploader puis mettre à jour le SHA.
[build]
  base = "playground"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_HUB_SFT_QWEN3_5_0_8B = "maximedubourg/regex-sft-qwen3.5-0.8b-onnx@7d3395acc8b0aa78c2ebd4fd7c26de365842aadb"
  VITE_HUB_SFT_QWEN3_1_7B = "maximedubourg/regex-sft-qwen3-1.7b-onnx@4a9fe6eb6e9d23c869959b0b01903af53fc707cf"

# Fichiers de Vite nommés par hash de contenu, dont le runtime onnxruntime-web (~27 Mo) : cache permanent.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
