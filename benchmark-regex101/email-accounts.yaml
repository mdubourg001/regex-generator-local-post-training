- id: real-x00676
  difficulty: medium
  status: ok
  description: Validate a university email address ending in the exact lowercase domain unal.edu.co. The local part is nonempty and contains only ASCII letters, digits, periods, exclamation marks, hashes, dollar signs, percent signs, ampersands, apostrophes, asterisks, plus signs, slashes, equals signs, question marks, carets, underscores, backticks, braces, vertical bars, tildes or hyphens. No restrictions on local-part period placement are imposed. No whitespace or additional suffix is allowed.
  regex: /^(?:[A-Za-z0-9.!#$%&\x27*+\/=?^_`{|}~-]+@unal\.edu\.co)(?![\s\S])$/
  match:
  - test@unal.edu.co
  - A1@unal.edu.co
  - a.b@unal.edu.co
  - a+b@unal.edu.co
  - _@unal.edu.co
  - a..b@unal.edu.co
  - '!@unal.edu.co'
  - a-b@unal.edu.co
  no_match:
