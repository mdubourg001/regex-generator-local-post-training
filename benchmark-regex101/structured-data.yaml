  - ou=999999,dc=placetel,dc=de
  - uid=000000,ou=000001,dc=placetel,dc=de
  - uid=123456,ou=654321,dc=placetel,dc=de
  - ou=123456,dc=placetel,dc=de
  - uid=999999,ou=999999,dc=placetel,dc=de
