- id: real-x01396
  difficulty: medium
  status: ok
  description: Validate a Placetel LDAP distinguished name with optional lowercase uid equals six ASCII digits and a comma, then mandatory lowercase ou equals six digits and the exact suffix ,dc=placetel,dc=de. No spaces, repeated uid fields or additional text are allowed.
  regex: /^(?:(?:uid=[0-9]{6},)?ou=[0-9]{6},dc=placetel,dc=de)(?![\s\S])$/
  match:
