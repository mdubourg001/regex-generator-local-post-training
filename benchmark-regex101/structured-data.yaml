- id: real-x04665
  difficulty: simple
  status: ok
  description: Validate one or more nonempty sequences of ASCII digits separated by single tabs. Leading zeros are allowed. No empty fields, spaces, line breaks, or other characters are allowed.
  regex: /^[0-9]+(?:\t[0-9]+)*(?!.)$/s
  match:
  - "52291368\t134"
  - "133391256\t89"
  - "2474755\t35"
  - '1'
  - '0'
  - "001\t002"
  - "1\t2\t3"
  - "999\t0"
  no_match:
  - "x1\t2"
  - "1\t2x"
  - "1\t"
  - 1 2
  - "1\t\t2"
  - "1\t2\n"
  - ''
  - hello
  - '###'
- id: real-x05350
  difficulty: medium
  status: ok
  description: Validate a compact shape record. Begin with one or more ASCII digits and one ordinary space. A paired CARRE, RECTANGLE, OVALE or LIGNE tag contains exactly four unsigned ASCII integer values separated by one ordinary space; a paired CERCLE tag contains exactly three. Require one ordinary space immediately after the opening tag and before the closing tag, whose name must match. No other spaces or characters are allowed.
  regex: /^[0-9]+ <(?:(CARRE|RECTANGLE|OVALE|LIGNE)> [0-9]+ [0-9]+ [0-9]+ [0-9]+ <\/\1>|CERCLE> [0-9]+ [0-9]+ [0-9]+ <\/CERCLE>)$(?![\s\S])/
  match:
  - 1111 <CARRE> 123 321 111 222 </CARRE>
  - 2222 <RECTANGLE> 234 432 333 444 </RECTANGLE>
  - 3333 <CERCLE> 345 543 555 </CERCLE>
  - 4444 <OVALE> 456 654 666 777 </OVALE>
  - 5555 <LIGNE> 567 765 888 999 </LIGNE>
  - 0 <CERCLE> 0 0 0 </CERCLE>
  - 01 <CARRE> 00 01 02 03 </CARRE>
  - 9 <LIGNE> 1 2 3 4 </LIGNE>
  no_match:
  - 1 <CARRE> 1 2 3 4 </LIGNE>
  - 1 <CARRE> 1 2 3 </CARRE>
  - x1 <CARRE> 1 2 3 4 </CARRE>
  - 1 <CARRE> 1 2 3 4 </CARRE>x
  - 1 <CARRE> 1 2 a 4 </CARRE>
  - 1  <CARRE> 1 2 3 4 </CARRE>
  - ''
  - unrelated
  - '1111 <CARRE> 123 321 111 222 </CARRE>

    '
- id: real-x08381
  difficulty: medium
  status: ok
  description: Validate a pipe-delimited record with two nonempty name fields and a nonempty ASCII integer field. Each name field contains ASCII letters and spaces and must contain at least one letter. Zero or more spaces may surround either pipe and may precede a name. No space follows the integer. No other punctuation, digits inside names, tabs or line breaks are allowed.
  regex: '/^(?: *[A-Za-z][A-Za-z ]*\| *[A-Za-z][A-Za-z ]*\| *[0-9]+)(?!\s|\S)$/'
  match:
  - Paduch        | Karol    | 21
  - Young         | Travis   | 25
  - Martin        | Chris    | 21
  - Zander Fanden | Person | 23
  - A|B|0
  - ' Smith | John | 001'
  - Alpha Beta|Gamma Delta|999
  - X | Y | 12345
  no_match:
  - '!A|B|0'
  - A|B|0!
  - '|B|0'
  - A|B|
  - A1|B|0
  - A|B|a
  - ''
  - unrelated input
  - "\u2603"
