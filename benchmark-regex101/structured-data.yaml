# Évaluation réelle (regex101, annotée par GPT 6.1 Sol), catégorie structured-data. Voir scripts/regex101.py.
- id: real-x00198
  difficulty: hard
  status: ok
  description: 'Shape record: an unsigned integer ID, one ASCII space, an uppercase opening tag, one space, space-separated unsigned integer parameters, one space and the corresponding closing tag. CARRE, RECTANGLE, OVALE and LIGNE require four parameters; CERCLE requires three. No other whitespace, signs, attributes or text. Leading zeros are allowed.'
  regex: /^\d+ <(?:(CARRE|RECTANGLE|OVALE|LIGNE)> \d+ \d+ \d+ \d+ <\/\1|CERCLE> \d+ \d+ \d+ <\/CERCLE)>$/
  match:
  - 1111 <CARRE> 123 321 111 222 </CARRE>
  - 0 <RECTANGLE> 0 0 1 1 </RECTANGLE>
  - 1 <CERCLE> 1 2 3 </CERCLE>
  - 2 <OVALE> 1 2 3 4 </OVALE>
  - 3 <LIGNE> 1 2 3 4 </LIGNE>
  - 000 <CARRE> 00 01 002 3 </CARRE>
  - 99 <CERCLE> 0 0 0 </CERCLE>
  - 999 <RECTANGLE> 100 200 300 400 </RECTANGLE>
  no_match:
  - 1 <CARRE> 1 2 3 </CARRE>
  - 1 <CARRE> 1 2 3 4 </OVALE>
  - 1 <CERCLE> 1 2 3 4 </CERCLE>
  - 1 <carre> 1 2 3 4 </carre>
  - x1 <CERCLE> 1 2 3 </CERCLE>
  - 1 <CERCLE> 1 2 3 </CERCLE>x
  - ''
  - unrelated text
  - "\U0001F642"
- id: real-x00589
  difficulty: medium
  status: ok
  description: Validate the structural shape of an AWS ARN. It starts with lowercase arn and a colon, then four colon-delimited fields for partition, service, region and account, followed by a resource field. The four fields may be empty but cannot contain colons or line terminators. The resource may be empty and may contain additional colons or slashes. Reject all line terminators; no semantic AWS checks are required.
  regex: /^(?:arn:(?:[^:\r\n\u2028\u2029]*:){4}[^\r\n\u2028\u2029]*)(?![\s\S])$/
  match:
  - arn:aws:s3:::bucket
  - arn:aws:iam::123:user/a
  - arn:aws:lambda:eu:123:function:f
  - arn:a:b:c:d:e
  - 'arn:::::'
  - arn:aws-cn:s3:::a/b
  - arn:aws:ec2:r:1:instance/i
  - arn:a:b::0:x:y
  no_match:
  - ARN:a:b:c:d:e
  - arn:a:b:c:e
  - 'arn:a:b:c:d:e

    '
  - xarn:a:b:c:d:e
  - 'arn:a:b

    c:d:e'
  - "arn:a:b:c:d\r:e"
  - ''
  - aws:s3
  - hello
- id: real-x00605
  difficulty: medium
  status: ok
  description: Validate a brace-enclosed comma-separated list of bundle-ID tokens. The list may be empty. Each token is nonempty and contains only ASCII letters, digits, underscores or periods. No spaces, empty list elements or trailing comma are allowed; no additional period placement rules apply.
  regex: /^(?:\{(?:[A-Za-z0-9_.]+(?:,[A-Za-z0-9_.]+)*)?\})(?![\s\S])$/
  match:
  - '{}'
  - '{a}'
  - '{a.b.c,d.ef}'
  - '{A_1}'
  - '{a,b,c}'
  - '{.}'
  - '{x..y}'
  - '{1_2,three.four}'
  no_match:
  - '{,a}'
  - '{a,}'
  - '{a,,b}'
  - '{a-b}'
  - ' {a}'
  - '{a} '
  - ''
  - '[]'
  - '{a}

    '
- id: real-x00785
  difficulty: simple
  status: ok
  description: Validate a section-header line consisting of an opening square bracket, a nonempty name of ASCII letters, digits or underscores, and a closing square bracket. No leading or trailing text or whitespace is permitted.
  regex: /^(?:\[[A-Za-z0-9_]+\])(?![\s\S])$/
  match:
  - '[abilities]'
  - '[spac_eship]'
  - '[a]'
  - '[ABC]'
  - '[123]'
  - '[_]'
  - '[section1]'
  - '[name_2]'
  no_match:
  - '[]'
  - '[a-b]'
  - '[a b]'
  - '[a'
  - ' [a]'
  - '[a]x'
  - ''
  - name=value
  - '[a]

    '
- id: real-x01061
  difficulty: medium
  status: ok
  description: 'Validate a comma-separated list of one or more SQL value tuples. Each tuple has ten fields enclosed by parentheses: two unsigned ASCII integers, a single-quoted nonempty ASCII word-character string, and seven unsigned ASCII integers, all separated by commas. Word characters are letters, digits and underscores. No spaces, trailing comma or escaping are permitted.'
  regex: /^(?:\([0-9]+,[0-9]+,\x27[A-Za-z0-9_]+\x27(?:,[0-9]+){7}\)(?:,\([0-9]+,[0-9]+,\x27[A-Za-z0-9_]+\x27(?:,[0-9]+){7}\))*)(?![\s\S])$/
  match:
