  status: ok
  description: Validate template text where every opening brace belongs to a double-brace placeholder. Inside each placeholder allow optional ASCII spaces, a nonempty name of ASCII letters, digits or underscores, optional ASCII spaces and two closing braces. Outside placeholders any character except an opening brace is allowed, including closing braces and line breaks. Empty text is valid.
