  - '0'
  - '1234567890123456'
  - '.22222'
  - '1.22222'
  - 1,220
  - 1,111,000,111,000,111
  - '1234567890123456.1234567890123456'
  no_match:
  - '00'
  - 1,22
  - '12345678901234567'
  - '1.12345678901234567'
  - x1,220
