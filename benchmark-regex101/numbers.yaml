- id: real-x00208
  difficulty: simple
  status: ok
  description: Nonnegative decimal number without a sign. Accept one or more digits, optionally followed by a dot and one or more digits; also accept a leading dot followed by digits. Leading zeros and zero are allowed. No exponent, trailing dot or whitespace.
  regex: /^(?:\d+(?:\.\d+)?|\.\d+)$/
  match:
  - '10'
  - '0.000001'
  - '.000001'
  - '0'
  - '0.00'
  - '1.00'
  - '001.50'
  - '.9'
  no_match:
  - '-1'
  - '+1'
  - '1.'
  - 1e3
  - x10
  - 10x
  - ''
  - unrelated text
  - "\U0001F642"
- id: real-x00509
  difficulty: medium
  status: ok
  description: Non-scientific signed decimal number. Optional leading minus only. Integer part is zero or digits without a leading zero; optionally add a dot and one or more digits. A leading dot with fractional digits is also allowed. No trailing dot, plus sign, spaces or exponent.
  regex: /^-?(?:(?:0|[1-9]\d*)(?:\.\d+)?|\.\d+)$/
  match:
  - '0'
  - '5'
  - '50'
  - '.5'
  - '.05'
  - '5.050'
  - '-0.5'
  - -.01
  no_match:
  - '00'
  - '01.5'
  - '5.'
  - '+5'
  - x5.5
  - 5.5x
  - ''
  - unrelated text
  - "\U0001F642"
