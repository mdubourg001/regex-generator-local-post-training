  status: ok
  description: Validate an unsigned integer or decimal number using ASCII digits. An integer part, when present, has at most 16 digits and no leading zeroes except zero itself. It may be ungrouped or grouped by commas with one to three initial digits and exactly three digits in each later group. A decimal point requires 1 through 16 fractional digits; the integer part may be omitted only for a decimal. No signs, spaces or extra characters are allowed.
  regex: /^(?=(?:,?\d){0,16}(?:\.\d{1,16})?$(?!.))(?:(?:0|[1-9]\d*|[1-9]\d{0,2}(?:,\d{3})+)(?:\.\d{1,16})?|\.\d{1,16})$(?!.)/s
