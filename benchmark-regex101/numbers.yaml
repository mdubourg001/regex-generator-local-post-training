  regex: /^-?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:e[+-]?[0-9]+)?|0(?:b(?:[01]+(?:\.[01]*)?|\.[01]+)|o(?:[0-7]+(?:\.[0-7]*)?|\.[0-7]+)|x(?:[0-9a-f]+(?:\.[0-9a-f]*)?|\.[0-9a-f]+))(?:p[+-]?[0-9]+)?)(?![\s\S])$/
