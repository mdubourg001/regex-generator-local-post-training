# Évaluation réelle (regex101, annotée par GPT 6.1 Sol), catégorie dev-tooling. Voir scripts/regex101.py.
- id: real-x00319
  difficulty: medium
  status: ok
  description: Commit header begins with lowercase feat, chore, fix, security or wip and a colon. Allow zero or one ASCII space after the colon, then an issue key of one or more uppercase ASCII letters or digits, a hyphen and one or more digits. Follow the key with exactly one ASCII space and a single-line subject of at least two Unicode code points. Subject characters may include spaces, so a whitespace-only subject is allowed. No line breaks.
  regex: '/^(?:feat|chore|fix|security|wip): ?[A-Z0-9]+-\d+ .{2,}$/u'
  match:
  - 'feat: NSPS2-1277 A valid commit message'
  - chore:NSPS2-1277 A valid commit message
  - 'fix: A-1 ab'
  - 'security: SEC-123 Update dependency'
  - 'wip: X9-000 draft'
  - feat:A-2 Hi
  - 'fix: 1-9 OK'
  - 'chore: ABC-10 a!'
  no_match:
  - 'feat: A-1 a'
  - 'Feat: A-1 ab'
  - 'feat:  A-1 ab'
  - 'feat: a-1 ab'
  - '!feat: A-1 ab'
  - 'feat: A-1 ab

    '
  - ''
  - unrelated text
  - "\U0001F642"
- id: real-x00499
  difficulty: medium
  status: ok
  description: Android-style package identifier consisting of at least two nonempty dot-separated segments. Each segment starts with a lowercase ASCII letter or underscore and continues with lowercase ASCII letters, digits or underscores. No uppercase, whitespace or empty segments. This checks identifier shape, not reserved keywords.
  regex: /^[a-z_][a-z0-9_]*(?:\.[a-z_][a-z0-9_]*)+$/
  match:
  - com.my.app
  - a.b
  - _.a
  - com.app1
  - my.new.hello.world.app
  - abc_123.def_456
  - _x._y
  - a1.b2.c3
  no_match:
  - com
  - com..app
  - 1com.app
  - Com.app
  - '!com.app'
  - com.app!
  - ''
  - unrelated text
  - "\U0001F642"
