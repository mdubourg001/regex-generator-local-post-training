- id: real-x07340
  difficulty: hard
  status: ok
  description: 'Validate the stated cron-entry syntax, optionally commented out. Leading JavaScript whitespace is allowed, then an optional #, then five schedule fields and a nonempty command separated by one or more whitespace characters. Fields are minutes 0 through 59, hours 0 through 23, day-of-month 1 through 31, month 1 through 12 and day-of-week 0 through 6 or lowercase mon, tue, wed, thu, fri, sat, sun. Minutes and hours may be zero-padded; other numeric fields have no leading zeros. Each field is an asterisk or values joined by commas or hyphens, optionally followed by a slash and one or two ASCII step digits. Step magnitude, range ordering and calendar scheduling are not checked. The command contains at least one non-whitespace character and no line terminators; field separators themselves may contain line breaks. No other field syntax is accepted.'
  regex: /^\s*(?:#\s*)?(?:(?:[0-5]?[0-9])(?:[-,](?:[0-5]?[0-9]))*|\*)(?:\/[0-9]{1,2})?\s+(?:(?:[01]?[0-9]|2[0-3])(?:[-,](?:[01]?[0-9]|2[0-3]))*|\*)(?:\/[0-9]{1,2})?\s+(?:(?:[1-9]|[12][0-9]|3[01])(?:[-,](?:[1-9]|[12][0-9]|3[01]))*|\*)(?:\/[0-9]{1,2})?\s+(?:(?:[1-9]|1[0-2])(?:[-,](?:[1-9]|1[0-2]))*|\*)(?:\/[0-9]{1,2})?\s+(?:(?:[0-6]|mon|tue|wed|thu|fri|sat|sun)(?:[-,](?:[0-6]|mon|tue|wed|thu|fri|sat|sun))*|\*)(?:\/[0-9]{1,2})?\s+\S[^\r\n\u2028\u2029]*(?!\s|\S)$/
  match:
  - '* * * * * run'
  - 0 0 1 1 0 cmd
  - 59 23 31 12 sun command
  - ' # */15 01 1-5 2,3 mon-fri run'
  - 1,2 3-4 5 6 tue echo x
  - 00 09 10 11 6 x
  - '*/0 */99 */2 */3 */4 test'
  - "\t# 5\n5\t5 5 fri task"
  no_match:
  - '!* * * * * run'
  - '* * * * * run

    '
  - '* * * * *'
  - 60 * * * * run
  - '* * 0 * * run'
  - '*/123 * * * * run'
  - ''
  - unrelated input
  - "\u2603"
