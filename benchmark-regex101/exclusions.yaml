- id: real-x08114
  difficulty: medium
  status: ok
  description: Validate a single-line string that contains either console.log or alert( at an ASCII word boundary immediately before the first letter, and contains no occurrence of window. anywhere. Matching is case-sensitive. Other characters are unrestricted except line terminators.
  regex: /^(?:(?!.*window\.)(?=.*\b(?:console\.log|alert\()).*)(?!\s|\S)$/
  match:
  - console.log("dddsdsf");
  - alert("dasassd");
  - ' console.log(x)'
  - x = alert(y)
  - '!console.log'
  - console.logger
  - (alert(
  - console.log; alert(
  no_match:
  - '

    alert(x)'
  - 'alert(x)

    '
  - window.alert(x)
  - xconsole.log(x)
  - ALERT(x)
  - nothing
  - ''
  - unrelated input
  - "\u2603"
