- id: real-x00013
  difficulty: medium
  status: ok
  description: 'BTS identifier: 2 to 4 ASCII letters, underscore, exactly 2 digits, underscore, one or more ASCII digits including leading zeros. An optional suffix is an underscore followed by at least one single-line character; spaces and other punctuation are allowed within that suffix. No whitespace outside the suffix and no line breaks anywhere.'
  regex: /^[A-Za-z]{2,4}_\d{2}_\d+(?:_[^\r\n\u2028\u2029]+)?$/
  match:
  - BTS_33_198_D
  - PL_14_015
  - AB_00_0
  - abcd_99_000001
  - XY_01_9_X
  - ABC_12_123_foo bar
  - ab_98_012_1
  - ZZZZ_45_123456789
  no_match:
  - A_12_1
  - ABCDE_12_1
  - AB_1_1
  - AB_12_1_
  - '!AB_12_1'
  - 'AB_12_1 '
  - ''
  - unrelated text
  - "\U0001F642"
