- id: real-x00507
  difficulty: medium
  status: ok
  description: 'Ham-radio callsign shape using uppercase ASCII only: a prefix of one or two letters, a letter and a digit, or a digit and a letter, followed by one or more digits and one or more letters. Also allow the exceptional prefix 3DA. Optionally prepend an alphanumeric location token and a slash, and optionally append a slash and an alphanumeric operating suffix; each token is nonempty. No spaces or further slashes. Check shape only, not assignment or valid DXCC/operating tokens.'
  regex: /^(?:[A-Z0-9]+\/)?(?:3DA|[A-Z]\d|[A-Z]{1,2}|\d[A-Z])\d+[A-Z]+(?:\/[A-Z0-9]+)?$/
