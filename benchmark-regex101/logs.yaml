# Évaluation réelle (regex101, annotée par GPT 6.1 Sol), catégorie logs. Voir scripts/regex101.py.
- id: real-x00695
  difficulty: medium
  status: ok
  description: 'Validate a syslog record structurally: an opening angle bracket, one to three ASCII priority digits and a closing angle bracket; then three ASCII month letters, one space, one or two day digits, one space and a two-digit hour, minute and second separated by colons. Follow with one space, a nonempty whitespace-free hostname, one space and a nonempty message. Reject line terminators throughout. No numeric range or calendar checks are required.'
  regex: /^(?:<[0-9]{1,3}>[A-Za-z]{3} [0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2} [^\s]+ [^\r\n\u2028\u2029]+)(?![\s\S])$/
  match:
  - <1>Jan 1 00:00:00 h m
  - <131>Jan 23 17:05:05 host error
  - <0>Feb 9 01:02:03 a x
  - <999>Abc 99 99:99:99 h any
  - <12>Dec 31 23:59:59 srv msg
  - <10>Mar 10 10:10:10 a two words
  - '<2>Jun 5 12:34:56 h :'
  - <123>Sep 01 01:01:01 a .
  no_match:
  - <1000>Jan 1 00:00:00 h m
  - <1>Ja 1 00:00:00 h m
  - <1>Jan 1 0:00:00 h m
  - '<1>Jan 1 00:00:00 h '
  - x<1>Jan 1 00:00:00 h m
  - '<1>Jan 1 00:00:00 h m

    '
  - ''
  - hello
  - <1>
