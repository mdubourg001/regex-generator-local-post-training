- id: real-x00306
  difficulty: simple
  status: ok
  description: Filename made of one or more ASCII letters, digits or underscores followed by the exact lowercase suffix _lang.js. No directory, whitespace or other characters.
  regex: /^\w+_lang\.js$/
  match:
  - test_lang.js
  - a_lang.js
  - A_lang.js
  - 1_lang.js
  - __lang.js
  - foo_bar_lang.js
  - abc123_lang.js
  - TEST_lang.js
  no_match:
  - _lang.js
  - a_langXjs
  - a_Lang.js
  - a_lang.jsx
  - '!a_lang.js'
  - a_lang.js!
  - ''
  - unrelated text
  - "\U0001F642"
- id: real-x00515
  difficulty: hard
  status: ok
  description: 'Cross-platform filename field using these rules: nonempty, not starting or ending with a dot or whitespace, and containing no ASCII control characters U+0000 through U+001F or U+007F, line separators U+2028/U+2029, or any of < > : double quote / backslash | ? *. Reject the entire names CON, PRN, AUX, NUL, COM followed by one digit 0-9 or superscript 1, 2, 3, and LPT with the same endings, case-insensitively. This reserved-name exclusion applies only to the whole name, not a name with an extension. Other Unicode characters and interior spaces are allowed; no length cap.'
  regex: "/^(?![.\\s])(?!.*[.\\s]$)(?!(?:[Cc][Oo][Nn]|[Pp][Rr][Nn]|[Aa][Uu][Xx]|[Nn][Uu][Ll]|[Cc][Oo][Mm][0-9\xB9\xB2\xB3]|[Ll][Pp][Tt][0-9\xB9\xB2\xB3])$)[^\\x00-\\x1F\\x7F\\u2028\\u2029<>:\\x22/\\\\|?*]+$/u"
  match:
  - report.txt
  - my file
  - "\U0001F4C2\U0001F4C2\u6587\u4EF6\uFF08\u5939\uFF09\u540D\u79F0\u9A8C\u8BC1uD83DuDCC2"
  - "\xE9"
  - CON.txt
  - COM10
  - LPT12
  - a.b
  no_match:
  - .report
  - report.
  - report?
  - con
  - ' report'
  - 'report '
  - ''
  - "COM\xB9"
  - 'a

    b'
