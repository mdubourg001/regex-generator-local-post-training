- id: real-x02085
  difficulty: medium
  status: ok
  description: 'Validate the supplied NFS share syntax: an ASCII host, a colon and an absolute nonempty path. The host begins with a letter or digit and otherwise allows ASCII letters, digits, dots, underscores and hyphens. Path components are nonempty and may contain any character except forward slash, including spaces and line breaks. Empty components and a trailing slash are forbidden. Host existence and filesystem validity are not checked.'
  regex: /^[A-Za-z0-9][A-Za-z0-9._-]*:(?:\/[^/]+)+$(?!.)/s
  match:
  - host:/share
  - server.local:/a/b
  - 192.168.1.1:/home
  - A:/x
  - srv-1:/my folder
  - srv_1:/a.txt
  - 9:/data
  - 'host:/a

    b'
  no_match:
  - -host:/share
  - host:share
  - host:/
  - host:/a/
  - '!host:/share'
  - host:/a//b
  - ''
  - nfs://host/share
  - host :/share
