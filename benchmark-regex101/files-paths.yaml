  description: Validate a restricted Windows folder path. Accept an ASCII drive letter, colon and backslash, optionally followed by nonempty ASCII alphanumeric or underscore folder components separated by single backslashes. Alternatively accept two leading backslashes followed by a nonempty ASCII alphanumeric, underscore or hyphen server name and one or more similarly restricted share or folder components. A final backslash is optional. Also allow an IPv4 server with octets from 0 through 255 without leading zeros, even without a share. No spaces or other characters are allowed.
