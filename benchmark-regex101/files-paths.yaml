  - /a.pdf
  - a.pdf/
  - 'a.pdf

    '
  - ''
  - a
  - a.txt
- id: real-x02386
  difficulty: medium
  status: ok
  description: Validate an absolute directory path beginning and ending with a forward slash, including the root path alone. Between slashes, each component is nonempty and excludes backslash, colon, asterisk, question mark, double quote, angle brackets, vertical bar, carriage return and line feed. Other Unicode characters and spaces are allowed. Consecutive slashes are forbidden.
  regex: /^\/(?:[^\\/:*?"<>\x7c\r\n]+\/)*$(?!.)/s
  match:
  - /
  - /a/
  - /a/b/
  - /ddd/dd%/
  - "/\u0170/"
  - /a b/
  - /=/
  - /a{b/
  no_match:
  - a/
  - /a
  - //
  - /a?/
  - x/a/
  - /a/x
  - ''
  - /a\b/
  - '/a

    b/'
- id: real-x03049
  difficulty: medium
  status: ok
  description: Validate a slash-prefixed path pattern. Accept the root slash alone, or one or more nonempty slash-separated components of ASCII letters and digits. An asterisk may follow the only component of a single-component path, or may occur as the final standalone component after a slash, including immediately after the root. No other asterisks, underscores, empty components or trailing slash are allowed.
  regex: /^(?:\/|\/\*|\/[A-Za-z0-9]+\*?|\/[A-Za-z0-9]+(?:\/[A-Za-z0-9]+)+(?:\/\*)?|\/[A-Za-z0-9]+\/\*)$(?!.)/s
  match:
  - /
  - /*
  - /abc
  - /abc*
  - /abc/*
  - /abc/def
  - /abc/def/xyz
  - /abc/def/*
  no_match:
  - /abc/
  - /abc*/
  - /abc/def*
  - /abc*/def
  - x/abc
  - /abc!
  - ''
  - abc
  - /a_b
- id: real-x04851
