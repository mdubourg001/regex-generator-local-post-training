  description: HTTP website URL with optional http:// or https:// scheme, case-insensitive. Host consists of one or more ASCII alphanumeric-or-hyphen labels of 2 to 63 characters, not starting or ending in a hyphen, followed by a final ASCII letters-only suffix of 2 to 24 characters. Host letters may be either case. Optionally append a slash and any non-whitespace path or query text. No credentials, port, whitespace or query without a slash.
  regex: /^(?:https?:\/\/)?(?:[A-Za-z0-9][A-Za-z0-9-]{0,61}[A-Za-z0-9]\.)+[A-Za-z]{2,24}(?:\/\S*)?$/i
