  status: ok
  description: Validate a password containing 6 to 20 ASCII letters, digits or underscores. Uppercase and lowercase letters are allowed; no mixture of character types is required. Reject all other characters, including whitespace.
  regex: /^(?:[A-Za-z0-9_]{6,20})(?![\s\S])$/
  match:
  - dddddd
  - ABCDEF
  - '123456'
  - ______
  - Ab1_cd
  - user_name1
  - aaaaaaaaaaaaaaaaaaa
  - ZZZZZZZZZZZZZZZZZZZZ
  no_match:
  - abcde
  - aaaaaaaaaaaaaaaaaaaaa
  - abc-de
  - abc de
  - '!abcdef'
  - abcdef!
  - ''
  - "\xE9\xE9\xE9\xE9\xE9\xE9"
  - 'abcdef

    '
