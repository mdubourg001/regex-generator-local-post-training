- id: real-x00523
  difficulty: hard
  status: ok
  description: Password of at least eight characters, containing at least one ASCII lowercase letter, three ASCII uppercase letters, one digit and one character from *#$%&!. Only ASCII letters, digits and those six special characters are allowed; there is no maximum length.
  regex: /^(?=.*[a-z])(?=(?:[^A-Z]*[A-Z]){3})(?=.*\d)(?=.*[*#$%&!])[A-Za-z0-9*#$%&!]{8,}$/
  match:
  - ABCabc1!
  - abcABC1*
  - AbCdE12#
  - ABCd000$
  - ZXYa123%
  - aQWE567&
  - AaBCD123!
  - ABCabcdefgh123456789!
  no_match:
  - ABCab1!
  - ABabcd1!
  - ABCDEF1!
  - ABCabc1!?
  - ' ABCabc1!'
  - 'ABCabc1! '
  - ''
  - unrelated text
  - "\U0001F642"
- id: real-x00673
