# Évaluation réelle (regex101, annotée par GPT 6.1 Sol), catégorie postal-official. Voir scripts/regex101.py.
- id: real-x00100
  difficulty: medium
  status: ok
  description: 'Dutch postal code: four digits with the first from 1 to 9, optionally one ASCII space, then two lowercase ASCII letters. The letter pairs sa, sd and ss are disallowed. Do not accept uppercase or extra spaces. Check format only.'
  regex: /^[1-9]\d{3} ?(?!sa$|sd$|ss$)[a-z]{2}$/
  match:
  - 1234 ab
  - 1000aa
  - 9999 zz
  - 2345sb
  - 3456 sc
  - 4567se
  - 5678st
  - 6789 xy
  no_match:
  - 12345 ab
  - 1234 sa
  - 1234 sd
  - 1234 ss
  - '!1234 ab'
  - 1234 ab!
  - 1234 a!
  - ''
  - "\U0001F642"
- id: real-x00428
  difficulty: hard
  status: ok
  description: 'UK postcode format in either letter case, optionally one ASCII space between outward and inward parts. Special case GIR 0AA is allowed. Otherwise the outward part starts with a letter except Q, V or X, optionally a second letter except I, J or Z, then one or two digits. A one-digit outward part may instead end with a letter: A-H, J, K, P, S, T, U or W for a one-letter area; A, B, E, H, M, N, P, R, V, W, X or Y for a two-letter area. Inward part is a digit and two letters excluding C, I, K, M, O and V. Check shape only, not assignment.'
  regex: /^(?:GIR ?0AA|[A-PR-UWYZ](?:\d{1,2}|[A-HK-Y]\d[0-9ABEHMNPRV-Y]?|\d[A-HJKPS-UW]) ?\d[ABD-HJLNP-UW-Z]{2})$/i
