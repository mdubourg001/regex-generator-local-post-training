- id: real-x01411
  difficulty: medium
  status: ok
  description: 'Validate a SQL Server date-time shape: three ASCII word characters, one or two ASCII spaces, a one- or two-digit day, one space, a four-digit year, one space, two-digit hour, colon, two-digit minute, colon, two-digit second, colon, three-digit milliseconds and uppercase AM or PM. Word characters are ASCII letters, digits and underscore. No calendar or numeric range checks apply, and no other text is allowed.'
  regex: /^(?:[A-Za-z0-9_]{3} {1,2}[0-9]{1,2} [0-9]{4} (?:[0-9]{2}:){3}[0-9]{3}(?:AM|PM))(?![\s\S])$/
