- id: real-x02445
  difficulty: hard
  status: ok
  description: Validate a PHP-style duration specification beginning with uppercase P. Date components, if present, are nonnegative ASCII integer counts followed by Y, then M, then either D or W; each component is optional and each may appear once. An optional uppercase T introduces time components in H, M, S order with at least one time component. At least one component overall is required. Leading zeroes are allowed; signs, fractions, spaces and repeated units are forbidden.
  regex: /^P(?=\d|T)(?:\d+Y)?(?:\d+M)?(?:\d+[DW])?(?:T(?=\d)(?:\d+H)?(?:\d+M)?(?:\d+S)?)?$(?!.)/s
  match:
  - P0Y
  - P1M
  - P2D
  - P2W
  - PT3H
  - PT4M5S
  - P0Y1M2DT3H4M5S
  - P01YT0S
  no_match:
  - P
  - PT
  - P1D1Y
  - P1Y1Y
  - xP1Y
  - P1Yx
  - ''
  - 1Y
  - P1.5Y
