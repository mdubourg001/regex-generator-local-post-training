# Évaluation réelle (regex101, annotée par GPT 6.1 Sol), catégorie dates-times. Voir scripts/regex101.py.
- id: real-x00174
  difficulty: medium
  status: ok
  description: Date-time field in YYYY-M-D H:m:s order. Year has exactly four digits; month 1 to 12 and day 1 to 31 may have a leading zero. Hours range from 0 to 23 and minutes and seconds from 0 to 59, each written with one or two digits. Exactly one ASCII space separates date and time. Do not check month lengths or leap years.
  regex: /^\d{4}-(?:0?[1-9]|1[0-2])-(?:0?[1-9]|[12]\d|3[01]) (?:[01]?\d|2[0-3]):[0-5]?\d:[0-5]?\d$/
  match:
  - '2018-08-01 23:58:32'
  - 0000-1-1 0:0:0
  - '9999-12-31 23:59:59'
  - '2023-2-31 00:00:00'
  - 2000-10-9 9:5:2
  - '2026-01-31 01:01:01'
  - '1111-9-10 19:19:19'
  - '2222-11-30 20:40:50'
  no_match:
  - 20180-08-01 23:58:32
  - '2018-13-01 23:58:32'
  - '2018-08-01 24:58:32'
  - '2018-08-01 23:60:32'
  - x2018-08-01 23:58:32
  - 2018-08-01 23:58:32x
  - ''
  - unrelated text
  - "\U0001F642"
- id: real-x00776
  difficulty: medium
  status: ok
  description: 'Validate this permissive ISO-duration shape using uppercase unit letters: P, then optional nonnegative ASCII integer year, month, week and day quantities in that order, followed optionally by T and optional integer hour, minute and second quantities in that order. Leading zeroes are allowed. The bare P and PT forms are explicitly accepted, as are empty time sections. No fractional quantities, signs or whitespace are allowed.'
  regex: /^(?:P(?:[0-9]+Y)?(?:[0-9]+M)?(?:[0-9]+W)?(?:[0-9]+D)?(?:T(?:[0-9]+H)?(?:[0-9]+M)?(?:[0-9]+S)?)?)(?![\s\S])$/
  match:
  - P
  - PT
  - P1Y
  - P2M3W4D
  - PT1H2M3S
  - P1Y2M3W4DT5H6M7S
  - P01DT
  - PT0S
  no_match:
  - p1D
  - P1.5D
  - P1D2M
  - P1H
  - ' P1D'
  - 'P1D '
  - ''
  - duration
  - 'P1D

    '
