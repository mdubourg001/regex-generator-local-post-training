  - '123'
  - '#'
- id: real-x06866
  difficulty: simple
  status: ok
  description: Validate a nonempty string containing only ASCII letters, ASCII digits, characters in the Unicode Arabic block from U+0600 through U+06FF, commas, hyphens, and whitespace. Arabic-block punctuation and digits are accepted as well as letters. No characters outside these sets are allowed.
  regex: /^[A-Za-z0-9\u0600-\u06FF,\s-]+(?![\s\S])$/
  match:
  - English
  - "\u0639\u0631\u0628\u064A"
  - "2 \u0648\u0643\u0630\u0644\u0643 \u0662"
  - "RegExp that accept English and \u0639\u0631\u0628\u064A"
  - a,b-c
  - "\u060C"
  - '

    '
  - ' '
  no_match:
  - ''
  - abc!
  - abc_
  - "\xE9"
  - "\u6F22"
  - "\U0001F642"
  - '!abc'
  - abc!x
  - "\U0001F642abc"
- id: real-x07215
  difficulty: medium
  status: ok
  description: Validate one or more words containing only Unicode Latin-script letters. Words are separated by one or more JavaScript whitespace characters, including tabs or line breaks. Leading or trailing whitespace, punctuation, digits and combining marks are forbidden.
  regex: /^(?:(?:(?=\p{L})\p{Script=Latin})+(?:\s+(?:(?=\p{L})\p{Script=Latin})+)*)(?!\s|\S)$/u
