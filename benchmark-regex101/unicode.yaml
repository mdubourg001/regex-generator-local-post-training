- id: real-x02315
  difficulty: medium
  status: ok
  description: Validate a name of 2 through 66 Unicode code points containing only ASCII English letters, Unicode letters from the Arabic script and ASCII spaces. At least one letter is required. Letter case is unrestricted. Digits, punctuation, tabs, line breaks and separate combining marks are forbidden; spaces may occur at any position.
  regex: /^(?=.{2,66}$(?!.))(?=.*(?:[A-Za-z]|(?=\p{Script=Arabic})\p{L}))(?:[A-Za-z ]|(?=\p{Script=Arabic})\p{L})+$(?!.)/su
  match:
  - "\u0645\u062D\u0645\u0648\u062F \u0639\u0644\u064A \u0642\u0627\u0633\u0645"
  - Ali
  - "\u0645\u062D\u0645\u062F"
  - ALI
  - "Ali \u0645\u062D\u0645\u062F"
  - ' A '
  - "\u0639\u0628\u062F \u0627\u0644\u0644\u0647"
  - "\u0639\u0644\u064A"
  no_match:
  - Ali1
  - A
  - "Ali\t"
  - 'Ali

    '
  - '!Ali'
  - Ali!
  - ''
  - '   '
  - "\u6771\u4EAC"
- id: real-x03431
  difficulty: medium
  status: ok
  description: Validate a nonempty street name using ASCII letters or Latin letters from Unicode U+00C0 through U+017E, excluding the multiplication and division signs. Separate nonempty letter runs by one hyphen, one ASCII space, or a period immediately followed by one ASCII space. No leading or trailing separator, digits, or other characters are allowed.
  regex: /^[A-Za-z\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u017E]+(?:(?:\. |-| )[A-Za-z\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u017E]+)*$/u
  match:
