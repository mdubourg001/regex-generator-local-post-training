- id: real-x00016
  difficulty: hard
  status: ok
  description: Full name with at least two words separated by exactly one ASCII space. Each word starts with a Unicode uppercase letter and contains only Unicode lowercase letters thereafter; a one-letter word is permitted. No leading or trailing spaces, digits, punctuation or combining marks.
  regex: '/^\p{Lu}\p{Ll}*(?: \p{Lu}\p{Ll}*)+$/u'
  match:
  - John Smith
  - A B
  - Vinh Nguyen
  - "\xC9mile Zola"
  - "\u0418\u0432\u0430\u043D \u041F\u0435\u0442\u0440\u043E\u0432"
  - "\u0391\u03BD\u03BD\u03B1 \u039C\u03B1\u03C1\u03AF\u03B1"
  - A Smith Jones
  - "\xD6zil M\xFCller"
  no_match:
  - John
  - john Smith
  - JOhn Smith
  - John  Smith
  - ' John Smith'
  - 'John Smith '
  - ''
  - unrelated text
  - "\U0001F642"
