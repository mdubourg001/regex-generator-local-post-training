  - "Gener\xE1la Jaro\u0161e"
  - "Jaro\u0161e"
  - A-B
  - Rue A
  - "\xC9cole"
  - "\u010Cesk\xE1-L\xEDpa"
  - A. B. C
  no_match:
  - "1Jaro\u0161e"
  - "Jaro\u0161e1"
  - "Jaro\u0161e "
  - A  B
  - A.B
  - "Jaro\u0161e\n"
