- id: real-x00617
  difficulty: hard
  status: ok
  description: Validate a French phone-number representation. Begin with national prefix 0 or international +33 or 0033. After an international prefix allow zero to three separators and optionally (0) followed by zero to three separators. After the complete prefix allow at most one separator, then a national first digit from 1 through 9 and exactly eight more ASCII digits. Those eight digits may be individually separated by at most one separator each, or appear as two immediate digits followed by two groups of three digits each preceded by at most one separator. Each separator independently is JavaScript whitespace, period or hyphen. No leading or trailing text is allowed.
  regex: /^(?:(?:(?:\+|00)33[\s.-]{0,3}(?:\(0\)[\s.-]{0,3})?|0)[\s.-]?[1-9](?:[\s.-]?[0-9]){8})(?![\s\S])$/
  match:
  - 0123456789
  - 01 23 45 67 89
  - 01.23.45.67.89
  - 0123 45.67.89
  - 0033 123-456-789
  - 0033(0)123456789
  - +33-1.23.45.67.89
  - +33.-.(0)-.-123456789
  no_match:
  - 012345678
  - 01234567890
  - 0023456789
  - 01  23 45 67 89
  - x0123456789
  - '0123456789 '
  - ''
  - 01 23 a5 67 89
  - '0123456789

    '
