  status: ok
  description: 'Indian international telephone format without a plus sign: 91, optionally prefixed by 0 or 00, then ten digits beginning with 1 to 9. Do not validate assignment or mobile prefixes. No separators.'
  regex: /^(?:00|0)?91[1-9]\d{9}$/
