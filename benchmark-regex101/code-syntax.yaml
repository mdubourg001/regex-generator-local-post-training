- id: real-x00933
  difficulty: medium
  status: ok
  description: 'Validate a CSS nth-child arithmetic expression without whitespace: either an optional plus or minus sign and an ASCII integer, or an optional sign, optional ASCII integer coefficient, lowercase n, and an optional offset consisting of plus or minus and a nonempty ASCII integer. Leading zeroes are allowed. Keywords and uppercase N are not accepted.'
  regex: /^(?:(?:[+-]?[0-9]+|[+-]?[0-9]*n(?:[+-][0-9]+)?))(?![\s\S])$/
