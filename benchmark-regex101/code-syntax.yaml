- id: real-x00067
  difficulty: hard
  status: ok
  description: 'Discord eval command: lowercase eval followed by one or more ASCII spaces, then code enclosed in matching delimiters of one backtick or three backticks. Immediately after the opening delimiter an optional lowercase js marker is allowed. The code body may be empty and may contain any characters, including newlines and backticks. No text outside the command or its closing delimiter.'
  regex: /^eval +(```|`)(?:js)?.*\1$/s
  match:
  - eval `1+2`
  - eval ```jsreturn 1;```
  - eval `jsa`
  - 'eval ```a

    b```'
  - eval ``
  - eval ``````
  - eval  `x`
  - eval `a`b`
  no_match:
  - Eval `1`
  - "eval\t`1`"
  - eval`1`
  - eval '1'
  - '!eval `1`'
  - eval `1`!
