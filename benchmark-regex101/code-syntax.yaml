- id: real-x00449
  difficulty: medium
  status: ok
  description: 'Die-roll expression: optional count digits, lowercase d or uppercase D, and one or more ASCII digits for the die size. Optionally append a plus or minus sign and one or more modifier digits. Alternatively accept a standalone integer with an optional leading plus or minus. Leading zeros and zero counts or sizes are allowed. No whitespace, missing numeric operands or other characters.'
  regex: /^(?:\d*[dD]\d+(?:[+-]\d+)?|[+-]?\d+)$/
  match:
  - d2
  - d2+1
  - d2-3
  - 4D2
  - 4d2+1
  - 4d2-3
  - '10'
  - '+1'
  no_match:
  - d
  - d2+
  - 4d
  - 4dd2
  - '!4d2'
  - 4d2!
  - ''
  - d2 +1
  - 4d2+1-2
- id: real-x00702
  difficulty: medium
  status: ok
  description: Validate an uppercase constant identifier of at least two characters. Use only uppercase ASCII letters and underscores. Begin and end with a letter, and never use two consecutive underscores. An underscore is not required.
  regex: /^(?:(?![A-Z_]*__)[A-Z][A-Z_]*[A-Z])(?![\s\S])$/
  match:
  - AB
  - ABC_DEF
  - A_B
  - HELLO
  - A_B_C
  - LONG_CONSTANT_NAME
  - XY_Z
  - ABCDEF
  no_match:
  - A
  - _AB
  - AB_
  - A__B
  - ' Ab'
  - 'AB '
  - ''
  - abc
  - 'AB

    '
