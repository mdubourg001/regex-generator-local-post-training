# Évaluation réelle (regex101, annotée par GPT 6.1 Sol), catégorie network. Voir scripts/regex101.py.
- id: real-x00126
  difficulty: hard
  status: ok
  description: IPv4 host address in either 192.168.100.0/22 or 192.168.200.0/22, excluding only each subnet network and broadcast address. Third octet is 100 through 103 or 200 through 203. Fourth octet is 0 through 255, but exclude the four boundary addresses ending in 100.0, 103.255, 200.0 or 203.255. Use canonical decimal octets without leading zeros.
  regex: /^(?!192\.168\.(?:100|200)\.0$)(?!192\.168\.(?:103|203)\.255$)192\.168\.(?:10[0-3]|20[0-3])\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)$/
  match:
  - 192.168.100.1
  - 192.168.103.254
  - 192.168.200.1
  - 192.168.203.254
  - 192.168.101.0
  - 192.168.102.255
  - 192.168.201.0
  - 192.168.202.255
  no_match:
  - 192.168.100.0
  - 192.168.103.255
  - 192.168.200.0
  - 192.168.101.256
  - x192.168.101.1
  - 192.168.101.1x
  - 192.168.203.255
  - 192.168.101.1000
  - ''
- id: real-x00331
  difficulty: hard
  status: ok
  description: Private or loopback IPv4 CIDR with canonical decimal octets from 0 to 255. Accept addresses beginning with 10 or 127 with prefix length 8 to 31, beginning with 172.16 through 172.31 with prefix length 12 to 31, or beginning with 192.168 with prefix length 16 to 31. The slash and prefix are mandatory. Reject /32, broader networks, leading zeros and whitespace. Ignore host bits; the address need not be the network address.
  regex: /^(?:(?:10|127)(?:\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)){3}\/(?:[89]|[12]\d|3[01])|172\.(?:1[6-9]|2\d|3[01])(?:\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)){2}\/(?:1[2-9]|2\d|3[01])|192\.168(?:\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)){2}\/(?:1[6-9]|2\d|3[01]))$/
  match:
  - 10.0.0.0/8
  - 127.255.255.255/31
  - 172.16.0.0/12
  - 172.31.255.255/31
  - 192.168.0.0/16
  - 192.168.255.255/31
  - 192.168.1.2/16
  - 10.9.8.7/24
  no_match:
  - 10.0.0.0/7
  - 172.15.0.0/12
  - 192.168.0.0/15
  - 10.0.0.0/32
  - x10.0.0.0/8
  - 10.0.0.0/8x
  - 10.1000.0.0/8
  - 10.a.0.0/8
  - ''
- id: real-x00359
  difficulty: medium
  status: ok
  description: Integer from 0 through 255, written in decimal without leading zeros except that the special zero spelling 000 is also allowed. No other zero padding, signs, punctuation or whitespace.
  regex: /^(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d|000)$/
  match:
  - '0'
  - '000'
  - '9'
  - '10'
  - '99'
  - '100'
  - '249'
  - '255'
  no_match:
  - '256'
  - '00'
  - '0000'
  - '-1'
  - x123
  - 123x
  - '1000'
  - ''
  - "\U0001F642"
