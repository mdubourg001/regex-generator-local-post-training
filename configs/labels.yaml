# Référentiel des labels : pour chaque projet, les labels que le modèle doit savoir poser, et leur définition.
# C'est la liste « autorisée » donnée dans le prompt. Un label absent d'ici est retiré des cibles :
#   - labels de version (`37`, `32.1`…) et de process (`pending*`, `Waiting 4 Back`) : ne se déduisent pas du contenu ;
#   - labels trop rares (< 20 MR retenues) : `feature-removal`, `accessibility`, `infra`, `improvement`, `docs`…
# GitLab ne fournit presque aucune description : celles-ci sont écrites à la main. Les définitions marquées
# « à valider » sont déduites des MR, pas confirmées par l'équipe.

projects:
  iperia__iperia-front:
    alias: projet-a # seul nom utilisé dans ce qui sort du repo
    since: "2023-01-01" # avant, moins de 12 % des MR sont labellisées
    labels:
      feature: Nouvelle fonctionnalité métier.
      featurefix: Correction d'une fonctionnalité encore en cours de développement, pas encore livrée en production.
      bugfix: Correction d'un bug présent en production.
      hotfix: Correctif urgent livré en production hors du cycle de release.
      refactor: Restructuration du code sans changement de comportement.
      technical task: Tâche purement technique qui ne nécessite pas de recette métier (configuration, tooling, performances…).
      chore: Maintenance de base (suppression de code mort, mise à jour de documentation obsolète…).
      test: Ajout ou modification de tests.
      styles: Modification des styles ou de l'apparence visuelle (CSS, thème).
      NOJIRA: MR sans ticket JIRA associé. # à valider

  rgds__rgds-website-factory:
    alias: projet-b
    since: "2020-01-01"
    labels:
      feature: Nouvelle fonctionnalité.
      fix: Correction de bug.
      hotfix: Correctif urgent livré en production hors du cycle de release.
      release: Merge d'une branche de release vers master ou develop (release flow).
      refactor: Restructuration du code sans changement de comportement.
      chore: Maintenance de base (suppression de code mort, mise à jour de documentation obsolète…).
      dependencies: Mise à jour d'une ou plusieurs dépendances.
      php: Concerne le code ou les dépendances PHP (Drupal, Composer).
      javascript: Concerne le code ou les dépendances JavaScript (npm).
      security: Correctif de sécurité, y compris la mise à jour d'une dépendance vulnérable.
      ci: Modification de la CI (pipelines GitLab).
      build: Modification du build ou de l'outillage de compilation.
      test: Ajout ou modification de tests.
