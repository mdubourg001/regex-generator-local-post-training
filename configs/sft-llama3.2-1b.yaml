# SFT de Llama 3.2 1B Instruct (miroir non gated d'unsloth, mêmes poids que meta-llama/Llama-3.2-1B-Instruct ;
# 16 couches, vocabulaire de 128k, embeddings partagés) :
#   uv run scripts/train_capped.py --sft --memory-gb 6 --config configs/sft-llama3.2-1b.yaml
# Même recette que configs/sft-qwen3.5-0.8b.yaml (données, LoRA, LR, schedule, micro-batchs) : seul le modèle change.
# Base few-shot : 5,5 % de succès sur regex101 (Qwen3.5-0.8B : 2,75 %, MiniCPM5-1B : 8,0 %).

model: unsloth/Llama-3.2-1B-Instruct
train: true
data: data/sft-plus2
adapter_path: adapters/sft-llama3.2-1b
seed: 0

fine_tune_type: lora
num_layers: -1                 # toutes les couches
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
  keys:                        # Llama standard : attention et MLP sur les 16 couches
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj

# Loss sur la réponse seulement : on n'apprend pas au modèle à réécrire le prompt.
mask_prompt: true
max_seq_length: 512            # validate.py écarte les ~20 exemples plus longs

# Mémoire : mlx_lm autorise le GPU à verrouiller jusqu'à 19 Go sur les 24 Go du Mac. Avec un batch de 8, le pic a
# atteint 18,3 Go (surtout les logits : batch × longueur × 151k tokens de vocabulaire) et macOS a redémarré. D'où des
# micro-batchs de 4 avec accumulation de gradient sur 2 (batch effectif de 8 inchangé) et le gradient checkpointing
# (activations recalculées au backward, ~30 % plus lent).
# Qwen3.5 : micro-batchs de 2 avec accumulation sur 4 (batch effectif de 8 inchangé), pour tenir sous le plafond
# mémoire avec son vocabulaire de 248k tokens. Le schedule compte en mises à jour : il ne change pas, iters double.
batch_size: 2
grad_accumulation_steps: 4
grad_checkpoint: true
# 9 418 exemples : 4 709 micro-batchs par epoch, donc 2 epochs. Le schedule de LR avance à chaque mise à jour des
# poids, soit tous les 4 micro-batchs : 2 355 mises à jour, comme dans sft-plus2.
iters: 9420
optimizer: adamw
learning_rate: 2.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 100
  warmup_init: 1.0e-6
  arguments: [2.0e-4, 2355, 1.0e-6]

steps_per_report: 40
steps_per_eval: 800
val_batches: -1                # tout le valid (504 exemples)
save_every: 800
