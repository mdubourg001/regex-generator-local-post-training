# Benchmark, catégorie versions. Format et contrôles : scripts/benchmark.py.

- id: versions-01
  difficulty: simple
  status: ok
  description: >-
    Plain semantic version, core part only: MAJOR.MINOR.PATCH where each part is a non-negative integer without
    leading zeros. No prefix and no suffix of any kind.
  regex: '/^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/'
  match: ['0.0.0', '1.2.3', '10.20.30', '0.1.0', '999.0.12', '2.0.0']
  no_match: ['1.2', '1.2.3.4', '01.2.3', '1.02.3', 'v1.2.3', '1.2.3 ', '1.2.x']
  pitfall: Using \d+ everywhere and accepting leading zeros such as 01.2.3.

- id: versions-02
  difficulty: simple
  status: ok
  description: >-
    our release tags look like a lowercase v, then major.minor, optionally .patch, each part being one or more digits
  regex: '/^v\d+\.\d+(?:\.\d+)?$/'
  match: ['v1.0', 'v1.2.3', 'v10.0.1', 'v0.0', 'v2024.1', 'v3.14.159']
  no_match: ['1.2.3', 'V1.2.3', 'v1', 'v1.2.3.4', 'v1.2.', 'v1.2 ', 'v1.a']
  pitfall: Making the minor part optional too, or accepting an uppercase V.

- id: versions-03
  difficulty: hard
  status: ok
  description: >-
    A semantic version: MAJOR.MINOR.PATCH with non-negative integers without leading zeros, then an optional
    pre-release part (a hyphen followed by one or more dot-separated identifiers), then optional build metadata (a plus
    sign followed by one or more dot-separated identifiers). Identifiers are non-empty and made only of ASCII letters,
    digits and hyphens.
  regex: '/^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/'
  match: ['1.0.0-alpha', '1.0.0-alpha.1', '1.0.0+20130313144700', '1.0.0-beta+exp.sha.5114f85', '2.1.3', '1.0.0-x-y-z.--']
  no_match: ['1.0.0-', '1.0.0+', '1.0.0-alpha..1', '1.0.0+build_1', '01.0.0', '1.0.0-alpha$', '1.0.0 -alpha']
  pitfall: Allowing empty identifiers (1.0.0- or alpha..1) or characters such as underscores.

- id: versions-04
  difficulty: medium
  status: ok
  description: >-
    Calendar versioning for our app: YYYY.MM.DD where the year is from 2000 to 2099, the month from 01 to 12 and the
    day from 01 to 31 (always two digits for month and day), optionally followed by a dot and a build counter, which is
    a non-negative integer without leading zeros. Calendar validity such as February 30 is not checked.
  regex: '/^20\d{2}\.(?:0[1-9]|1[0-2])\.(?:0[1-9]|[12]\d|3[01])(?:\.(?:0|[1-9]\d*))?$/'
  match: ['2024.01.15', '2099.12.31', '2000.06.01', '2024.03.07.1', '2024.03.07.0', '2023.10.31.12']
  no_match: ['1999.01.01', '2024.13.01', '2024.1.15', '2024.01.32', '2024.01.15.01', '2024-01-15', '2024.00.10', '20245.01.01']
  pitfall: Accepting single-digit months or a build counter with a leading zero.

- id: versions-05
  difficulty: medium
  status: ok
  description: >-
    Validate a line of requirements.txt in our simplified format: a package name made of ASCII letters, digits, dots,
    hyphens and underscores, starting and ending with a letter or digit, optionally followed by one version constraint.
    A constraint is one of the operators ==, >=, <=, ~=, != , > or <, then a version made of dot-separated integers.
    At most one space is allowed on each side of the operator.
  regex: '/^[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?(?: ?(?:==|>=|<=|~=|!=|>|<) ?\d+(?:\.\d+)*)?$/'
  match: ['requests', 'requests==2.31.0', 'Django >= 4.2', 'numpy<2', 'typing_extensions~=4.7', 'zope.interface != 6.0']
  no_match: ['-requests', 'requests-', 'requests=2.0', 'requests==', 'requests ==  2.0', 'requests>=2.0.', 'requests===1.0']
  pitfall: Accepting a single = as an operator or a version with a trailing dot.

- id: versions-06
  difficulty: hard
  status: ok
  description: >-
    An npm dependency version allowed by our package.json lint rule: an exact version MAJOR.MINOR.PATCH, the same
    prefixed with a caret or a tilde, or a wildcard range where the trailing parts are replaced by a lowercase x (like
    major.x or major.minor.x, without caret or tilde). Numbers have no leading zeros. Nothing else is allowed.
  regex: '/^(?:[\^~]?(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)|(?:0|[1-9]\d*)\.(?:(?:0|[1-9]\d*)\.)?x)$/'
  match: ['1.2.3', '^1.2.3', '~0.4.0', '1.x', '1.2.x', '^10.0.1']
  no_match: ['^1.x', '1.2', '1.X', '>=1.2.3', '^01.2.3', '1.x.x', '~1.2.3 ', '*', '=1.2.3', 'a.2.3']
  pitfall: Allowing the caret on wildcard ranges or the x in non-trailing positions.

- id: versions-07
  difficulty: hard
  status: ok
  description: >-
    A changelog line describing an upgrade within the same major version: a version MAJOR.MINOR.PATCH, a space, an
    arrow made of a hyphen and a greater-than sign, a space, then another MAJOR.MINOR.PATCH version whose MAJOR number
    is identical to the first one. Numbers have no leading zeros. Whether the second version is actually higher is not
    checked.
  regex: '/^(?<major>0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*) -> \k<major>\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/'
  match: ['1.2.3 -> 1.3.0', '0.9.1 -> 0.10.0', '12.0.0 -> 12.0.1', '2.5.9 -> 2.5.10', '10.1.1 -> 10.2.0', '3.0.0 -> 3.14.15']
  no_match: ['1.2.3 -> 2.0.0', '1.2.3 -> 11.0.0', '11.0.0 -> 1.0.0', '1.2.3->1.3.0', '1.2.3 => 1.3.0', '1.2.3 -> 1.3', '01.2.3 -> 01.3.0']
  pitfall: Comparing the major numbers requires a backreference, and 1 must not match the start of 11.

- id: versions-08
  difficulty: simple
  status: ok
  description: >-
    API version segment in our URLs: a lowercase v followed by an integer from 1 to 99, without leading zero.
  regex: '/^v[1-9]\d?$/'
  match: ['v1', 'v2', 'v9', 'v10', 'v42', 'v99']
  no_match: ['v0', 'v100', 'V2', 'v01', 'v2 ', '2', 'v2.1', 'v']
  pitfall: Accepting v0 or v100.

- id: versions-09
  difficulty: medium
  status: ok
  description: >-
    The Python versions our tool supports, as written in a config file: 3.8 through 3.13, written MAJOR.MINOR,
    optionally followed by a dot and a patch number without leading zeros.
  regex: '/^3\.(?:[89]|1[0-3])(?:\.(?:0|[1-9]\d*))?$/'
  match: ['3.8', '3.9', '3.10', '3.13', '3.11.4', '3.12.0']
  no_match: ['3.7', '3.14', '2.7', '3.08', '3.10.', '3', '3.9.01', 'v3.10']
  pitfall: Writing 3\.\d+ and accepting 3.7 or 3.14, or 3.1[0-9].

- id: versions-10
  difficulty: medium
  status: ok
  description: >-
    Versions allowed for production deploys: MAJOR.MINOR.PATCH without leading zeros, where MAJOR is at least 1, with
    an optional release-candidate suffix written as -rc. followed by a positive integer without leading zeros. No other
    pre-release suffix is allowed.
  regex: '/^[1-9]\d*\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-rc\.[1-9]\d*)?$/'
  match: ['1.0.0', '2.3.4', '10.0.0-rc.1', '1.2.3-rc.12', '3.0.10', '1.0.0-rc.9']
  no_match: ['0.9.0', '0.1.0-rc.1', '1.0.0-rc.0', '1.0.0-beta.1', '1.0.0-rc1', '1.0.0-RC.1', '01.0.0', '1.0.0-rc.']
  pitfall: Accepting 0.x versions or rc.0.
