# Benchmark, catégorie logs. Format et contrôles : scripts/benchmark.py.

- id: logs-01
  difficulty: simple
  status: ok
  description: >-
    log filter: keep lines that contain the word ERROR in uppercase, as a whole word anywhere in the line
  regex: '/\bERROR\b/'
  match: ['ERROR disk full', '2024-01-01 ERROR db down', '[ERROR] timeout', 'level=ERROR msg=x', 'x ERROR', 'ERROR']
  no_match: ['error disk full', 'ERRORS found', 'NOERROR', 'Error: x', 'ERROR_CODE=5', 'INFO ok']
  pitfall: Without word boundaries, ERRORS and ERROR_CODE match too.

- id: logs-02
  difficulty: simple
  status: ok
  description: >-
    Lines from our job runner start with a run tag: a hash sign, exactly six digits, a colon and a single space, then a
    message of at least one character.
  regex: '/^#\d{6}: .+$/'
  match: ['#000123: started', '#999999: done', '#123456: x', '#654321: a: b', '#000000: ok', '#100200: retry 3']
  no_match: ['#12345: x', '#1234567: x', '000123: x', '#000123 x', '#000123:x', '#000123: ', ' #000123: x', '#abc123: x']
  pitfall: Forgetting the exact digit count, or accepting an empty message.

- id: logs-03
  difficulty: medium
  status: ok
  description: >-
    Lines that contain a server error status: a three-digit number from 500 to 599 standing on its own, that is not
    preceded or followed by a letter, digit or underscore.
  regex: '/\b5\d{2}\b/'
  match: ['GET /api 500 12ms', 'status=503', 'upstream returned 599', '502 Bad Gateway', 'code:504;', 'x 500']
  no_match: ['GET /api 200 12ms', 'status=5000', 'id=1500', 'took 50ms', 'v500a', 'status=600', 'status=_500']
  pitfall: Matching 500 inside longer numbers such as 1500 or 5000.

- id: logs-04
  difficulty: hard
  status: ok
  description: >-
    An access log line in this exact format: an IPv4-looking address (four groups of one to three digits separated by
    dots, values not checked), a space, a hyphen, a space, the user (a hyphen, or ASCII letters, digits, underscores,
    dots and hyphens), a space, a timestamp in square brackets written as two-digit day, slash, three-letter month
    capitalized like Oct, slash, four-digit year, colon, hours, minutes and seconds in two digits separated by colons,
    a space and a timezone offset made of a plus or minus sign and four digits. Then a space and the request in double
    quotes: an uppercase method among GET, POST, PUT, PATCH, DELETE, HEAD and OPTIONS, a space, a target without
    spaces, a space and HTTP/1.0, HTTP/1.1, HTTP/2 or HTTP/2.0. Then a space, a three-digit status and a space followed
    by the response size in digits.
  regex: '/^\d{1,3}(?:\.\d{1,3}){3} - (?:-|[\w.-]+) \[\d{2}\/[A-Z][a-z]{2}\/\d{4}:\d{2}:\d{2}:\d{2} [+-]\d{4}\] "(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS) \S+ HTTP\/(?:1\.[01]|2(?:\.0)?)" \d{3} \d+$/'
  match:
    - '127.0.0.1 - - [10/Oct/2023:13:55:36 +0000] "GET /index.html HTTP/1.1" 200 2326'
    - '10.0.0.5 - alice [01/Jan/2024:00:00:00 -0500] "POST /api/login HTTP/2" 401 52'
    - '192.168.1.10 - - [31/Dec/2023:23:59:59 +0100] "DELETE /items/42 HTTP/1.0" 204 0'
    - '8.8.8.8 - bob.smith [05/Mar/2024:08:15:00 +0200] "PATCH /u/1?x=y HTTP/2.0" 200 17'
    - '1.2.3.4 - - [07/Jul/2024:07:07:07 +0000] "HEAD / HTTP/1.1" 304 0'
    - '255.255.255.255 - svc-bot [12/Feb/2024:12:00:00 -0800] "OPTIONS * HTTP/1.1" 200 0'
  no_match:
    - '127.0.0.1 - - [10/Oct/2023:13:55:36 +0000] "FETCH /index.html HTTP/1.1" 200 2326'
    - '127.0.0.1 - - [10/oct/2023:13:55:36 +0000] "GET / HTTP/1.1" 200 1'
    - '127.0.0.1 - - [10/Oct/2023:13:55:36] "GET / HTTP/1.1" 200 1'
    - '127.0.0.1 - - [10/Oct/2023:13:55:36 +0000] "GET / HTTP/3" 200 1'
    - '127.0.0.1 - - [10/Oct/2023:13:55:36 +0000] "GET / HTTP/1.1" 200 -'
    - '127.0.0.1 - - [10/Oct/2023:13:55:36 +0000] "GET / HTTP/1.1" 2000 1'
    - '127.0.0.1 -- [10/Oct/2023:13:55:36 +0000] "GET / HTTP/1.1" 200 1'
    - '127.0.0.1 - bob smith [10/Oct/2023:13:55:36 +0000] "GET / HTTP/1.1" 200 1'
    - '127.0.0.1 - - [10/Oct/2023:13:55:36 +0000] "GET / HTTP/1.1" 200 1 "-" "curl/8.0"'
    - 'host=web1 127.0.0.1 - - [10/Oct/2023:13:55:36 +0000] "GET / HTTP/1.1" 200 1'
  pitfall: Long formats break on details such as the HTTP version list, the month case or the size written as a hyphen.

- id: logs-05
  difficulty: hard
  status: ok
  description: >-
    Flag slow operations: lines that contain a duration of at least 1000 milliseconds, written as an integer without
    leading zeros immediately followed by ms. The number must not be preceded by a letter, digit, underscore or dot,
    and ms must not be followed by a letter, digit or underscore.
  regex: '/(?<![\w.])[1-9]\d{3,}ms\b/'
  match: ['took 1000ms', 'duration=2500ms', 'GET /x 12345ms', 'latency:1500ms total', '1000ms', 'slow (99999ms)']
  no_match: ['took 999ms', 'took 0999ms', 'took 1500s', 'took 1500msec', 'took 1.5000ms', 'id42000ms', 'took 1000 ms']
  pitfall: Without the lookbehind, 999ms is not matched but 0999ms or 1.5000ms are.

- id: logs-06
  difficulty: medium
  status: ok
  description: >-
    A frame line from a Python traceback: exactly two spaces, the word File, a space, a file path in double quotes
    (at least one character, no double quote inside), a comma, a space, line, a space, a positive line number without
    leading zeros, a comma, a space, in, a space, and the function name, which is either an identifier (ASCII letters,
    digits and underscores, not starting with a digit) or the literal <module>.
  regex: '/^  File "[^"]+", line [1-9]\d*, in (?:[A-Za-z_]\w*|<module>)$/'
  match: ['  File "/app/main.py", line 10, in main', '  File "app.py", line 1, in <module>', '  File "C:\proj\x.py", line 245, in _helper', '  File "/usr/lib/python3.12/json/__init__.py", line 346, in loads', '  File "<stdin>", line 3, in f', '  File "a b.py", line 7, in run2']
  no_match: [' File "/app/main.py", line 10, in main', '  File "/app/main.py", line 0, in main', '  File "/app/main.py", line 10, in 2main', '  File /app/main.py, line 10, in main', '  File "/app/main.py", line 10 in main', '  File "/app/main.py", line 10, in <lambda>', '  file "/app/main.py", line 10, in main', '  File "", line 1, in f', '  File "/app/main.py", line 10, in main()', 'x  File "/a.py", line 1, in f']
  pitfall: Accepting other angle-bracket names such as <lambda>, which the description excludes.

- id: logs-07
  difficulty: medium
  status: ok
  description: >-
    A structured log line: a UTC timestamp written YYYY-MM-DDTHH:MM:SS.mmmZ with exactly three millisecond digits,
    a month from 01 to 12, a day from 01 to 31, hours from 00 to 23, minutes and seconds from 00 to 59. Then a space, a
    level in lowercase (debug, info, warn or error), a space and a message of at least one character.
  regex: '/^\d{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\d|3[01])T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d\.\d{3}Z (?:debug|info|warn|error) .+$/'
  match: ['2024-03-15T08:30:00.000Z info server started', '2023-12-31T23:59:59.999Z error db: timeout', '2024-01-01T00:00:00.123Z debug x', '2024-02-29T12:00:00.500Z warn retrying in 5s', '1999-07-04T09:09:09.009Z info ok', '2024-10-10T10:10:10.010Z error failed']
  no_match: ['2024-03-15T08:30:00Z info x', '2024-03-15T08:30:00.000 info x', '2024-03-15T24:00:00.000Z info x', '2024-13-15T08:30:00.000Z info x', '2024-03-15T08:30:00.000Z INFO x', '2024-03-15 08:30:00.000Z info x', '2024-03-15T08:30:00.000Z info', '2024-03-15T08:30:00.0000Z info x', 'ts=2024-03-15T08:30:00.000Z info x']
  pitfall: Forgetting that the milliseconds are mandatory and exactly three digits.

- id: logs-08
  difficulty: hard
  status: ok
  description: >-
    Find lines where a request is both started and finished: the line contains start req= followed by a request id,
    and later in the same line end req= followed by the same id. A request id is exactly 8 lowercase hexadecimal
    characters and must not be directly followed by another letter, digit or underscore.
  regex: '/start req=(?<id>[0-9a-f]{8})\b.*\bend req=\k<id>\b/'
  match: ['start req=deadbeef ... end req=deadbeef', '12:00 start req=0011aabb ok; 12:01 end req=0011aabb 20ms', 'start req=12345678 end req=12345678', 'x start req=abcdef01 y end req=ffffffff end req=abcdef01', 'start req=aaaaaaaa end req=aaaaaaaa done', '[a] start req=00000000 [b] end req=00000000']
  no_match: ['start req=deadbeef end req=deadbeee', 'end req=deadbeef start req=deadbeef', 'start req=DEADBEEF end req=DEADBEEF', 'start req=deadbee end req=deadbee', 'start req=deadbeef end req=deadbeef0', 'start req=deadbeef0 end req=deadbeef0', 'start req=deadbeef end req= deadbeef']
  pitfall: The second id must equal the first, which needs a backreference with a word boundary after it.

- id: logs-09
  difficulty: medium
  status: ok
  description: >-
    Lines that mention a fully qualified Java exception class: at least two package segments separated by dots (each
    a lowercase ASCII letter followed by lowercase letters and digits), a dot, then a class name that starts with an
    uppercase letter, continues with ASCII letters and digits, and ends with Exception or Error. The class name must not
    be followed by a letter, digit or underscore, and the first package segment must not be preceded by one.
  regex: '/\b[a-z][a-z0-9]*(?:\.[a-z][a-z0-9]*)+\.[A-Z][A-Za-z0-9]*(?:Exception|Error)\b/'
  match: ['java.lang.NullPointerException', 'Caused by: java.io.IOException: closed', 'at x: org.springframework.web.HttpMediaTypeNotSupportedException', 'java.lang.OutOfMemoryError: heap', 'com.acme.v2.BillingException thrown', 'err=java.lang.StackOverflowError']
  no_match: ['NullPointerException', 'java.lang.nullpointerexception', 'java.lang.NullPointerExceptions', 'java.lang.Exceptional', 'Java.lang.IOException', 'java..lang.IOException', 'java.lang.IOExceptionHandler', 'lang.IOException']
  pitfall: Without a word boundary at the end, names such as IOExceptionHandler match too.

- id: logs-10
  difficulty: hard
  status: ok
  description: >-
    A logfmt line: one or more key=value pairs separated by single spaces, with nothing before or after. Keys are
    lowercase ASCII letters and underscores. A value is either unquoted (one or more characters, without whitespace,
    double quotes or equals signs) or wrapped in double quotes (no double quote inside). The line must contain a pair
    whose key is level and whose unquoted value is exactly debug, info, warn or error.
  regex: '/^(?=(?:.* )?level=(?:debug|info|warn|error)(?: |$))[a-z_]+=(?:[^\s"=]+|"[^"]*")(?: [a-z_]+=(?:[^\s"=]+|"[^"]*"))*$/'
  match: ['level=info msg=started', 'ts=1700000000 level=error msg="db down" retry=3', 'level=warn', 'user_id=42 level=debug', 'msg="a b c" level=info', 'level=error err="EOF"']
  no_match: ['msg=started', 'level=fatal msg=x', 'level=info  msg=x', 'Level=info', 'level=info msg="unterminated', 'level=info msg=a=b', ' level=info', 'level="info"', 'level=infos msg=x']
  pitfall: Checking the presence of the level pair and the overall structure at once requires a lookahead.
