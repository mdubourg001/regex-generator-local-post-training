# Benchmark, catégorie passwords. Format et contrôles : scripts/benchmark.py.

- id: passwords-01
  difficulty: simple
  status: ok
  description: >-
    Minimal password rule: at least 8 characters, and no whitespace of any kind anywhere.
  regex: '/^\S{8,}$/'
  match: ['abcdefgh', 'P@ssw0rd!', '12345678', 'ünïcödé1', 'aaaaaaaaaaaaaaaaaaaa', 'x-y_z.123']
  no_match: ['abcdefg', 'abc defgh', ' abcdefgh', 'abcdefgh ', '', "pass\tword1"]
  pitfall: Writing .{8,}, which accepts spaces.

- id: passwords-02
  difficulty: simple
  status: ok
  description: >-
    PIN code: exactly 4 digits or exactly 6 digits. Five digits are not allowed.
  regex: '/^(?:\d{4}|\d{6})$/'
  match: ['1234', '0000', '123456', '000000', '9876', '987654']
  no_match: ['12345', '123', '1234567', '12 34', '12a4', '1234 ']
  pitfall: Writing \d{4,6}, which accepts five digits.

- id: passwords-03
  difficulty: medium
  status: ok
  description: >-
    Password policy for the admin console: 10 to 64 characters, with at least one lowercase letter, one uppercase
    letter, one digit and one special character among ! @ # $ % ^ & *. Only ASCII letters, digits and those special
    characters are allowed.
  regex: '/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{10,64}$/'
  match: ['Abcdefgh1!', 'Passw0rd#2024', 'aA1!aA1!aA', 'Z9&yyyyyyyyy', 'Hello*World7', 'qwertY7$ui']
  no_match: ['Abcdefgh12', 'abcdefgh1!x', 'ABCDEFGH1!X', 'Abcdefghi!', 'Abcdef1!', 'Abcdefgh1!?', 'Abcdef gh1!']
  pitfall: Checking the required classes but not restricting the allowed characters.

- id: passwords-04
  difficulty: medium
  status: ok
  description: >-
    Password of 8 to 32 characters without any whitespace, rejected if the same character appears three or more
    times in a row.
  regex: '/^(?!.*(.)\1\1)\S{8,32}$/'
  match: ['aabbccdd', 'Passw0rd', '112233445566', 'abcABC123', 'a1a1a1a1', 'zz9zz9zz']
  no_match: ['aaabcdef', 'Passsword', 'abc111def', 'abcdefg!!!', 'abcdefg', 'abcd efgh', 'abcdefghijabcdefghijabcdefghijabc']
  pitfall: Rejecting any repeated character instead of three in a row.

- id: passwords-05
  difficulty: medium
  status: ok
  description: >-
    Secret key format check before saving it to the config: the prefix sk_live_ or sk_test_, followed by exactly 24
    ASCII letters or digits.
  regex: '/^sk_(?:live|test)_[A-Za-z0-9]{24}$/'
  match: ['sk_live_abcdefghijklmnopqrstuvwx', 'sk_test_ABCDEFGHIJKLMNOPQRSTUVWX', 'sk_test_000000000000000000000000', 'sk_live_a1B2c3D4e5F6g7H8i9J0k1L2', 'sk_live_ZZZZZZZZZZZZZZZZZZZZZZZZ', 'sk_test_123456789012345678901234']
  no_match: ['sk_prod_abcdefghijklmnopqrstuvwx', 'sk_live_abcdefghijklmnopqrstuvw', 'sk_live_abcdefghijklmnopqrstuvwxy', 'pk_live_abcdefghijklmnopqrstuvwx', 'sk_live_abcdefghijklmnopqrstuv-x', 'SK_LIVE_abcdefghijklmnopqrstuvwx', ' sk_live_abcdefghijklmnopqrstuvwx']
  pitfall: Using \w, which lets underscores into the 24-character body.

- id: passwords-06
  difficulty: hard
  status: ok
  description: >-
    Password of at least 8 characters (any characters except line breaks) that must not contain the word admin or the
    word password anywhere, in any letter case.
  regex: '/^(?!.*(?:admin|password)).{8,}$/i'
  match: ['Tr0ub4dor&3', 'correct horse', 'adm1nistrator', 'passw0rd123', 'pass word!', 'my-secret-key']
  no_match: ['password123', 'MyPassWord!', 'ADMIN2024!!', 'superadmin1', 'xxPASSWORDxx', 'short1!', '12345678admin']
  pitfall: Anchoring the negative lookahead without .* so it only checks the beginning of the string.

- id: passwords-07
  difficulty: hard
  status: ok
  description: >-
    Diceware-style passphrase field: four or more words of at least 3 lowercase ASCII letters each, joined by a
    separator that is either a single space or a single hyphen. The same separator must be used throughout, and there
    is no leading or trailing separator.
  regex: '/^[a-z]{3,}([ -])[a-z]{3,}(?:\1[a-z]{3,}){2,}$/'
  match: ['correct horse battery staple', 'one-two-six-ten', 'alpha beta gamma delta epsilon', 'abc-def-ghi-jkl', 'the quick brown fox jumps', 'aaa-bbb-ccc-ddd']
  no_match: ['correct horse battery', 'correct horse-battery staple', 'correct  horse battery staple', 'Correct horse battery staple', 'correct horse battery staple ', 'an apple a day keeps', 'correct horse battery st4ple', 'correct_horse_battery_staple']
  pitfall: Allowing either separator between each pair of words, which accepts mixed separators.

- id: passwords-08
  difficulty: hard
  status: ok
  description: >-
    Numeric PIN of 4 to 6 digits. Reject PINs made of a single repeated digit (like 1111 or 000000) and the ascending
    sequences 1234, 12345 and 123456.
  regex: '/^(?!(\d)\1+$)(?!(?:1234|12345|123456)$)\d{4,6}$/'
  match: ['1235', '9876', '112233', '4321', '0001', '123457']
  no_match: ['1111', '000000', '1234', '12345', '123456', '123', '1234567', '12a4']
  pitfall: Forgetting the end anchor inside the lookaheads, which rejects every PIN starting with 1234.

- id: passwords-09
  difficulty: simple
  status: ok
  description: >-
    Temporary password generated by our system: exactly 12 characters, uppercase letters and digits only, excluding
    the ambiguous characters 0, O, 1 and I.
  regex: '/^[A-HJ-NP-Z2-9]{12}$/'
  match: ['ABCDEFGH2345', 'ZZZZZZZZZZZZ', '23456789ABCD', 'K7M9P2Q4R6S8', 'HJKLMNPQRSTU', '999999999999']
  no_match: ['ABCDEFGH234', 'ABCDEFGH23456', 'ABCDEFGH2340', 'ABCDEFGHI234', 'ABCDEFGO2345', 'abcdefgh2345', 'ABCDEFGH2341', 'ABCD EFGH234']
  pitfall: Excluding the letters but not the digits 0 and 1, or the other way around.

- id: passwords-10
  difficulty: hard
  status: ok
  description: >-
    A form posts the password and its confirmation in one field, separated by a single pipe character. Both must be
    exactly identical, and each must be 8 to 20 characters long, with no whitespace and no pipe.
  regex: '/^([^\s|]{8,20})\|\1$/'
  match: ['Passw0rd|Passw0rd', 'abcdefgh|abcdefgh', 'x!y@z#12|x!y@z#12', 'ABCDEFGHIJKLMNOPQRST|ABCDEFGHIJKLMNOPQRST', '12345678|12345678', 'über1234|über1234']
  no_match: ['Passw0rd|passw0rd', 'Passw0rd|Passw0rd2', 'abcdefg|abcdefg', 'Passw0rd | Passw0rd', 'Passw0rd|Passw0rd|Passw0rd', 'abc defgh|abc defgh', 'Passw0rd||Passw0rd', 'ABCDEFGHIJKLMNOPQRSTU|ABCDEFGHIJKLMNOPQRSTU']
  pitfall: Validating each half separately instead of using a backreference for equality.
