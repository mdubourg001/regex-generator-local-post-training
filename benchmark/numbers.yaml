# Benchmark, catégorie numbers. Format et contrôles : scripts/benchmark.py.

- id: numbers-01
  difficulty: simple
  status: ok
  description: >-
    I need to validate a quantity field in an order form: a whole number from 1 to 999, without leading zeros and
    without a sign.
  regex: '/^[1-9]\d{0,2}$/'
  match: ['1', '9', '10', '99', '100', '450', '999']
  no_match: ['0', '1000', '012', ' 5', '-5', '5.0', '']
  pitfall: Forgetting to forbid 0 and leading zeros, or not anchoring so that 1000 matches.

- id: numbers-02
  difficulty: simple
  status: ok
  description: >-
    Match an integer that may be negative: an optional minus sign, then digits. No leading zeros, except for the number
    zero itself. A plus sign is not allowed, and neither is -0.
  regex: '/^(?:0|-?[1-9]\d*)$/'
  match: ['0', '7', '-7', '42', '-1000', '1234567890']
  no_match: ['-0', '007', '+5', '-', '1.0', '1 000', '--1']
  pitfall: Allowing -0 or leading zeros with a naive -?\d+.

- id: numbers-03
  difficulty: simple
  status: ok
  description: >-
    Price input: digits, optionally followed by a dot and one or two decimals. There must be at least one digit before
    the dot. No sign and no thousands separators.
  regex: '/^\d+(?:\.\d{1,2})?$/'
  match: ['0', '0.5', '12.99', '100', '3.10', '1234567.0']
  no_match: ['.5', '5.', '5.123', '-1.00', '1,50', '1.2.3', '12.99 ']
  pitfall: Accepting a trailing dot or more than two decimals.

- id: numbers-04
  difficulty: medium
  status: ok
  description: >-
    A percentage between 0 and 100 inclusive, with up to two decimal places, immediately followed by a percent sign.
    The value 100 can only be written as 100, 100.0 or 100.00.
  regex: '/^(?:100(?:\.0{1,2})?|\d{1,2}(?:\.\d{1,2})?)%$/'
  match: ['0%', '7.5%', '42%', '99.99%', '100%', '100.0%', '100.00%']
  no_match: ['100.01%', '101%', '50', '50 %', '12.345%', '-1%', '.5%']
  pitfall: Letting 100.5% through by treating 100 like any three-digit number.

- id: numbers-05
  difficulty: medium
  status: ok
  description: >-
    A hexadecimal integer literal as written in JavaScript source code: 0x or 0X, then one or more hex digits in any
    case. Numeric separators (single underscores) are allowed, but only between two digits.
  regex: '/^0[xX][0-9a-fA-F]+(?:_[0-9a-fA-F]+)*$/'
  match: ['0x0', '0XFF', '0xdead_beef', '0x1_2_3', '0xABCdef', '0x00']
  no_match: ['0x', '0x_FF', '0xFF_', '0xG1', '0x1__2', 'x1F', '0b101', ' 0x1']
  pitfall: Allowing separators at the edges or doubled, or forgetting the uppercase X.

- id: numbers-06
  difficulty: hard
  status: ok
  description: >-
    A number in normalized scientific notation, as found in our config files: an optional sign, a mantissa with exactly
    one non-zero digit before an optional fractional part (like 1.5, 9 or 3.25), then e or E, then an optional sign and
    an exponent of one to three digits.
  regex: '/^[+-]?[1-9](?:\.\d+)?[eE][+-]?\d{1,3}$/'
  match: ['1e5', '1.5E-3', '-9.99e+100', '+3e0', '6.022e23', '2E999']
  no_match: ['10e5', '1.e5', '1e', '1e1000', '0.5e3', '1.5e-3 ', 'e5', '1.5x10^3']
  pitfall: Accepting a mantissa of 10 or more, or an empty fractional part after the dot.

- id: numbers-07
  difficulty: hard
  status: ok
  description: >-
    An integer with an optional leading minus sign, written either as plain digits (1234567) or with commas as
    thousands separators (1,234,567): a first group of one to three digits, then groups of exactly three. Mixing both
    styles, like 1234,567, is invalid. No leading zeros, except for the number 0 itself.
  regex: '/^-?(?:0|[1-9]\d*|[1-9]\d{0,2}(?:,\d{3})+)$/'
  match: ['0', '1234567', '1,234,567', '-12,345', '999', '1,000']
  no_match: ['1234,567', '12,34,567', '01,234', ',123', '1,2345', '1,000,', '1.000']
  pitfall: Writing \d{1,3}(,\d{3})* and accepting a first group that is longer than three digits.

- id: numbers-08
  difficulty: medium
  status: ok
  description: >-
    An even positive integer, without sign and without leading zeros.
  regex: '/^(?:[1-9]\d*[02468]|[2468])$/'
  match: ['2', '8', '10', '98', '100', '1234']
  no_match: ['0', '1', '13', '101', '012', '2.0', '-2']
  pitfall: Accepting 0 (not positive) or a leading zero such as 012.

- id: numbers-09
  difficulty: hard
  status: ok
  description: >-
    A fraction: an optional minus sign, a numerator, a slash and a denominator. The numerator has no leading zeros
    unless it is exactly 0; the denominator is a positive integer without leading zeros. A single optional space is
    allowed on each side of the slash.
  regex: '/^-?(?:0|[1-9]\d*) ?\/ ?[1-9]\d*$/'
  match: ['1/2', '-3/4', '0/5', '10 / 3', '7 /8', '22/7']
  no_match: ['1/0', '1/02', '01/2', '1  /2', '1/', '/2', '1/-2', '1.5/2']
  pitfall: Allowing a zero denominator or several spaces around the slash.

- id: numbers-10
  difficulty: hard
  status: ok
  description: >-
    A Roman numeral between 1 and 3999, in uppercase, using the standard subtractive notation (IV, IX, XL, XC, CD, CM).
    Forms like IIII or VX are invalid.
  regex: '/^(?=[MDCLXVI])M{0,3}(?:CM|CD|D?C{0,3})(?:XC|XL|L?X{0,3})(?:IX|IV|V?I{0,3})$/'
  match: ['I', 'IV', 'IX', 'XLII', 'CDXLIV', 'MCMXCIV', 'MMMCMXCIX']
  no_match: ['', 'IIII', 'VX', 'IC', 'MMMM', 'iv', 'XLII ']
  pitfall: The classic pattern matches the empty string unless a lookahead requires at least one character.
