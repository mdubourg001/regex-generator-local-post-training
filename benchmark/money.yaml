# Benchmark, catégorie money. Format et contrôles : scripts/benchmark.py.

- id: money-01
  difficulty: simple
  status: ok
  description: >-
    US dollar amount for a checkout field: a dollar sign immediately followed by digits, with an optional dot and
    exactly two cents digits. No thousands separators, no spaces, no sign.
  regex: '/^\$\d+(?:\.\d{2})?$/'
  match: ['$0', '$5', '$19.99', '$100.00', '$1234567', '$0.50']
  no_match: ['19.99', '$19.9', '$19.999', '$ 19.99', '$-5', '$1,000', '$19.99 ']
  pitfall: Forgetting to escape the dollar sign, which then acts as an end anchor.

- id: money-02
  difficulty: simple
  status: ok
  description: >-
    Euro price in French style: digits, optionally a comma followed by exactly two digits, then one space and the euro
    sign at the end. Nothing else.
  regex: '/^\d+(?:,\d{2})? €$/'
  match: ['0 €', '12 €', '12,50 €', '1999,99 €', '3,05 €', '100 €']
  no_match: ['12,5 €', '12.50 €', '12,50€', '€12,50', '12,50  €', '12,500 €']
  pitfall: Using a dot as decimal separator or forgetting the space before the euro sign.

- id: money-03
  difficulty: simple
  status: ok
  description: >-
    amount prefixed by an ISO 4217 currency code: exactly three uppercase letters, one space, then digits with an
    optional dot and two decimals, no sign
  regex: '/^[A-Z]{3} \d+(?:\.\d{2})?$/'
  match: ['USD 10', 'EUR 9.99', 'JPY 1500', 'GBP 0.01', 'CHF 250.00', 'CAD 1']
  no_match: ['usd 10', 'US 10', 'USDD 10', 'USD10', 'USD 10.5', 'USD 10.00 ', 'EUR -5']
  pitfall: Making the match case-insensitive, or accepting codes that are not exactly three letters.

- id: money-04
  difficulty: medium
  status: ok
  description: >-
    Amounts in our accounting export: a dollar sign, an integer part with commas between every group of three digits
    (the first group has one to three digits), a dot and exactly two decimals. Negative amounts are wrapped in
    parentheses around the whole thing, dollar sign included; there is no minus sign.
  regex: '/^(?:\$\d{1,3}(?:,\d{3})*\.\d{2}|\(\$\d{1,3}(?:,\d{3})*\.\d{2}\))$/'
  match: ['$0.00', '$5.25', '$1,234.56', '($1,234.56)', '($0.99)', '$999,999.00']
  no_match: ['$1234.56', '($1,234.56', '$1,234.56)', '-$1,234.56', '$1,234.5', '$12,34.56', '(1,234.56)']
  pitfall: Making each parenthesis optional independently, so that unbalanced parentheses pass.

- id: money-05
  difficulty: medium
  status: ok
  description: >-
    A Bitcoin amount shown in a wallet: an integer part without leading zeros (a single 0 is fine), optionally a dot
    with one to eight decimals, then a space and BTC in uppercase.
  regex: '/^(?:0|[1-9]\d*)(?:\.\d{1,8})? BTC$/'
  match: ['0 BTC', '0.00000001 BTC', '1.5 BTC', '21000000 BTC', '0.12345678 BTC', '10 BTC']
  no_match: ['0.123456789 BTC', '01 BTC', '1.5 btc', '1.5BTC', '.5 BTC', '1. BTC', '1.5 BTC ']
  pitfall: Allowing more than eight decimals (Bitcoin has satoshi precision) or leading zeros.

- id: money-06
  difficulty: medium
  status: ok
  description: >-
    A price where the currency symbol, one of $, € or £, is written either immediately before the number or
    immediately after it, exactly once. The number is digits with an optional dot and exactly two decimals.
  regex: '/^(?:[$€£]\d+(?:\.\d{2})?|\d+(?:\.\d{2})?[$€£])$/'
  match: ['$5', '5€', '£12.50', '12.50$', '€0.99', '100£']
  no_match: ['5', '$5$', '€5€', '$ 5', '5.5€', '$-5', '€5.999', '¥5', '5¥']
  pitfall: Making both symbol positions optional, which accepts a bare number or a symbol on both sides.

- id: money-07
  difficulty: hard
  status: ok
  description: >-
    Rupee amount in Indian digit grouping: the rupee sign, then the integer part where the last three digits form one
    group and the digits before them are grouped in pairs, all separated by commas. Amounts below 1000 have no comma.
    No leading zeros (0 alone is fine). Optional dot with exactly two decimals.
  regex: '/^₹(?:0|[1-9]\d{0,2}|[1-9]\d?(?:,\d{2})*,\d{3})(?:\.\d{2})?$/'
  match: ['₹0', '₹999', '₹1,000', '₹12,345', '₹1,23,456.50', '₹12,34,56,789', '₹5.00']
  no_match: ['₹1000', '₹123,456', '₹1,23,4567', '₹01,000', '₹1,00,00', 'Rs 1,000', '₹1,000.5']
  pitfall: Applying Western groups of three everywhere instead of pairs before the last group.

- id: money-08
  difficulty: hard
  status: ok
  description: >-
    Euro amount in German format: the integer part is either plain digits or fully grouped with dots every three digits
    (first group of one to three digits), never a mix of both. Then a comma and exactly two decimals, which are
    mandatory, then a space and the euro sign.
  regex: '/^(?:\d+|\d{1,3}(?:\.\d{3})+),\d{2} €$/'
  match: ['0,99 €', '1234,56 €', '1.234,56 €', '12.345.678,00 €', '999,00 €', '1.000,00 €']
  no_match: ['1234.567,00 €', '1.234,5 €', '1,234.56 €', '1.234,56€', '1.23,00 €', '.234,56 €', '1.234,56 € ']
  pitfall: Allowing the dot anywhere in the integer part, which accepts partial or mixed grouping.

- id: money-09
  difficulty: medium
  status: ok
  description: >-
    For a log filter: the line contains a dollar amount, meaning a dollar sign directly followed by digits, a dot and
    exactly two decimals. The dollar sign must not be preceded by a letter, digit, underscore or another dollar sign,
    and the amount must not be followed by another digit.
  regex: '/(?<![\w$])\$\d+\.\d{2}(?!\d)/'
  match: ['Total: $12.50', 'charged $0.99 today', '$5.00', 'refund of $1000.00.', '($3.10)', 'paid $7.25, thanks']
  no_match: ['Total: 12.50', 'cost $12.5', 'US$12.50', 'price $12.505', '$.99', 'Total: $ 12.50', '$$12.50']
  pitfall: Forgetting the boundaries, so that US$12.50 or $12.505 are reported.

- id: money-10
  difficulty: hard
  status: ok
  description: >-
    Price range filter: two amounts separated by a hyphen, with at most one optional space on each side of the hyphen.
    Each amount is a currency symbol ($, € or £) directly followed by a whole number without leading zeros, and both
    sides must use the same currency symbol.
  regex: '/^(?<cur>[$€£])[1-9]\d* ?- ?\k<cur>[1-9]\d*$/'
  match: ['$10-$20', '€5 - €15', '£100-£250', '$1 -$2', '€99- €100', '$7 - $7']
  no_match: ['$10-€20', '$10-20', '10-$20', '$10--$20', '$010-$20', '$10  - $20', '£5-£ 6', '$10-$20 ']
  pitfall: Allowing different currencies on each side; this needs a backreference to the first symbol.
